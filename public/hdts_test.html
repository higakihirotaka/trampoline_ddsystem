<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QIRA 接続テスト</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', monospace; background: #0d1117; color: #c9d1d9; min-height: 100vh; padding: 24px; }
  h1 { font-size: 1.2rem; color: #58a6ff; margin-bottom: 20px; letter-spacing: 0.05em; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .card-title { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; color: #8b949e; text-transform: uppercase; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  label { font-size: 0.8rem; color: #8b949e; white-space: nowrap; }
  input[type=text], input[type=number] {
    background: #0d1117; border: 1px solid #30363d; color: #c9d1d9;
    padding: 5px 10px; border-radius: 4px; font-size: 0.85rem; font-family: monospace;
    width: 240px;
  }
  input:focus { outline: none; border-color: #58a6ff; }
  button {
    padding: 7px 18px; border-radius: 5px; border: none; cursor: pointer;
    font-size: 0.82rem; font-weight: 600; transition: 0.15s;
  }
  .btn-primary { background: #238636; color: #fff; }
  .btn-primary:hover { background: #2ea043; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-secondary { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
  .btn-secondary:hover { background: #30363d; }
  .status-row { display: flex; gap: 16px; margin-bottom: 12px; flex-wrap: wrap; }
  .status-item { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #484f58; flex-shrink: 0; }
  .dot.ok  { background: #3fb950; box-shadow: 0 0 6px #3fb950; }
  .dot.err { background: #f85149; box-shadow: 0 0 6px #f85149; }
  .dot.pending { background: #d29922; box-shadow: 0 0 6px #d29922; animation: blink 1s ease infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  pre {
    background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
    padding: 14px; font-size: 0.78rem; line-height: 1.6; overflow-x: auto;
    white-space: pre-wrap; word-break: break-all; min-height: 60px;
    color: #e6edf3; font-family: 'Cascadia Code', 'Consolas', monospace;
  }
  .tag-ok    { color: #3fb950; }
  .tag-err   { color: #f85149; }
  .tag-warn  { color: #d29922; }
  .endpoint-label { font-size: 0.72rem; color: #58a6ff; font-family: monospace; margin-bottom: 6px; }
  .ts { font-size: 0.7rem; color: #484f58; margin-top: 6px; }
  hr { border: none; border-top: 1px solid #21262d; margin: 16px 0; }
</style>
</head>
<body>

<h1>📡 QIRA 接続テスト</h1>

<!-- 環境警告 -->
<div id="env-banner" class="card" style="display:none; border-color:#d29922; background:#231a08;">
  <div style="color:#f0b429; font-weight:700; font-size:0.9rem;">⚠️ 接続環境の注意</div>
  <div id="env-msg" style="font-size:0.84rem; margin-top:8px; line-height:1.6;"></div>
</div>

<!-- CJPと同じ経路で取得（推奨） -->
<div class="card" style="border-color:#238636;">
  <div class="card-title" style="color:#3fb950;">🔄 CJPと同じ経路で取得（推奨）— 生データを表示</div>
  <div class="row">
    <button class="btn-primary" id="btn-auto" onclick="autoFetch()">📥 QIRAから取得（CJPと同じ）</button>
    <span id="auto-status" style="font-size:0.82rem;margin-left:8px;"></span>
  </div>
  <div class="endpoint-label" id="auto-url" style="margin-top:8px;">—</div>
  <div class="card-title" style="margin-top:12px;">生レスポンス（RAW）</div>
  <pre id="auto-raw">（未取得）ボタンを押すとQIRAから届いた生の内容をそのまま表示します。</pre>
  <div class="ts" id="auto-ts"></div>
</div>

<!-- CJP連携設定 -->
<div class="card" style="border-color:#0d9488;">
  <div class="card-title" style="color:#0d9488;">⚙️ CJP連携設定（CJP画面のHDTSボタンに反映）</div>
  <div class="row">
    <label>QIRAの場所</label>
    <select id="cjp-mode" style="background:#0d1117;border:1px solid #30363d;color:#c9d1d9;padding:5px 8px;border-radius:4px;font-size:0.82rem;">
      <option value="local">同一PC（localhost:8080）</option>
      <option value="remote">別PC（LAN接続）</option>
    </select>
  </div>
  <div class="row" id="cjp-ip-row" style="display:none;">
    <label>QIRA PC の IP</label>
    <input type="text" id="cjp-ip" value="192.168.100.2" style="width:160px;">
    <label style="margin-left:8px;">Port</label>
    <input type="number" id="cjp-port" value="8080" style="width:70px;">
  </div>
  <div class="row" style="margin-top:8px;align-items:center;">
    <button class="btn-primary" onclick="saveCjpConfig()">💾 CJP画面に設定を保存</button>
    <span id="cjp-save-status" style="font-size:0.8rem;margin-left:12px;"></span>
  </div>
  <div id="cjp-current" style="font-size:0.75rem;color:#484f58;margin-top:8px;font-family:monospace;"></div>
</div>

<!-- 接続設定（テスト用） -->
<div class="card">
  <div class="card-title">接続設定（このページのテスト用）</div>
  <div class="row">
    <label>プロキシ経由</label>
    <input type="text" id="base-url" value="/api/qira" style="width:200px">
    <label style="margin-left:8px;">直接接続</label>
    <input type="text" id="direct-url" value="http://localhost:8080" style="width:200px">
  </div>
  <div class="row" style="margin-top:4px;">
    <label>接続モード</label>
    <select id="mode" style="background:#0d1117;border:1px solid #30363d;color:#c9d1d9;padding:5px 8px;border-radius:4px;font-size:0.82rem;">
      <option value="proxy">プロキシ経由（localhost:3000 経由）</option>
      <option value="direct">直接接続（QIRA に直接）</option>
    </select>
  </div>
</div>

<!-- ステータス -->
<div class="card">
  <div class="card-title">ステータス</div>
  <div class="status-row">
    <div class="status-item"><div class="dot" id="dot-health"></div><span id="lbl-health">health — 未確認</span></div>
    <div class="status-item"><div class="dot" id="dot-state"></div><span id="lbl-state">state — 未確認</span></div>
    <div class="status-item"><div class="dot" id="dot-result"></div><span id="lbl-result">result — 未確認</span></div>
  </div>
  <div class="row">
    <button class="btn-secondary" onclick="checkAll()">🔍 全エンドポイント確認</button>
  </div>
</div>

<!-- /health -->
<div class="card">
  <div class="card-title">GET /health</div>
  <div class="endpoint-label" id="ep-health">—</div>
  <div class="row">
    <button class="btn-secondary" onclick="fetchEndpoint('health')">取得</button>
    <span id="status-health" style="font-size:0.8rem;margin-left:8px;"></span>
  </div>
  <pre id="out-health">（未取得）</pre>
  <div class="ts" id="ts-health"></div>
</div>

<!-- /state -->
<div class="card">
  <div class="card-title">GET /state</div>
  <div class="endpoint-label" id="ep-state">—</div>
  <div class="row">
    <button class="btn-secondary" onclick="fetchEndpoint('state')">取得</button>
    <span id="status-state" style="font-size:0.8rem;margin-left:8px;"></span>
  </div>
  <pre id="out-state">（未取得）</pre>
  <div class="ts" id="ts-state"></div>
</div>

<!-- /routineresult -->
<div class="card">
  <div class="card-title">GET /routineresult</div>
  <div class="endpoint-label" id="ep-result">—</div>
  <div class="row">
    <button class="btn-primary" id="btn-result" onclick="fetchEndpoint('result')">📥 取得</button>
    <span id="status-result" style="font-size:0.8rem;margin-left:8px;"></span>
  </div>
  <pre id="out-result">（未取得）</pre>
  <div class="ts" id="ts-result"></div>
</div>

<!-- パース結果 -->
<div class="card" id="card-parsed" style="display:none">
  <div class="card-title">パース結果（ToF / HD）</div>
  <pre id="out-parsed"></pre>
</div>

<script>
  const EP = {
    health: { proxy: '/api/qira/health', direct: '/health',        label: 'health' },
    state:  { proxy: '/api/qira/state',  direct: '/state',         label: 'state'  },
    result: { proxy: '/api/qira/result', direct: '/routineresult', label: 'result' },
  };

  function getUrl(key) {
    const mode = document.getElementById('mode').value;
    const base = mode === 'direct'
      ? document.getElementById('direct-url').value.replace(/\/$/, '')
      : document.getElementById('base-url').value.replace(/\/$/, '');
    return base + EP[key][mode === 'direct' ? 'direct' : 'proxy'].replace(/.*\//, '/');
  }

  function fullUrl(key) {
    const mode = document.getElementById('mode').value;
    if (mode === 'direct') {
      return document.getElementById('direct-url').value.replace(/\/$/, '') + EP[key].direct;
    }
    return EP[key].proxy;
  }

  function updateEpLabels() {
    ['health','state','result'].forEach(k => {
      document.getElementById('ep-' + k).textContent = fullUrl(k);
    });
  }

  document.getElementById('mode').addEventListener('change', updateEpLabels);
  document.getElementById('base-url').addEventListener('input', updateEpLabels);
  document.getElementById('direct-url').addEventListener('input', updateEpLabels);
  updateEpLabels();

  // ---- CJP連携設定 ----
  const QIRA_KEY = 'qiraBaseUrl';

  function loadCjpConfig() {
    const saved = localStorage.getItem(QIRA_KEY);
    const curEl = document.getElementById('cjp-current');
    if (saved) {
      curEl.textContent = '保存済み: ' + saved;
      const isRemote = !saved.includes('localhost') && !saved.includes('127.0.0.1');
      document.getElementById('cjp-mode').value = isRemote ? 'remote' : 'local';
      if (isRemote) {
        const m = saved.match(/http:\/\/([^:]+):(\d+)/);
        if (m) { document.getElementById('cjp-ip').value = m[1]; document.getElementById('cjp-port').value = m[2]; }
        document.getElementById('cjp-ip-row').style.display = '';
        // テスト用直接接続URLにも反映
        document.getElementById('direct-url').value = saved;
        updateEpLabels();
      }
    } else {
      curEl.textContent = '未設定（CJP画面はlocalhost:8080を使用）';
    }
  }

  async function saveCjpConfig() {
    const mode = document.getElementById('cjp-mode').value;
    const ip   = mode === 'remote' ? document.getElementById('cjp-ip').value.trim()   : 'localhost';
    const port = mode === 'remote' ? document.getElementById('cjp-port').value.trim() : '8080';
    const baseUrl = 'http://' + ip + ':' + port;

    // localStorage に保存（CJP画面の直接接続用）
    localStorage.setItem(QIRA_KEY, baseUrl);
    document.getElementById('direct-url').value = baseUrl;
    updateEpLabels();

    const st  = document.getElementById('cjp-save-status');
    const cur = document.getElementById('cjp-current');
    cur.textContent = '保存済み: ' + baseUrl;

    // ローカルサーバー（node server.js）が起動中なら /api/config にも送信
    let serverMsg = '';
    try {
      const r = await fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ host: ip, port: parseInt(port) }),
        signal: AbortSignal.timeout(1000)
      });
      if (r.ok) serverMsg = ' ＋ サーバー設定も更新';
    } catch { /* サーバー未起動の場合は無視 */ }

    st.style.color = '#3fb950';
    st.textContent = '✅ 保存しました' + serverMsg;
    setTimeout(() => { st.textContent = ''; }, 4000);
  }

  document.getElementById('cjp-mode').addEventListener('change', e => {
    document.getElementById('cjp-ip-row').style.display = e.target.value === 'remote' ? '' : 'none';
  });

  loadCjpConfig();

  function ts() { return new Date().toLocaleTimeString('ja-JP', {hour12:false}); }

  function syntaxHL(json) {
    return json
      .replace(/(".*?")\s*:/g, '<span style="color:#79c0ff">$1</span>:')
      .replace(/:\s*(".*?")/g, ': <span style="color:#a5d6ff">$1</span>')
      .replace(/:\s*(true|false)/g, ': <span style="color:#ff7b72">$1</span>')
      .replace(/:\s*(-?\d+\.?\d*)/g, ': <span style="color:#f0a742">$1</span>');
  }

  async function fetchEndpoint(key) {
    const url = fullUrl(key);
    const outEl = document.getElementById('out-' + key);
    const stEl  = document.getElementById('status-' + key);
    const tsEl  = document.getElementById('ts-' + key);
    const dot   = document.getElementById('dot-' + key);
    const btn   = key === 'result' ? document.getElementById('btn-result') : null;

    if (btn) btn.disabled = true;
    dot.className = 'dot pending';
    stEl.innerHTML = '<span class="tag-warn">取得中...</span>';
    outEl.textContent = '取得中...';

    try {
      const t0  = performance.now();
      const res = await fetch(url);
      const ms  = Math.round(performance.now() - t0);
      const raw = await res.text();
      const nowTs = ts();

      let pretty;
      try {
        const obj = JSON.parse(raw);
        pretty = JSON.stringify(obj, null, 2);
        outEl.innerHTML = syntaxHL(pretty);

        // /routineresult のパース
        if (key === 'result') {
          parsedResult(obj);
        }
      } catch {
        outEl.textContent = raw || '（空レスポンス）';
      }

      if (res.ok) {
        dot.className = 'dot ok';
        stEl.innerHTML = `<span class="tag-ok">✅ ${res.status} ${res.statusText}</span> <span style="color:#484f58">${ms}ms</span>`;
      } else {
        dot.className = 'dot err';
        stEl.innerHTML = `<span class="tag-err">❌ ${res.status} ${res.statusText}</span>`;
      }
      tsEl.textContent = `取得時刻: ${nowTs}`;
    } catch(e) {
      dot.className = 'dot err';
      stEl.innerHTML = `<span class="tag-err">❌ 接続失敗</span>`;
      outEl.textContent = e.message;
      tsEl.textContent = `取得時刻: ${ts()}`;
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  function parsedResult(data) {
    const card = document.getElementById('card-parsed');
    const out  = document.getElementById('out-parsed');
    card.style.display = '';

    const type = data.type || '不明';
    const mat  = data.maturity || '不明';
    const r    = type === 'synchronized' ? data.synchronizedResult : data.individualResult;

    if (!r) {
      out.innerHTML = '<span class="tag-err">individualResult / synchronizedResult が見つかりません</span>';
      return;
    }

    const tof = r.timeOfFlightInSeconds;
    const hd  = r.horizontalDisplacement;
    const cnt = r.elementCount;

    let lines = [];
    lines.push(`<span class="tag-ok">type     :</span> ${type}`);
    lines.push(`<span class="tag-ok">maturity :</span> ${mat}`);
    lines.push('');
    lines.push(`<span class="tag-ok">ToF (秒)  :</span> ${tof != null ? tof.toFixed(3) : '<span class="tag-err">null</span>'}`);
    lines.push(`<span class="tag-ok">HD (点)   :</span> ${hd  != null ? hd.toFixed(1)  : '<span class="tag-err">null</span>'}`);
    lines.push(`<span class="tag-ok">技数      :</span> ${cnt != null ? cnt            : '<span class="tag-err">null</span>'}`);

    if (r.elements && r.elements.length > 0) {
      lines.push('');
      lines.push('<span style="color:#8b949e">--- 技別 ToF ---</span>');
      r.elements.forEach((el, i) => {
        lines.push(`  #${String(i+1).padStart(2,' ')} : ToF=${el.timeOfFlightInSeconds?.toFixed(3) ?? '-'}s  HD=${el.horizontalDisplacement?.toFixed(1) ?? '-'}`);
      });
    }

    out.innerHTML = lines.join('\n');
  }

  async function checkAll() {
    await Promise.all(['health','state','result'].map(k => fetchEndpoint(k)));
  }

  // ---- 環境検知（HTTPS配信版では localhost の QIRA に届かない） ----
  (function checkEnv() {
    const isLocal = ['localhost','127.0.0.1'].includes(location.hostname);
    const banner = document.getElementById('env-banner');
    const msg = document.getElementById('env-msg');
    if (isLocal) return;
    banner.style.display = '';
    msg.innerHTML =
      `このページは <b style="color:#f85149">${location.origin}</b> で開かれています（${location.protocol}）。<br>` +
      `QIRA は通常 <b>http://localhost:8080</b> で動作していますが、<b>HTTPSページからは「混在コンテンツ」制限で http://localhost に接続できません</b>。` +
      `また <code>/api/qira/*</code> プロキシは <b>ローカルサーバー(node server.js)</b> にしか無く、配信版(Firebase)には存在しません。<br><br>` +
      `<b style="color:#3fb950">➡ CJPと同じく、ローカルサーバー経由でこのページを開いてください</b>（例: <code>http://localhost:3000/hdts_test.html</code> ／ CJPを開いているのと同じ <code>http://localhost:ポート</code>）。`;
  })();

  function escapeHtml(s) { return String(s).replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c])); }

  function diagnose(e, url) {
    if (location.protocol === 'https:' && url.startsWith('http://'))
      return '→ 原因: 混在コンテンツ（HTTPSページから http:// は取得不可）。localhost経由でこのページを開いてください。';
    if (e.name === 'TimeoutError' || /timeout|aborted/i.test(e.message))
      return '→ 原因: 応答なし（QIRA未起動 / IP・Port違い / ファイアウォール）。';
    if (e.name === 'TypeError')
      return '→ 原因: 接続不可（QIRA未起動 / CORS / 混在コンテンツのいずれか）。';
    return '';
  }

  // CJP画面の tryFetchQira と同じ優先順位で候補URLを組み立てる
  function autoAttempts() {
    const list = [];
    if (['localhost','127.0.0.1'].includes(location.hostname))
      list.push({ url: '/api/qira/result', note: 'プロキシ /api/qira/result（ローカルサーバー経由）' });
    const savedBase = localStorage.getItem(QIRA_KEY);
    const isRemote = savedBase && !savedBase.includes('localhost') && !savedBase.includes('127.0.0.1');
    if (isRemote) list.push({ url: savedBase.replace(/\/$/, '') + '/routineresult', note: '保存済みリモート ' + savedBase });
    list.push({ url: 'http://localhost:8080/routineresult', note: '直接 http://localhost:8080' });
    return list;
  }

  async function autoFetch() {
    const rawEl = document.getElementById('auto-raw');
    const stEl  = document.getElementById('auto-status');
    const urlEl = document.getElementById('auto-url');
    const tsEl  = document.getElementById('auto-ts');
    const btn   = document.getElementById('btn-auto');
    btn.disabled = true;
    stEl.innerHTML = '<span class="tag-warn">取得中...</span>';
    rawEl.textContent = '取得中...';
    const log = [];
    try {
      for (const a of autoAttempts()) {
        urlEl.textContent = 'URL: ' + a.url + '  （' + a.note + '）';
        try {
          const t0 = performance.now();
          const res = await fetch(a.url, { signal: AbortSignal.timeout(4000) });
          const ms  = Math.round(performance.now() - t0);
          const ct  = res.headers.get('content-type') || '(なし)';
          const raw = await res.text();
          log.push(`[試行] ${a.note}\n  URL : ${a.url}\n  HTTP: ${res.status} ${res.statusText} (${ms}ms)\n  Content-Type: ${ct}`);
          // HTMLが返る = QIRAプロキシ未経由（Firebase等のフォールバック）
          if (ct.includes('html') || raw.trim().startsWith('<')) {
            log.push('  ⚠️ HTMLが返っています＝QIRAに届いていません（配信版/プロキシ未経由）。localhostのローカルサーバー経由で開いてください。\n');
            continue;
          }
          // 成功: 生データ表示
          let pretty = raw;
          try { pretty = JSON.stringify(JSON.parse(raw), null, 2); } catch { log.push('  ⚠️ JSONとして解釈できませんでした（生データをそのまま表示）。'); }
          rawEl.innerHTML = `<span class="tag-ok">✅ 取得成功: ${a.note}</span>\n` +
                            `<span style="color:#484f58">HTTP ${res.status} ${res.statusText} / ${ct} / ${ms}ms</span>\n\n` +
                            escapeHtml(pretty);
          stEl.innerHTML = `<span class="tag-ok">✅ ${res.status}</span>`;
          tsEl.textContent = '取得時刻: ' + ts();
          try { parsedResult(JSON.parse(raw)); } catch {}
          return;
        } catch (e) {
          log.push(`[試行] ${a.note}\n  URL : ${a.url}\n  ❌ ${e.name}: ${e.message}\n  ${diagnose(e, a.url)}\n`);
        }
      }
      // 全滅
      stEl.innerHTML = '<span class="tag-err">❌ すべての経路で失敗</span>';
      rawEl.innerHTML = '<span class="tag-err">取得できませんでした。試行ログ：</span>\n\n' + escapeHtml(log.join('\n'));
      tsEl.textContent = '取得時刻: ' + ts();
    } finally {
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
