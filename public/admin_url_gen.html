<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL生成・共有 - Trampoline Scoring System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        :root { --primary: #37474f; --accent: #1a73e8; --bg: #eceff1; --card: #ffffff; --success: #2e7d32; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); margin: 0; padding: 20px; min-height: 100vh; color: #263238; }

        .header { text-align: center; max-width: 600px; margin: 0 auto 30px auto; }
        .event-label { font-size: 0.75em; font-weight: bold; color: #90a4ae; text-transform: uppercase; letter-spacing: 1px; }
        .event-name { font-size: 1.5em; font-weight: 900; color: var(--primary); margin: 5px 0; }

        .gen-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; max-width: 800px; margin: 0 auto; }

        .url-card { background: var(--card); padding: 30px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; border-top: 8px solid var(--primary); display: flex; flex-direction: column; align-items: center; }
        .url-card.judge  { border-top-color: #f57c00; }
        .url-card.display { border-top-color: var(--success); }
        .url-card.entry  { border-top-color: #7b1fa2; }

        .card-title { font-size: 1.1em; font-weight: 900; margin-bottom: 20px; color: #333; }

        .qr-area { background: #f8f9fa; padding: 15px; border-radius: 15px; margin-bottom: 20px; }
        canvas { display: block; }

        .url-box { background: #f1f3f4; padding: 12px; border-radius: 10px; font-family: monospace; font-size: 0.8em; word-break: break-all; color: #546e7a; margin-bottom: 15px; border: 1px solid #e1e4e8; width: 100%; box-sizing: border-box; min-height: 45px; }

        .btn-group { display: flex; flex-direction: column; gap: 8px; width: 100%; }
        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 0.9em; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-copy { background: var(--accent); color: white; box-shadow: 0 4px 12px rgba(26, 115, 232, 0.2); }
        .btn-copy:active { transform: scale(0.97); }
        .btn-copy-qr { background: #fff; color: var(--accent); border: 2px solid var(--accent); }
        .btn-copy-qr:active { transform: scale(0.97); }

        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #323232; color: white; padding: 12px 30px; border-radius: 50px; font-size: 0.9em; display: none; z-index: 100; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

        .footer { text-align: center; margin-top: 40px; padding-bottom: 40px; }
        .back-link { text-decoration: none; color: #90a4ae; font-size: 0.9em; font-weight: bold; }
        .back-link:hover { color: var(--accent); }
    </style>
</head>
<body>

<div class="header">
    <div class="event-label">Target Event</div>
    <div id="display-event-name" class="event-name">Loading...</div>
</div>

<div class="gen-grid">
    <div class="url-card judge">
        <div class="card-title">📋 審判共有メニュー</div>
        <div class="qr-area"><canvas id="qr-judge-menu"></canvas></div>
        <div class="event-label" style="margin-bottom:8px;">Judge Menu URL</div>
        <div id="url-judge-menu" class="url-box">生成中...</div>
        <div class="btn-group">
            <button class="btn btn-copy" onclick="copy('url-judge-menu')">URLをコピー</button>
            <button class="btn btn-copy-qr" onclick="copyQR('qr-judge-menu')">🖼 QR画像をコピー</button>
        </div>
    </div>

    <div class="url-card display">
        <div class="card-title">📺 大会ディスプレイ</div>
        <div class="qr-area"><canvas id="qr-venue"></canvas></div>
        <div class="event-label" style="margin-bottom:8px;">Venue Display URL</div>
        <div id="url-venue" class="url-box">生成中...</div>
        <div class="btn-group">
            <button class="btn btn-copy" onclick="copy('url-venue')">URLをコピー</button>
            <button class="btn btn-copy-qr" onclick="copyQR('qr-venue')">🖼 QR画像をコピー</button>
        </div>
    </div>

    <div class="url-card entry">
        <div class="card-title">📝 技申告（選手用）</div>
        <div class="qr-area"><canvas id="qr-entry"></canvas></div>
        <div class="event-label" style="margin-bottom:8px;">Athlete Entry URL</div>
        <div id="url-entry" class="url-box">生成中...</div>
        <div class="btn-group">
            <button class="btn btn-copy" onclick="copy('url-entry')">URLをコピー</button>
            <button class="btn btn-copy-qr" onclick="copyQR('qr-entry')">🖼 QR画像をコピー</button>
        </div>
    </div>
</div>

<div class="footer">
    <a href="#" id="link-back" class="back-link">← 管理メニューへ戻る</a>
</div>

<div id="toast" class="toast">クリップボードにコピーしました！</div>

<script type="module">
    import { db } from "./firebase-config.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const params  = new URLSearchParams(location.search);
    const eventId = params.get('event');

    async function init() {
        if (!eventId) { location.href = 'admin_index.html'; return; }
        document.getElementById('link-back').href = `admin_menu.html?event=${eventId}`;

        const docSnap = await getDoc(doc(db, "tournaments", eventId));
        if (docSnap.exists()) {
            document.getElementById('display-event-name').innerText = docSnap.data().name;
        }

        const base = window.location.origin + window.location.pathname.split('/').slice(0, -1).join('/');
        setupLink('qr-judge-menu', 'url-judge-menu', `${base}/judge_menu.html?event=${eventId}`);
        setupLink('qr-venue',      'url-venue',      `${base}/display.html?event=${eventId}`);
        setupLink('qr-entry',      'url-entry',      `${base}/event.html?event=${eventId}`);
    }

    function setupLink(canvasId, boxId, url) {
        document.getElementById(boxId).innerHTML =
            `<a href="${url}" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline;word-break:break-all;">${url}</a>`;
        new QRious({ element: document.getElementById(canvasId), value: url, size: 180, level: 'H' });
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }

    window.copy = (elementId) => {
        navigator.clipboard.writeText(document.getElementById(elementId).innerText)
            .then(() => showToast('URLをコピーしました！'));
    };

    window.copyQR = (canvasId) => {
        document.getElementById(canvasId).toBlob(blob => {
            navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
                .then(() => showToast('QR画像をコピーしました！'))
                .catch(() => showToast('コピーに失敗しました（ブラウザ非対応の可能性）'));
        });
    };

    init();
</script>
</body>
</html>
