<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大会画面コントロール</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root { --primary: #263238; --accent: #1a73e8; --bg: #f0f2f5; --card: #ffffff; --green: #2e7d32; --text-main: #263238; --text-sub: #546e7a; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--text-main); }
        .container { max-width: 800px; margin: 0 auto; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-back { text-decoration: none; color: var(--text-sub); font-size: 0.9rem; border: 1px solid #ccc; padding: 8px 20px; border-radius: 8px; }
        .auth-info { font-size: 0.85em; color: #999; display: none; align-items: center; }
        .auth-info span { font-weight: bold; color: var(--text-main); }
        .logout-btn { background: none; border: 1px solid #ccc; border-radius: 5px; color: var(--accent); cursor: pointer; font-size: 0.9em; margin-left: 12px; padding: 3px 8px; }
        .header { text-align: center; margin-bottom: 30px; }
        .event-badge { display: inline-block; padding: 6px 16px; background: var(--accent); color: white; border-radius: 20px; font-weight: bold; margin-top: 8px; }
        h1 { margin: 0 0 8px; }

        .section-title {
            font-size: 1.1rem; font-weight: 900; margin: 30px 0 15px;
            display: flex; align-items: center; gap: 10px;
            border-left: 5px solid var(--accent); padding-left: 15px;
        }
        .card {
            background: var(--card); border-radius: 16px; padding: 28px 32px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07); margin-bottom: 20px;
        }
        .setting-row {
            display: flex; align-items: center; gap: 16px;
            padding: 16px 0; border-bottom: 1px solid #f0f0f0;
        }
        .setting-row:last-child { border-bottom: none; padding-bottom: 0; }
        .setting-label { flex: 1; }
        .setting-label strong { display: block; font-size: 0.95rem; }
        .setting-label span { font-size: 0.8rem; color: var(--text-sub); }
        .setting-control { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        input[type="range"] {
            width: 140px; accent-color: var(--accent);
        }
        .val-box {
            width: 54px; text-align: center;
            font-size: 1.1rem; font-weight: 700;
            border: 2px solid #e0e0e0; border-radius: 8px; padding: 4px 6px;
            background: #f8fbff;
        }
        .unit { font-size: 0.8rem; color: var(--text-sub); width: 24px; }

        .btn-save {
            display: block; width: 100%; padding: 16px;
            background: var(--green); color: white;
            border: none; border-radius: 12px; font-size: 1.05rem; font-weight: 700;
            cursor: pointer; transition: 0.2s; margin-top: 24px;
        }
        .btn-save:hover { background: #1b5e20; }
        .btn-save:disabled { background: #aaa; cursor: default; }
        .save-status {
            text-align: center; font-size: 0.9rem; margin-top: 10px;
            min-height: 1.4em; color: var(--green); font-weight: 600;
        }

        .display-link-card {
            background: #e8f5e9; border-radius: 16px; padding: 20px 28px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px;
            display: flex; align-items: center; gap: 16px;
        }
        .display-link-card .icon { font-size: 2rem; }
        .display-link-card a {
            color: var(--green); font-weight: 700; text-decoration: none;
            word-break: break-all; font-size: 0.95rem;
        }
        .display-link-card a:hover { text-decoration: underline; }
        .display-link-card p { margin: 4px 0 0; font-size: 0.8rem; color: var(--text-sub); }
    </style>
</head>
<body>
<div class="container">
    <div class="header-bar">
        <a id="back-link" href="admin_menu.html" class="btn-back">← メニューに戻る</a>
        <div id="auth-info" class="auth-info">
            <span id="user-name"></span>としてログイン中
            <button id="logout-btn" class="logout-btn">ログアウト</button>
        </div>
    </div>

    <div class="header">
        <h1>🖥️ 大会画面コントロール</h1>
        <div id="event-name" class="event-badge">読み込み中...</div>
    </div>

    <!-- 会場ディスプレイへのリンク -->
    <div class="display-link-card">
        <div class="icon">📺</div>
        <div>
            <a id="venue-link" href="#" target="_blank">会場ディスプレイを開く</a>
            <p>このURLを会場表示用PCのブラウザで開いてください</p>
        </div>
    </div>

    <!-- スコア表示タイミング -->
    <div class="section-title">⏱️ スコア表示タイミング</div>
    <div class="card">
        <div class="setting-row">
            <div class="setting-label">
                <strong>新規スコア 表示時間</strong>
                <span>初めてスコアが出たときの表示秒数</span>
            </div>
            <div class="setting-control">
                <input type="range" id="range-scoreNewSec" min="3" max="30" step="1" value="13">
                <input type="number" id="val-scoreNewSec" class="val-box" min="3" max="30" value="13">
                <span class="unit">秒</span>
            </div>
        </div>
        <div class="setting-row">
            <div class="setting-label">
                <strong>スコア更新時 表示時間</strong>
                <span>再試技等でスコアが更新されたときの秒数</span>
            </div>
            <div class="setting-control">
                <input type="range" id="range-scoreUpdateSec" min="1" max="15" step="1" value="3">
                <input type="number" id="val-scoreUpdateSec" class="val-box" min="1" max="15" value="3">
                <span class="unit">秒</span>
            </div>
        </div>
    </div>

    <!-- 順位表設定 -->
    <div class="section-title">🏆 順位表設定</div>
    <div class="card">
        <div class="setting-row">
            <div class="setting-label">
                <strong>1ページの表示人数</strong>
                <span>順位表を何人ずつ表示するか</span>
            </div>
            <div class="setting-control">
                <input type="range" id="range-rankingRows" min="4" max="20" step="1" value="12">
                <input type="number" id="val-rankingRows" class="val-box" min="4" max="20" value="12">
                <span class="unit">人</span>
            </div>
        </div>
        <div class="setting-row">
            <div class="setting-label">
                <strong>ページ切り替え間隔</strong>
                <span>次のページに自動で切り替わるまでの秒数</span>
            </div>
            <div class="setting-control">
                <input type="range" id="range-rankingPageSec" min="3" max="30" step="1" value="8">
                <input type="number" id="val-rankingPageSec" class="val-box" min="3" max="30" value="8">
                <span class="unit">秒</span>
            </div>
        </div>
    </div>

    <!-- アニメーション設定 -->
    <div class="section-title">✨ アニメーション</div>
    <div class="card">
        <div class="setting-row">
            <div class="setting-label">
                <strong>アニメーション時間</strong>
                <span>各要素のフェードイン時間</span>
            </div>
            <div class="setting-control">
                <input type="range" id="range-animDurationMs" min="500" max="5000" step="100" value="2600">
                <input type="number" id="val-animDurationMs" class="val-box" min="500" max="5000" step="100" value="2600">
                <span class="unit">ms</span>
            </div>
        </div>
        <div class="setting-row">
            <div class="setting-label">
                <strong>要素間の遅延</strong>
                <span>各要素が順番に現れるときの間隔</span>
            </div>
            <div class="setting-control">
                <input type="range" id="range-animStaggerMs" min="200" max="3000" step="100" value="1400">
                <input type="number" id="val-animStaggerMs" class="val-box" min="200" max="3000" step="100" value="1400">
                <span class="unit">ms</span>
            </div>
        </div>
    </div>

    <button class="btn-save" id="save-btn" disabled>保存する</button>
    <div class="save-status" id="save-status"></div>
</div>

<script type="module">
    import { db } from "./firebase-config.js";
    import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { ensureAdmin, logout } from "./auth.js";

    const params  = new URLSearchParams(location.search);
    const eventId = params.get('event');

    // バックリンクにeventIdをセット
    document.getElementById('back-link').href = `admin_menu.html?event=${eventId}`;

    // 会場ディスプレイリンク
    const venueUrl = `${location.origin}/venue_display.html?event=${eventId}`;
    const venueLink = document.getElementById('venue-link');
    venueLink.href  = venueUrl;
    venueLink.textContent = venueUrl;

    // 設定キーと初期値のマップ
    const SETTINGS = {
        scoreNewSec:    { default: 13 },
        scoreUpdateSec: { default: 3 },
        rankingRows:    { default: 12 },
        rankingPageSec: { default: 8 },
        animDurationMs: { default: 2600 },
        animStaggerMs:  { default: 1400 },
    };

    // スライダー ↔ 数値ボックスを連動させる
    Object.keys(SETTINGS).forEach(key => {
        const range = document.getElementById(`range-${key}`);
        const val   = document.getElementById(`val-${key}`);
        if (!range || !val) return;
        range.addEventListener('input', () => { val.value = range.value; });
        val.addEventListener('input',  () => { range.value = val.value; });
    });

    // 現在の設定をUIに反映
    function applyToUI(settings) {
        Object.keys(SETTINGS).forEach(key => {
            const v     = settings[key] ?? SETTINGS[key].default;
            const range = document.getElementById(`range-${key}`);
            const val   = document.getElementById(`val-${key}`);
            if (range) range.value = v;
            if (val)   val.value   = v;
        });
    }

    // UIから設定を読む
    function readFromUI() {
        const out = {};
        Object.keys(SETTINGS).forEach(key => {
            const val = document.getElementById(`val-${key}`);
            out[key]  = val ? Number(val.value) : SETTINGS[key].default;
        });
        return out;
    }

    // 認証 & ロード
    ensureAdmin(async user => {
        // auth-info 表示
        document.getElementById('auth-info').style.display = 'flex';
        document.getElementById('user-name').textContent = user.displayName || user.email;
        document.getElementById('logout-btn').onclick = logout;

        if (!eventId) {
            document.getElementById('event-name').textContent = 'URLにeventパラメータがありません';
            return;
        }

        // 大会名 & 設定読み込み
        const tourSnap = await getDoc(doc(db, 'tournaments', eventId));
        if (!tourSnap.exists()) {
            document.getElementById('event-name').textContent = '大会が見つかりません';
            return;
        }
        const tourData = tourSnap.data();
        document.getElementById('event-name').textContent = tourData.name || eventId;

        if (tourData.displaySettings) {
            applyToUI(tourData.displaySettings);
        }

        document.getElementById('save-btn').disabled = false;
    });

    // 保存
    document.getElementById('save-btn').addEventListener('click', async () => {
        const btn    = document.getElementById('save-btn');
        const status = document.getElementById('save-status');
        btn.disabled = true;
        status.textContent = '保存中...';
        status.style.color = '#888';

        try {
            await updateDoc(doc(db, 'tournaments', eventId), {
                displaySettings: readFromUI()
            });
            status.textContent = '✅ 保存しました（会場ディスプレイに即時反映）';
            status.style.color = '#2e7d32';
        } catch (e) {
            status.textContent = `❌ 保存に失敗しました: ${e.message}`;
            status.style.color = '#c62828';
        } finally {
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
