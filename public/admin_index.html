<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者コンソール - Trampoline Scoring System</title>
    <style>
        :root { --primary: #263238; --accent: #1a73e8; --bg: #f0f2f5; --card: #ffffff; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: var(--primary); }
        .card { background: var(--card); padding: 50px; border-radius: 24px; width: 440px; border-top: 8px solid var(--primary); text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        h1 { font-size: 1.6rem; font-weight: 900; letter-spacing: 1px; margin-bottom: 5px; }
        p { color: #78909c; font-size: 0.9rem; margin-bottom: 35px; }
        #welcome-message { font-size: 1rem; font-weight: bold; margin-bottom: 25px; color: var(--primary); }
        .form-group { text-align: left; margin-bottom: 25px; }
        label { display: block; font-size: 0.75rem; font-weight: bold; color: #90a4ae; margin: 0 0 8px 5px; text-transform: uppercase; }
        select { width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #e1e7eb; font-size: 1rem; background: #f8fbff; cursor: pointer; outline: none; transition: 0.3s; }
        select:focus { border-color: var(--accent); background: #fff; }
        .btn { box-sizing: border-box; display: block; width: 100%; padding: 18px; border-radius: 12px; border: none; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; margin-bottom: 15px; text-decoration: none; }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(38, 50, 56, 0.3); }
        .btn-primary:hover { transform: translateY(-2px); background: #1a252b; }
        .btn-outline { background: transparent; color: #90a4ae; border: 2px solid #cfd8dc; }
        .btn-outline:hover { background: #f1f3f4; }
        .btn-create { background: #1e8e3e; color: white; box-shadow: 0 4px 15px rgba(30,142,62,0.25); }
        .btn-create:hover { transform: translateY(-2px); background: #166b2e; }
        .btn-duplicate { background: #5c6bc0; color: white; box-shadow: 0 4px 15px rgba(92,107,192,0.25); }
        .btn-duplicate:hover:not(:disabled) { transform: translateY(-2px); background: #3f51b5; }
        .btn-duplicate:disabled { background: #b0bec5; cursor: not-allowed; }
        .divider { border: none; border-top: 1px solid #e1e7eb; margin: 5px 0 20px; }
    </style>
</head>
<body>
<div class="card">
    <h1>ADMIN CONSOLE</h1>
    <p id="welcome-message">ようこそ</p>
    <div class="form-group">
        <label>Select Tournament</label>
        <select id="tour-select"><option value="">Loading events...</option></select>
        <label style="display:flex; align-items:center; gap:7px; margin:12px 0 0 3px; font-size:0.82rem; font-weight:600; color:#546e7a; text-transform:none; letter-spacing:0; cursor:pointer;">
            <input type="checkbox" id="show-test" style="width:16px; height:16px; accent-color:var(--accent); cursor:pointer;">
            テスト大会も表示する
        </label>
    </div>
    <button class="btn btn-primary" onclick="goMenu()">管理メニュー（ポータル）を開く</button>
    <hr class="divider">
    <button class="btn btn-create" onclick="createTournament()">＋ 新規大会を作成</button>
    <button class="btn btn-duplicate" id="btn-duplicate" onclick="duplicateTournament()">⧉ 選択中の大会を複製</button>
    <a class="btn btn-outline" href="flight_timer.html">🎬 トランポリン動画検証システム</a>
</div>

<script type="module">
    import { doc, collection, setDoc, serverTimestamp, getDoc, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { ensureAdmin, getTournaments } from './auth.js';
    import { db } from "./firebase-config.js";

    function isPastTournament(tour) {
        const end = tour.end_date || tour.endDate || tour.start_date || tour.startDate || '';
        if (!end) return false; // 日付未設定は「開催前・開催中」扱い
        const today = new Date().toISOString().slice(0, 10);
        return end < today;
    }

    function makeOption(tour) {
        const opt = document.createElement('option');
        opt.value = tour.id;
        opt.text = `[${tour.startDate || tour.start_date || '日付未設定'}] ${tour.name || '名称未設定'}`;
        return opt;
    }

    let _allTours = [];   // 取得した全大会（フィルタ切替で再フェッチしないよう保持）

    // 大会名に「テスト」を含むか（テスト大会判定）
    function isTestTournament(tour) {
        return (tour.name || '').includes('テスト');
    }

    async function populateTournaments() {
        _allTours = await getTournaments();
        renderTournaments();
    }

    function renderTournaments() {
        const select = document.getElementById('tour-select');
        const prev = select.value;
        const showTest = document.getElementById('show-test')?.checked;
        // 「テスト大会も表示する」が未チェックのときは、名前に「テスト」を含む大会を除外
        const tournaments = showTest ? _allTours : _allTours.filter(t => !isTestTournament(t));
        select.innerHTML = '';

        if (tournaments.length === 0) {
            select.innerHTML = `<option value="">${_allTours.length ? '表示できる大会がありません' : '登録された大会がありません'}</option>`;
            return;
        }

        const upcoming = tournaments.filter(t => !isPastTournament(t));
        const past     = tournaments.filter(t => isPastTournament(t));

        // 開催前・開催中は開催日が近い順（昇順）に並べ替え
        upcoming.sort((a, b) => {
            const da = a.startDate || a.start_date || '';
            const db_ = b.startDate || b.start_date || '';
            return da < db_ ? -1 : da > db_ ? 1 : 0;
        });

        if (upcoming.length) {
            const grp = document.createElement('optgroup');
            grp.label = '開催前・開催中';
            upcoming.forEach(tour => grp.appendChild(makeOption(tour)));
            select.appendChild(grp);
        }
        if (past.length) {
            const grp = document.createElement('optgroup');
            grp.label = '過去大会';
            past.forEach(tour => grp.appendChild(makeOption(tour)));
            select.appendChild(grp);
        }
        // フィルタ切替後も、まだ表示対象なら選択を維持
        if (prev && select.querySelector(`option[value="${prev}"]`)) select.value = prev;
    }

    window.goMenu = () => {
        const id = document.getElementById('tour-select').value;
        if (!id) return alert("大会を選択してください");
        location.href = `admin_menu.html?event=${id}`;
    };

    window.createTournament = async () => {
        const name = prompt('新規大会名を入力してください:');
        if (!name?.trim()) return;
        try {
            const newRef = doc(collection(db, 'tournaments'));
            await setDoc(newRef, {
                name: name.trim(),
                startDate: '',
                createdAt: serverTimestamp(),
                updatedAt: serverTimestamp()
            });
            location.href = `settings.html?event=${newRef.id}`;
        } catch (e) {
            alert('大会の作成に失敗しました: ' + e.message);
        }
    };

    // 選択中の大会を複製（大会データ・クラスルール・選手・団体戦設定・審判構成をコピー。得点はコピーしない）
    window.duplicateTournament = async () => {
        const sel = document.getElementById('tour-select');
        const sourceId = sel.value;
        if (!sourceId) return alert('複製元の大会を選択してください');
        const srcLabel = sel.selectedOptions[0]?.text || '選択中の大会';
        if (!confirm(`「${srcLabel}」を複製しますか？\n\n【コピーする】大会名・大会データ・クラスルール・選手・団体戦設定・審判構成\n【コピーしない】得点などの成績データ`)) return;

        const btn = document.getElementById('btn-duplicate');
        const orig = btn.textContent;
        btn.disabled = true;
        btn.textContent = '複製中…';
        try {
            // 1) 大会ドキュメント: 設定系のみコピー。ランタイム/表示状態は除外
            const srcSnap = await getDoc(doc(db, 'tournaments', sourceId));
            if (!srcSnap.exists()) throw new Error('複製元の大会が見つかりません');
            const src = srcSnap.data();
            const EXCLUDE = new Set([
                'calculating', 'calculatingAthleteId', 'calculatingRound',
                'liveState', 'rankingCarousel', 'teamRankingTarget',
                'finalStartlistTarget', 'venueScreen', 'createdAt', 'updatedAt'
            ]);
            const newData = {};
            Object.entries(src).forEach(([k, v]) => { if (!EXCLUDE.has(k)) newData[k] = v; });
            newData.name = (src.name || '大会') + ' のコピー';
            newData.createdAt = serverTimestamp();
            newData.updatedAt = serverTimestamp();

            const newRef = doc(collection(db, 'tournaments'));
            await setDoc(newRef, newData);

            // 2) 選手・団体をドキュメントIDを保持したままコピー
            //    IDを保つことで団体の memberIds（選手ID参照）が壊れない。得点は別コレクションなので非コピー。
            const [athSnap, teamSnap] = await Promise.all([
                getDocs(collection(db, 'tournaments', sourceId, 'athletes')),
                getDocs(collection(db, 'tournaments', sourceId, 'teams'))
            ]);
            const ops = [];
            athSnap.docs.forEach(d => {
                const a = { ...d.data() };
                delete a.finalOrder; delete a.isInFinal;   // 結果（決勝試技順）由来はコピーしない
                // submissions（提出済フラグ）も複製元大会の提出状況の残骸なのでコピーしない。
                // 実データ（submissionsコレクション）は複製元イベントIDのまま残り新大会には
                // コピーされないため、このフラグだけ残すと「未提出なのに提出済」と誤表示される。
                delete a.submissions;
                ops.push(b => b.set(doc(db, 'tournaments', newRef.id, 'athletes', d.id), a));
            });
            teamSnap.docs.forEach(d => {
                ops.push(b => b.set(doc(db, 'tournaments', newRef.id, 'teams', d.id), d.data()));
            });
            // writeBatch は500件/コミット上限のため450件ずつ
            for (let i = 0; i < ops.length; i += 450) {
                const batch = writeBatch(db);
                ops.slice(i, i + 450).forEach(fn => fn(batch));
                await batch.commit();
            }

            alert(`複製しました。\n選手 ${athSnap.size} 名 / 団体 ${teamSnap.size} チームをコピーしました。\n設定画面で大会名・日程などを調整してください。`);
            location.href = `settings.html?event=${newRef.id}`;
        } catch (e) {
            alert('複製に失敗しました: ' + e.message);
            btn.disabled = false;
            btn.textContent = orig;
        }
    };

    // テスト大会の表示/非表示チェックを切り替えたら再描画（再フェッチはしない）
    document.getElementById('show-test').addEventListener('change', renderTournaments);

    ensureAdmin(user => {
        document.getElementById('welcome-message').textContent = `ようこそ、${user.displayName || user.email}さん`;
        populateTournaments();
    });
</script>
</body>
</html>
