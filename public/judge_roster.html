<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>審判構成 - Trampoline System</title>
    <style>
        :root { --accent: #1a73e8; --bg: #f0f2f5; --card: #fff; --text-main: #263238; --text-sub: #546e7a; }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; color: var(--text-main); }
        .header { background: #1e3a5f; padding: 16px 20px; display: flex; align-items: center; gap: 12px; }
        .btn-back { color: rgba(255,255,255,0.6); text-decoration: none; font-size: 0.85rem; font-weight: 700; }
        .btn-back:hover { color: #fff; }
        .header-title { color: #fff; font-size: 1rem; font-weight: 900; margin: 0; flex: 1; text-align: center; }
        .container { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }

        .card { background: var(--card); border-radius: 14px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 16px; }
        .card-title { font-size: 0.72rem; font-weight: 800; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 14px; padding-bottom: 8px; border-bottom: 1px solid #eef0f3; }

        /* スタッフグリッド */
        .staff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .staff-field { display: flex; flex-direction: column; gap: 3px; }
        .staff-label { font-size: 0.68rem; font-weight: 700; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.3px; }
        .staff-value { font-size: 0.95rem; font-weight: 700; color: var(--text-main); }
        .staff-value.empty { color: #b0bec5; font-weight: 400; font-size: 0.85rem; }

        /* クラスカード */
        .cls-card { background: var(--card); border-radius: 14px; padding: 16px 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 10px; }
        .cls-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .cls-badge { font-size: 0.68rem; font-weight: 800; padding: 2px 9px; border-radius: 8px; }
        .cls-badge.individual { background: #e3f2fd; color: #1565c0; }
        .cls-badge.synchro    { background: #e8f5e9; color: #2e7d32; }
        .cls-name { font-size: 1rem; font-weight: 900; }

        /* 審判テーブル */
        .judge-table { width: 100%; border-collapse: collapse; }
        .judge-table tr { border-bottom: 1px solid #f0f0f0; }
        .judge-table tr:last-child { border-bottom: none; }
        .judge-table td { padding: 6px 4px; font-size: 0.88rem; }
        .judge-table td.role { width: 44px; font-weight: 800; font-size: 0.75rem; color: var(--text-sub); }
        .judge-table td.name { font-weight: 700; color: var(--text-main); }
        .judge-table td.name.empty { color: #b0bec5; font-weight: 400; }
        .judge-kind { font-size: 0.7rem; color: var(--text-sub); background: #eceff1; padding: 1px 6px; border-radius: 4px; margin-left: 5px; font-weight: 600; }

        .section-heading { font-size: 0.72rem; font-weight: 800; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px; margin: 24px 0 10px 2px; display: flex; align-items: center; gap: 8px; }
        .section-heading::after { content:''; flex:1; height:1px; background:#dde3ec; }

        .empty-msg { color: #b0bec5; font-size: 0.88rem; padding: 8px 0; }

        /* 性別×ラウンド グループ */
        .gr-group { margin-bottom: 14px; }
        .gr-group:last-child { margin-bottom: 0; }
        .gr-group-label { font-size: 0.72rem; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 5px; }

        /* クラスまたぎグループの副ラベル */
        .cls-sublabel { font-size: 0.72rem; font-weight: 700; color: var(--text-sub); margin: -8px 0 10px 2px; }
    </style>
</head>
<body>
<div class="header">
    <a href="#" id="btn-back" class="btn-back">← 戻る</a>
    <h1 class="header-title">審判構成</h1>
    <div style="width:40px"></div>
</div>

<div class="container">
    <!-- 大会スタッフ -->
    <div class="card" id="staff-card">
        <div class="card-title">大会スタッフ</div>
        <div class="staff-grid" id="staff-grid">
            <div class="staff-field" id="sw-chief"><span class="staff-label">審判長</span><span class="staff-value empty" id="s-chief">—</span></div>
            <div class="staff-field" id="sw-recorder"><span class="staff-label">記録主任</span><span class="staff-value empty" id="s-recorder">—</span></div>
            <div class="staff-field" id="sw-senior1"><span class="staff-label">上級審判</span><span class="staff-value empty" id="s-senior1">—</span></div>
            <div class="staff-field" id="sw-senior2"><span class="staff-label">上級審判</span><span class="staff-value empty" id="s-senior2">—</span></div>
        </div>
    </div>

    <!-- クラス別 -->
    <div id="classes-container"><p class="empty-msg" id="loading-msg">読み込み中...</p></div>
</div>

<script type="module">
    import { db } from "./firebase-config.js";
    import { doc, getDoc, getDocs, getDocFromServer, getDocsFromServer, collection } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { buildJudgeRosterGroups, applyJudgeRosterOrder, filterHiddenJudgeRosterGroups } from "./shared.js";

    const params  = new URLSearchParams(location.search);
    const eventId = params.get('event');
    document.getElementById('btn-back').href = `judge_menu.html?event=${eventId}`;

    // iOS等で getDocFromServer が応答しないハングを防ぐタイムアウト
    function withTimeout(promise, ms = 8000) {
        return Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))]);
    }

    // 常に最新を取りに行きたいのでまずサーバー直取得を試すが、通信が悪い環境（スマホの
    // モバイル回線など）では接続確立に時間がかかりタイムアウトしてしまうことがある。
    // その場合は素通しで失敗にせず、キャッシュも使える通常のgetDoc/getDocsにフォールバックする
    // （多少古い可能性はあっても、真っ白なまま失敗するよりはましなため）。
    async function fetchTournamentAndAthletes() {
        try {
            return await withTimeout(Promise.all([
                getDocFromServer(doc(db, 'tournaments', eventId)),
                getDocsFromServer(collection(db, 'tournaments', eventId, 'athletes'))
            ]), 6000);
        } catch (e) {
            console.warn('サーバー直取得に失敗、通常取得にフォールバックします:', e.message);
            return await withTimeout(Promise.all([
                getDoc(doc(db, 'tournaments', eventId)),
                getDocs(collection(db, 'tournaments', eventId, 'athletes'))
            ]), 8000);
        }
    }

    async function init() {
        if (!eventId) return;

        // 大会データと選手リストを取得（フォールバック込み。関数コメント参照）
        const [snap, athSnap] = await fetchTournamentAndAthletes();

        if (!snap.exists()) return;
        const d = snap.data();

    document.title = `${d.name || '大会'} — 審判構成`;

    // スタッフ
    const staff = d.judgeConfig?.staff || {};
    // 「設定しない」または未入力（空）なら項目ごと非表示。値があれば表示。
    const showStaff = (wrapId, valId, val, disabled) => {
        const show = !disabled && !!val;
        if (!show) { document.getElementById(wrapId).style.display = 'none'; return false; }
        const el = document.getElementById(valId);
        el.textContent = val;
        el.classList.remove('empty');
        return true;
    };
    const anyShown = [
        showStaff('sw-chief',    's-chief',    staff.chiefJudge,    staff.chiefJudgeDisabled),
        showStaff('sw-recorder', 's-recorder', staff.chiefRecorder, staff.chiefRecorderDisabled),
        showStaff('sw-senior1',  's-senior1',  staff.seniorJudge1,  staff.seniorJudge1Disabled),
        showStaff('sw-senior2',  's-senior2',  staff.seniorJudge2,  staff.seniorJudge2Disabled),
    ].some(Boolean);
    // 表示できる項目が1つもなければスタッフカードごと非表示
    if (!anyShown) document.getElementById('staff-card').style.display = 'none';

    // 選手登録済みクラスのみ対象（サーバーから取得済みのデータを使用）
    const athClasses = new Set(athSnap.docs.map(ad => {
        const a = ad.data();
        return `${a.type || 'individual'}:${a.class || a.category || ''}`;
    }));

    // クラス別（選手が1人以上いるクラスのみ）
    const cls          = d.classes || {};
    const individual   = (cls.individual || [])
        .filter(c => athClasses.has(`individual:${c.name}`))
        .map(c => ({ name: c.name, type: 'individual' }));
    const synchro      = (cls.synchro    || [])
        .filter(c => athClasses.has(`synchro:${c.name}`))
        .map(c => ({ name: c.name, type: 'synchro' }));
    const judgeConfig  = d.judgeConfig?.classes || {};
    const classRules   = d.classRules || {};
    const rosterOrder  = d.judgeConfig?.rosterOrder  || {}; // admin_roster_order.html で設定したブロック表示順
    const rosterHidden = d.judgeConfig?.rosterHidden || {}; // admin_roster_order.html で「非表示」にしたブロック
    const container    = document.getElementById('classes-container');
    container.innerHTML = ''; // 「読み込み中...」を消してから実際の内容を積み上げる

    function escHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ロール配列から審判テーブルを生成
    function buildJudgeTable(data, ROLES) {
        const table = document.createElement('table');
        table.className = 'judge-table';
        const hasAny = ROLES.some(([k]) => data[k]);
        let html = '';
        if (hasAny) {
            ROLES.forEach(([key, lbl]) => {
                const val  = data[key]           || '';
                const kind = data[key + '_kind'] || '';
                html += `<tr>
                    <td class="role">${lbl}</td>
                    <td class="name${val ? '' : ' empty'}">${escHtml(val || '—')}${val && kind ? `<span class="judge-kind">${escHtml(kind)}</span>` : ''}</td>
                </tr>`;
            });
        } else {
            html = `<tr><td colspan="2" class="name empty">未設定</td></tr>`;
        }
        table.innerHTML = `<tbody>${html}</tbody>`;
        return table;
    }

    // クラスをまたいで同じ審判構成 (fingerprint) ごとにまとめてカードを生成
    // fingerprint にはロール種別も含めるため、E審判数が異なるクラスは別グループになる
    // グルーピング自体は shared.js に集約（admin_roster_order.html と同じ結果になるようにするため）
    function buildSection(list, type) {
        if (list.length === 0) return;

        let groups = buildJudgeRosterGroups(list, type, judgeConfig, classRules);
        groups = filterHiddenJudgeRosterGroups(groups, rosterHidden[type]);
        groups = applyJudgeRosterOrder(groups, rosterOrder[type]);
        if (groups.length === 0) return;

        const typeLabel = type === 'synchro' ? 'シンクロ' : '個人';
        const heading = document.createElement('div');
        heading.className = 'section-heading';
        heading.textContent = typeLabel;
        container.appendChild(heading);

        groups.forEach(({ sections, data, ROLES }) => {
            const classes = [...new Set(sections.map(s => s.className))];
            const genders = [...new Set(sections.map(s => s.gender).filter(Boolean))];
            const rounds  = [...new Set(sections.map(s => s.round).filter(Boolean))];
            const subLabel = genders.length
                ? genders.join('・') + ' / ' + rounds.join('・')
                : '';

            const card = document.createElement('div');
            card.className = 'cls-card';
            let html = `<div class="cls-header">
                <span class="cls-badge ${type}">${typeLabel}</span>
                <span class="cls-name">${escHtml(classes.join('・'))}</span>
            </div>`;
            if (subLabel) html += `<div class="cls-sublabel">${escHtml(subLabel)}</div>`;
            html += '<div class="cls-body"></div>';
            card.innerHTML = html;
            card.querySelector('.cls-body').appendChild(buildJudgeTable(data, ROLES));
            container.appendChild(card);
        });
    }

        buildSection(individual, 'individual');
        buildSection(synchro,    'synchro');

        if (individual.length === 0 && synchro.length === 0) {
            container.innerHTML = '<p class="empty-msg">クラスが設定されていません。</p>';
        }
    }
    init().catch(e => {
        console.error('審判構成の読み込みに失敗:', e);
        document.getElementById('classes-container').innerHTML =
            '<div style="text-align:center;padding:32px;color:#90a4ae;">読み込みに失敗しました。通信状況をご確認ください。'
            + '<br><button onclick="location.reload()" style="margin-top:12px;padding:8px 22px;border:none;background:#1a73e8;color:#fff;border-radius:8px;cursor:pointer;">再読み込み</button></div>';
    });
</script>
</body>
</html>
