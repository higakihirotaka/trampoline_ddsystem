<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>順位表（詳細版）</title>
  <style>
    :root { --accent:#1a3a6b; --gold:#b8860b; --print-font-size:9px; --print-name-w:110px; }
    * { box-sizing:border-box; }
    body { font-family:'Hiragino Kaku Gothic ProN','Meiryo',sans-serif; margin:0; padding:0; background:#fff; color:#111; font-size:13px; }

    /* ---- コントロール（印刷非表示） ---- */
    .controls {
      background:#f7f8fa; border-bottom:1px solid #ddd;
      padding:8px 12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center;
      position:sticky; top:0; z-index:10;
    }
    .controls label { font-size:.75rem; font-weight:700; color:#666; }
    .controls select {
      padding:4px 8px; border:1px solid #bbb; border-radius:5px;
      font-size:.8rem; background:#fff; cursor:pointer;
    }
    .btn-load { padding:5px 16px; background:var(--accent); color:#fff; border:none; border-radius:5px; font-weight:700; font-size:.8rem; cursor:pointer; }
    .btn-print { padding:5px 16px; background:#666; color:#fff; border:none; border-radius:5px; font-weight:700; font-size:.8rem; cursor:pointer; }

    /* ---- 本体 ---- */
    .print-area { padding:10px 12px; }

    /* ---- ヘッダー ---- */
    .sheet-header { margin-bottom:10px; }
    .header-top { position:relative; text-align:center; }
    .header-main { width:100%; text-align:center; }
    .event-name { font-size:1.4rem; font-weight:900; color:var(--accent); margin:0 0 5px; line-height:1.2; }
    .sheet-meta { font-size:.9rem; font-weight:700; color:#333; margin:0; }
    .sheet-divider { border:none; border-top:3px solid var(--accent); margin:8px 0 6px; }
    .sheet-credit { position:absolute; top:0; right:0; display:flex; align-items:center; gap:8px; }
    .sheet-credit img { height:44px; width:auto; }
    .sheet-credit .sys-text { text-align:right; line-height:1.5; }
    .sheet-credit .sys-name { font-size:.8rem; font-weight:900; color:var(--accent); display:block; }
    .sheet-credit .sys-dev  { font-size:.65rem; color:#888; display:block; }

    /* ---- グループラベル（表の直上・左） ---- */
    .group-label { font-size:.95rem; font-weight:900; color:#222; margin:0 0 5px; }
    .group-label .round-badge { font-size:.75rem; font-weight:400; color:#666; margin-left:8px; }

    /* ---- スコア表 ---- */
    .score-table {
      width:100%; border-collapse:collapse; font-size:14px;
      table-layout:fixed;
    }
    .score-table th {
      background:var(--accent); color:#fff;
      padding:6px 4px; text-align:center; font-size:12px; font-weight:700;
      border:1px solid #fff;
    }
    .score-table td {
      padding:5px 4px; border-bottom:1px solid #e0e0e0; border-right:1px solid #eee;
      text-align:center; vertical-align:middle; overflow:hidden; white-space:nowrap;
    }
    .score-table td.left { text-align:left; }

    /* 選手ブロック */
    tr.ath-row-1 td { border-top:2px solid #aaa; }
    tr.ath-row-1:nth-child(4n+1) td { background:#fafafa; }
    tr.ath-row-2 td { border-bottom:2px solid #aaa; }
    tr.ath-row-2:nth-child(4n+2) td { background:#fafafa; }
    /* 最終行：次の選手がいないため通常セルに底線を補完 */
    .score-table tbody tr:last-child td { border-bottom:2px solid #aaa; }

    .rank-num { font-size:1.2rem; font-weight:900; color:#111; }

    /* 決勝進出・リザーブマーク（右上に絶対配置して数字位置を変えない） */
    .col-rank { position:relative; }
    .q-mark { position:absolute; top:3px; right:3px; font-size:9px; font-weight:900; color:#1565c0; line-height:1; }
    .r-mark { position:absolute; top:3px; right:3px; font-size:9px; font-weight:900; color:#e65100; line-height:1; }
    tr.is-qual td { background:#e8f0fe !important; print-color-adjust:exact; -webkit-print-color-adjust:exact; }
    tr.is-resv td { background:#fff3e0 !important; print-color-adjust:exact; -webkit-print-color-adjust:exact; }

    .ath-name { font-weight:700; font-size:14px; line-height:1.3; }
    .ath-club { font-size:11px; color:#666; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .syn-slash { font-size:.8em; opacity:.45; }
    .ath-yomi { font-size:11px; color:#888; }

    .round-label { font-size:11px; color:#555; font-weight:600; white-space:nowrap; }

    .s-val { font-size:13px; }

    .score-val { font-weight:700; font-size:14px; }
    .total-val { font-weight:900; font-size:15px; color:#111; }

    .score-na { color:#bbb; font-size:11px; }
    .dns-badge { background:#7b1fa2; color:#fff; font-size:8px; font-weight:900; padding:1px 5px; border-radius:3px; letter-spacing:0.05em; }
    .dns-row td { color:#999; }

    .loading { text-align:center; padding:60px; color:#999; }
    .no-data { text-align:center; padding:60px; color:#aaa; font-size:.9rem; }

    /* 列幅 */
    .col-rank { width:36px; }
    .col-name { width:158px; }
    .col-round { width:34px; }
    .col-item { width:32px; }
    .col-s { width:36px; }
    .col-land { width:30px; }
    .col-sum  { width:48px; }
    .col-pen  { width:48px; }
    .col-score{ width:52px; }
    .col-total{ width:56px; }

    /* ---- 詳細版: 1本を D / E / T / HD の4行で表示 ---- */
    td.col-item {
      font-weight:900; font-size:11px; background:#f4f6f9;
      print-color-adjust:exact; -webkit-print-color-adjust:exact;
    }
    td.item-d  { color:#111; }
    td.item-e  { color:#111; }
    td.item-t  { color:#111; }
    td.item-hd { color:#111; }
    .d-skill  { font-size:12px; font-weight:400; color:#111; letter-spacing:-0.3px; }
    .d-skill.dd-on { font-weight:700; }  /* 難度点が加算される技のみ太字 */
    .t-val    { font-size:11px; color:#111; }
    .h-val    { font-size:12px; color:#111; }
    .sum-val  { font-weight:700; font-size:12px; color:#111; }
    .sum-diff { font-weight:900; font-size:12px; color:#111; }
    /* ペナルティ内容（会場表示テキスト）: Pen列で数字の下に表示 */
    td.col-pen { vertical-align:middle; }
    .pen-reasons-cell { font-size:8px; font-weight:700; color:#111; line-height:1.1; margin-top:1px; white-space:normal; overflow-wrap:anywhere; letter-spacing:-0.2px; }
    /* 選手ブロックの上下境界・偶奇背景・ラウンド区切り */
    tr.detail-first td { border-top:2px solid #999; }
    tr.detail-last td  { border-bottom:2px solid #999; }
    tr.round-end td    { border-bottom:1.5px solid #bbb; }
    tr.blk-alt td            { background:#f7f8fb; }
    tr.blk-alt td.col-item   { background:#eef1f6; }
    .table-wrap{ overflow-x:auto; }
    /* 印刷時: 選手ブロック(=1人ぶんのtbody)をページ内で分割しない */
    tbody.ath-block{ break-inside:avoid; page-break-inside:avoid; }

    @media print {
      .controls { display:none !important; }
      body { background:#fff; }
      .print-area { padding:0; }
      /* 全クラス印刷: クラス/性別が変わるブロックの前で改ページ */
      .print-block.page-break { break-before: page; page-break-before: always; }
      .group-label { break-after: avoid; page-break-after: avoid; }
      /* 選手ブロックはページ内で分割しない */
      tbody.ath-block { break-inside: avoid; page-break-inside: avoid; }
      thead { display: table-header-group; } /* 各ページに列見出しを繰り返す */
      .table-wrap { overflow: visible; }
      .score-table th { print-color-adjust:exact; -webkit-print-color-adjust:exact; }
      .col-name { width: var(--print-name-w); }
      .pen-reasons-cell { font-size:calc(var(--print-font-size)*0.72); line-height:1.05; letter-spacing:-0.3px; }

      /* ===== 縦（ポートレート）: 高密度・1枚目8人/2枚目以降9人 ===== */
      body.mode-portrait .sheet-header { margin-bottom:3px; }
      body.mode-portrait .event-name { font-size:12px; margin:0 0 2px; line-height:1.15; }
      body.mode-portrait .sheet-meta { font-size:8.5px; line-height:1.25; }
      body.mode-portrait .sheet-divider { margin:3px 0; }
      body.mode-portrait .group-label { margin:0 0 2px; font-size:10px; }
      body.mode-portrait .score-table { font-size:var(--print-font-size); }
      body.mode-portrait .score-table th { font-size:calc(var(--print-font-size)*0.9); padding:1px 1px; line-height:1.05; }
      /* 「Comp.」は縦印刷の26px列に収まらないので、この列だけ縮めて収める */
      body.mode-portrait .score-table th.col-item { font-size:calc(var(--print-font-size)*0.78); letter-spacing:-0.4px; }
      body.mode-portrait .score-table td { padding:1px 1px; line-height:1.05; }
      body.mode-portrait .ath-name { font-size:var(--print-font-size); line-height:1.1; }
      body.mode-portrait .ath-club { font-size:calc(var(--print-font-size)*0.8); line-height:1.05; }
      body.mode-portrait .rank-num { font-size:calc(var(--print-font-size)*1.1); }
      body.mode-portrait .score-val { font-size:var(--print-font-size); }
      body.mode-portrait .total-val { font-size:calc(var(--print-font-size)*1.1); }
      body.mode-portrait .d-skill { font-size:calc(var(--print-font-size)*0.86); letter-spacing:-0.4px; }
      body.mode-portrait .t-val { font-size:calc(var(--print-font-size)*0.9); }
      body.mode-portrait .h-val { font-size:var(--print-font-size); }
      body.mode-portrait .s-val { font-size:var(--print-font-size); }
      body.mode-portrait td.col-item { font-size:calc(var(--print-font-size)*0.9); }
      body.mode-portrait .sum-val, body.mode-portrait .sum-diff { font-size:var(--print-font-size); }
      body.mode-portrait .col-rank { width:30px; }
      body.mode-portrait .col-round { width:24px; }
      body.mode-portrait .col-item { width:26px; }
      body.mode-portrait .col-s { width:35px; }
      body.mode-portrait .col-land { width:24px; }
      body.mode-portrait .col-sum { width:40px; }
      body.mode-portrait .col-pen { width:44px; }
      body.mode-portrait .col-score { width:44px; }
      body.mode-portrait .col-total { width:46px; }

      /* ===== 横（ランドスケープ）: 従来のゆったりレイアウト ===== */
      body.mode-landscape .score-table { font-size:var(--print-font-size); }
      body.mode-landscape .score-table th { font-size:calc(var(--print-font-size)*0.9); padding:3px 2px; }
      body.mode-landscape .score-table td { padding:3px 2px; }
      body.mode-landscape .ath-name { font-size:var(--print-font-size); }
      body.mode-landscape .ath-club { font-size:calc(var(--print-font-size)*0.85); }
      body.mode-landscape .rank-num { font-size:calc(var(--print-font-size)*1.1); }
      body.mode-landscape .score-val { font-size:var(--print-font-size); }
      body.mode-landscape .total-val { font-size:calc(var(--print-font-size)*1.1); }
      body.mode-landscape .d-skill { font-size:var(--print-font-size); }
      body.mode-landscape .t-val { font-size:calc(var(--print-font-size)*0.9); }
      body.mode-landscape .h-val { font-size:var(--print-font-size); }
      body.mode-landscape .s-val { font-size:var(--print-font-size); }
      body.mode-landscape td.col-item { font-size:calc(var(--print-font-size)*0.95); }
      body.mode-landscape .sum-val, body.mode-landscape .sum-diff { font-size:var(--print-font-size); }
      /* 横は画面既定の広い列幅をそのまま使用（col-s 36px 等） */
    }
  </style>
  <!-- 用紙の向き（縦/横）は印刷ボタンで切替。JSでこの@pageを差し替える -->
  <style id="page-size">@page { size: A4 portrait; margin: 8mm 6mm; }</style>
</head>
<body class="mode-portrait">

<div class="controls" id="controls">
  <label>グループ</label>
  <select id="sel-group"><option value="">-- 選択 --</option></select>
  <label>ラウンド</label>
  <select id="sel-round">
    <option value="qualifying">予選</option>
    <option value="final">決勝</option>
  </select>
  <label>決勝進出</label>
  <select id="sel-qual">
    <option value="0">なし</option>
    <option value="1">1人</option><option value="2">2人</option><option value="3">3人</option>
    <option value="4">4人</option><option value="5">5人</option><option value="6">6人</option>
    <option value="7">7人</option><option value="8">8人</option><option value="9">9人</option>
    <option value="10">10人</option>
  </select>
  <label>リザーブ</label>
  <select id="sel-resv">
    <option value="0">なし</option>
    <option value="1">1人</option><option value="2">2人</option>
  </select>
  <button class="btn-load" onclick="loadRanking()">表示</button>
  <label>印刷文字</label>
  <select id="sel-print-size" onchange="document.documentElement.style.setProperty('--print-font-size',this.value+'px')">
    <option value="7">7</option>
    <option value="8">8</option>
    <option value="9" selected>9</option>
    <option value="10">10</option>
    <option value="11">11</option>
    <option value="12">12</option>
  </select>
  <label>名前列幅</label>
  <select id="sel-name-w" onchange="document.documentElement.style.setProperty('--print-name-w',this.value+'px')">
    <option value="90">90</option>
    <option value="100">100</option>
    <option value="110" selected>110</option>
    <option value="130">130</option>
    <option value="140">140</option>
    <option value="160">160</option>
    <option value="180">180</option>
    <option value="200">200</option>
  </select>
  <button class="btn-print" onclick="printRanking('portrait')">🖨 縦で印刷</button>
  <button class="btn-print" onclick="printRanking('landscape')" style="background:#7a5b1e;">🖨 横で印刷</button>
  <button class="btn-print" onclick="printAllClasses('portrait')" style="background:#1a3a6b;">🖨 全クラス（縦）</button>
  <button class="btn-print" onclick="printAllClasses('landscape')" style="background:#3a2a6b;">🖨 全クラス（横）</button>
</div>

<div class="print-area">
  <div id="output"><div class="loading">クラスを選んで「表示」を押してください</div></div>
</div>

<script type="module">
  import { getDocs, collection, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { db } from "./firebase-config.js";
  import { normalizeClassRules, extractTbScores, calcQualifyingScore, calcQualifyingTb, calcFinalScore, compareRankEntries, assignRanks } from "./shared.js";
  import { getTournament, getAthletes, getFinalOrders } from "./cache.js";

  const params  = new URLSearchParams(location.search);
  const eventId = params.get('event');
  let athletes = [], tourData = null;
  // 技コード解決用（officialSkills の ID/シンボル → 技マスター）
  const skillById = {}, skillBySymbol = {};

  async function init() {
    if (!eventId) { document.getElementById('output').innerHTML = '<div class="no-data">URLにeventパラメータがありません</div>'; return; }
    const [fetchedTour, fetchedAth, smSnap] = await Promise.all([
      getTournament(eventId),
      getAthletes(eventId),
      getDocs(collection(db, 'skillMaster'))
    ]);
    if (!fetchedTour) { document.getElementById('output').innerHTML = '<div class="no-data">大会が見つかりません</div>'; return; }
    tourData = fetchedTour;
    athletes = fetchedAth;
    // 技マスターを ID / シンボルの両方で引けるようにする
    smSnap.docs.forEach(d => {
      const data = d.data();
      const m = { id: d.id, symbol: data.symbol, displaySymbol: data.displaySymbol || data.symbol, dd: parseFloat(data.dd) || 0 };
      skillById[String(d.id)] = m;
      if (m.symbol != null && m.symbol !== '') skillBySymbol[String(m.symbol)] = m;
    });
    // 決勝試技順はキャッシュ除外なので毎回Firestoreから取得してマージ
    const finalOrders = await getFinalOrders(eventId);
    athletes.forEach(a => {
      const fo = finalOrders[a.id];
      if (fo) { a.finalOrder = fo.finalOrder; a.isInFinal = fo.isInFinal; }
    });
    buildSelectors();
  }

  function buildSelectors() {
    const urlType   = params.get('type');
    const urlGender = params.get('gender');
    const urlClass  = params.get('class');
    const urlRound  = params.get('round');

    // 選手登録のある (type, class, gender) 組み合わせを列挙
    const hasBothTypes = athletes.some(a => (a.type || 'individual') === 'synchro');
    const combos = [];
    const seen = new Set();
    ['individual','synchro'].forEach(type => {
      const tourClassDefs = (tourData?.classes?.[type] || [])
        .slice().sort((a,b)=>(a.display_order??99)-(b.display_order??99)).map(c=>c.name);
      const byType = athletes.filter(a => (a.type || 'individual') === type);
      const rawClasses = [...new Set(byType.map(a => a.class || a.category || '').filter(Boolean))];
      const classes = [...tourClassDefs.filter(c=>rawClasses.includes(c)), ...rawClasses.filter(c=>!tourClassDefs.includes(c))];
      classes.forEach(cls => {
        const genders = [...new Set(
          byType.filter(a => (a.class || a.category || '') === cls).map(a => a.gender || '').filter(Boolean)
        )];
        // 性別が登録されていない場合は空文字で1件
        (genders.length ? genders : ['']).forEach(gender => {
          const key = `${type}::${cls}::${gender}`;
          if (seen.has(key)) return;
          seen.add(key);
          let label = `${cls}${gender ? ' ' + gender : ''}`;
          if (hasBothTypes) label = (type === 'synchro' ? 'シンクロ ' : '個人 ') + label;
          combos.push({ key, label });
        });
      });
    });

    const selGroup = document.getElementById('sel-group');
    selGroup.innerHTML = '<option value="">-- 選択 --</option>'
      + combos.map(c => `<option value="${c.key}">${c.label}</option>`).join('');

    // URLパラメータで初期選択
    if (urlType || urlClass || urlGender) {
      const matchKey = `${urlType||'individual'}::${urlClass||''}::${urlGender||''}`;
      // 完全一致を優先、なければ type+class のみで探す
      const exact = combos.find(c => c.key === matchKey);
      const loose = exact || combos.find(c => c.key.startsWith(`${urlType||'individual'}::${urlClass||''}`));
      if (loose) selGroup.value = loose.key;
    }

    if (urlRound) document.getElementById('sel-round').value = urlRound;

    // 変更で自動再読み込み
    ['sel-group','sel-round','sel-qual','sel-resv'].forEach(id =>
      document.getElementById(id).addEventListener('change', () => loadRanking())
    );

    // URLパラメータあれば即表示
    if (selGroup.value) loadRanking();
  }

  // S1-S10: 全審判の各技減点を合計（stored値×10 = タップ単位に戻す）
  function calcSkillTotals(result) {
    const judges = Object.values(result.execution?.judges || {});
    if (judges.length === 0) return { skills: Array(10).fill(null), land: null };

    // CJP の middle2 と同じ：中間2名の合計を ×10 して表示
    function mid2sum(vals) {
      const filled = vals.filter(v => v !== null && v !== undefined);
      if (filled.length < 2) return filled.length === 1 ? Math.round(filled[0] * 10) : null;
      filled.sort((a, b) => a - b);
      const mid = Math.floor((filled.length - 2) / 2);
      // 中間2名の合計（×10整数）
      return Math.round((filled[mid] + filled[mid + 1]) * 10);
    }

    // 各技の有効減点合計を ×10 して整数表示（CJP の middle2sum と同じ値）
    const skills = Array.from({ length: 10 }, (_, i) => {
      const vals = judges.map(j => (j.deductions || [])[i] ?? null);
      return mid2sum(vals);
    });

    const land = mid2sum(judges.map(j => j.landing ?? null));

    return { skills, land };
  }

  // 詳細版: 1本ぶんの技別データ（D=技コード / E=減点 / T=ToF / HD）をまとめて返す
  // rule = そのクラスの classRule（指定難度判定に使用）
  function getDetailPerSkill(res, rule) {
    const { skills, land } = calcSkillTotals(res);
    const officialSkills = res.officialSkills || [];
    // HDTS 技別: 最も多く採点しているパネルの保存値を採用（display.html と同じ選び方）
    const hdtsMap = res.hdtsPerSkillByPanel;
    let hp = null;
    if (hdtsMap && Object.keys(hdtsMap).length) {
      const counts = {};
      Object.keys(res.execution?.judges || {}).forEach(k => { const p = k.split('_')[0]; counts[p] = (counts[p] || 0) + 1; });
      const active = Object.entries(counts).sort((a, b) => b[1] - a[1])[0]?.[0];
      hp = hdtsMap[active] || hdtsMap[Object.keys(hdtsMap)[0]] || null;
    }
    const dCodes = Array.from({ length: 10 }, (_, i) => {
      const off = officialSkills[i];
      if (off == null || off === '') return null;
      const m = skillById[String(off)] || skillBySymbol[String(off)];
      return m ? (m.displaySymbol || m.symbol) : String(off);
    });
    const tofs = Array.from({ length: 10 }, (_, i) => (hp?.tof?.[i] != null) ? Number(hp.tof[i]) : null);
    const hds  = Array.from({ length: 10 }, (_, i) => (hp?.hd?.[i]  != null) ? hp.hd[i] : null);
    // 各技の難度点が実際に加算されているか（重複=ダブルカウント / 指定難度で無効 は false）
    const desigRaw = rule?.designatedDDCount ?? -1;
    const validDesig = desigRaw >= 0 && rule?.qualifyingRoutines === 2 && rule?.scoreMode === 'total' && res.round === 'pre1';
    const desigCount = validDesig ? desigRaw : -1;
    const desigIndices = res.officialDesignatedDDIndices || [];
    const hasManual = !!(res.officialDDValues && res.officialDDValues.length > 0);
    const vLimit = res.validCount ?? 10;
    const seen = new Set();
    const dCounted = Array(10).fill(false);
    for (let i = 0; i < 10; i++) {
      if (i >= vLimit) continue;
      const off = officialSkills[i];
      const sk = off ? (skillById[String(off)] || skillBySymbol[String(off)]) : null;
      const repeatKey = sk ? sk.id : String(off);
      const isRepeat = !!(sk && seen.has(repeatKey));
      const isDesig = desigCount < 0 || (desigCount > 0 && desigIndices.includes(i));
      let ddVal = 0;
      if (hasManual) {
        if (!isRepeat && off && isDesig) ddVal = Number(res.officialDDValues[i]) || 0;
        if (sk && !isRepeat) seen.add(repeatKey);
      } else if (sk && !isRepeat) {
        seen.add(repeatKey);
        if (isDesig) ddVal = sk.dd || 0;
      }
      dCounted[i] = ddVal > 0;
    }
    return { skills, land, dCodes, tofs, hds, dCounted };
  }

  const fmt3 = v => v != null ? Number(v).toFixed(3) : null;
  const fmt2 = v => v != null ? Number(v).toFixed(2) : null;
  const fmt1 = v => v != null ? Number(v).toFixed(1) : null;

  // 印刷/PDF保存時の既定ファイル名にクラス・男女・ラウンド・大会名を反映
  // （ブラウザの「PDFで保存」は document.title を既定ファイル名に使う）
  function setPrintTitle() {
    const gSel = document.getElementById('sel-group');
    const rSel = document.getElementById('sel-round');
    const gLabel = (gSel && gSel.value && gSel.options[gSel.selectedIndex]?.text) || '';
    const rLabel = (rSel && rSel.options[rSel.selectedIndex]?.text) || '';
    const parts = [gLabel, rLabel, '詳細'].filter(Boolean);
    // ファイル名に使えない文字を除去し、各要素をアンダーバーで連結
    const t = parts.join(' ').replace(/[\\/:*?"<>|]/g, '').replace(/\s+/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, '');
    if (t) document.title = t;
  }

  // 印刷モード（用紙の向き＋レイアウト）を切り替える
  function applyPrintMode(mode) {
    const m = (mode === 'landscape') ? 'landscape' : 'portrait';
    document.body.classList.remove('mode-portrait', 'mode-landscape');
    document.body.classList.add('mode-' + m);
    // @page の向きをJSで差し替え（クラス条件では size を切替できないため）
    const ps = document.getElementById('page-size');
    if (ps) ps.textContent = (m === 'landscape')
      ? '@page { size: A4 landscape; margin: 10mm 8mm; }'
      : '@page { size: A4 portrait; margin: 8mm 6mm; }';
  }

  window.printRanking = function(mode) {
    applyPrintMode(mode);
    setPrintTitle();
    window.print();
  };

  // published な結果を {athleteId: {round: result}} で取得
  async function fetchResultsByAth() {
    const resSnap = await getDocs(query(
      collection(db, 'results'),
      where('eventId', '==', eventId),
      where('published', '==', true)
    ));
    const byAth = {};
    resSnap.docs.forEach(d => {
      const r = d.data();
      if (!byAth[r.athleteId]) byAth[r.athleteId] = {};
      byAth[r.athleteId][r.round] = r;
    });
    return byAth;
  }

  // 1グループ（種目/クラス/性別/ラウンド）の「見出し＋表」HTMLを返す（該当者なしは ''）
  function buildGroupSectionHtml(fType, fClass, fGender, fRound, byAth, classRules, nQual, nResv) {
    let filtered = athletes.filter(a =>
      (a.type || 'individual') === fType &&
      (!fGender || (a.gender || '') === fGender) &&
      (!fClass  || (a.class || a.category || '') === fClass)
    );
    // 決勝は試技順が確定した選手のみ表示
    if (fRound === 'final') filtered = filtered.filter(a => a.finalOrder != null);
    if (!filtered.length) return '';

    // 各選手のスコア計算 ─ shared.js の共通関数を使用
    const rows = filtered.map(a => {
      const rMap = byAth[a.id] || {};
      const rule = (classRules[fType] || {})[a.class || a.category || ''] || {};
      const numPre         = rule.qualifyingRoutines ?? tourData.qualifyingRoutines ?? 1;
      const scoreMode      = rule.scoreMode || 'best';
      const finalScoreMode = rule.finalScoreMode ?? 'zero';
      const pre1r = rMap['pre1'] || null;
      const pre2r = rMap['pre2'] || null;
      const finr  = rMap['final'] || null;
      const pre1  = pre1r?.officialTotal ?? null;
      const pre2  = pre2r?.officialTotal ?? null;
      const final = finr?.officialTotal ?? null;

      let qualScore, tbSum, tb;
      if (fRound === 'qualifying') {
        qualScore = calcQualifyingScore(pre1, pre2, numPre, scoreMode);
        ({ tbSum, tb } = calcQualifyingTb(pre1, pre2, pre1r, pre2r, numPre, scoreMode));
      } else if (fRound === 'pre1') {
        qualScore = pre1; tbSum = null; tb = extractTbScores(pre1r);
      } else if (fRound === 'pre2') {
        qualScore = pre2; tbSum = null; tb = extractTbScores(pre2r);
      } else if (fRound === 'final') {
        const qualPart = calcQualifyingScore(pre1, pre2, numPre, scoreMode);
        qualScore = calcFinalScore(qualPart, final, finalScoreMode);
        tbSum = null; tb = extractTbScores(finr);
      }

      // DNS（棄権）チェック: 対象ラウンドの result に dns:true があれば最下位扱い
      const isDns = (() => {
        if (fRound === 'qualifying') return pre1r?.dns === true || pre2r?.dns === true;
        if (fRound === 'pre1')  return pre1r?.dns === true;
        if (fRound === 'pre2')  return pre2r?.dns === true;
        if (fRound === 'final') return finr?.dns  === true;
        return false;
      })();
      if (isDns) qualScore = null; // null にすることで compareRankEntries が最下位へ
      return { a, pre1r, pre2r, finr, pre1, pre2, final, qualScore, isDns, numPre, scoreMode, finalScoreMode, tbSum, tb };
    }).sort(compareRankEntries);

    assignRanks(rows);

    // タイトル
    const labelType = fType === 'synchro' ? 'シンクロ' : '個人';
    const roundLabels = { qualifying:'予選', pre1:'予選 R1', pre2:'予選 R2', final:'決勝' };
    const sheetTitle = ['TRA', labelType, fGender, fClass, roundLabels[fRound]].filter(Boolean).join('_');

    // 表示するラウンドリスト
    const showRounds = fRound === 'qualifying'
      ? (rows[0]?.numPre >= 2 ? ['pre1','pre2'] : ['pre1'])
      : [fRound];

    const isFinal = fRound === 'final';
    const _sectionRule    = (classRules[fType] || {})[fClass] || {};
    const scoreMode       = _sectionRule.scoreMode || 'best';
    const finalScoreMode  = _sectionRule.finalScoreMode ?? 'zero';
    const totalLabel = isFinal
      ? (finalScoreMode === 'combined' ? 'Total' : 'No.')
      : (scoreMode === 'total' ? 'Total' : 'Best');
    // 決勝: Round列は不要、No.列（zero mode）も不要
    const showRoundCol = !isFinal;
    const showTotalCol = !isFinal || finalScoreMode === 'combined';

    // thead（詳細版: 単一ヘッダ行。1本を D/E/T/HD の4行で表示）
    const tLabel = fType === 'synchro' ? 'Syn' : 'ToF';
    const thead = `<thead><tr>
      <th class="col-rank">Rank</th>
      <th class="col-name">Name</th>
      <th class="col-round">R</th>
      <th class="col-item">Comp.</th>
      <th class="col-s">S1</th><th class="col-s">S2</th><th class="col-s">S3</th>
      <th class="col-s">S4</th><th class="col-s">S5</th><th class="col-s">S6</th>
      <th class="col-s">S7</th><th class="col-s">S8</th><th class="col-s">S9</th>
      <th class="col-s">S10</th>
      <th class="col-land">L</th>
      <th class="col-sum">Sum</th>
      <th class="col-pen">Pen</th>
      <th class="col-score">Score</th>
      ${showTotalCol ? `<th class="col-total">${totalLabel}</th>` : ''}
    </tr></thead>`;

    // 列幅colgroup
    const colgroup = `<colgroup>
      <col class="col-rank"><col class="col-name">
      <col class="col-round"><col class="col-item">
      ${Array(10).fill('<col class="col-s">').join('')}
      <col class="col-land"><col class="col-sum">
      <col class="col-pen"><col class="col-score">
      ${showTotalCol ? '<col class="col-total">' : ''}
    </colgroup>`;

    // tbody（詳細版: 選手ごとに、各ラウンド = D / E / ToF / HD の4行ブロック）
    const METRICS = 4;
    let tbodyHtml = '';
    rows.forEach((r, idx) => {
      const rank = r.rank;
      const isQual = nQual > 0 && rank <= nQual;
      const isResv = nResv > 0 && rank > nQual && rank <= nQual + nResv;
      const rankCls = r.isDns ? ' dns-row' : isQual ? ' is-qual' : isResv ? ' is-resv' : '';
      const altCls  = (idx % 2 === 1) ? ' blk-alt' : '';
      const qmark = r.isDns ? '' : isQual ? '<span class="q-mark">Q</span>' : isResv ? '<span class="r-mark">R</span>' : '';

      const nameHtml = r.a.type === 'synchro'
        ? `<div class="ath-name">${r.a.name1 || '−'} / ${r.a.name2 || '−'}</div>
           <div class="ath-club">${[r.a.club1, r.a.club2].filter(Boolean).join(' / ')}</div>`
        : `<div class="ath-name">${r.a.name1 || '−'}</div>
           <div class="ath-club">${r.a.club1 || ''}</div>`;

      const cell = v => v != null ? v : '<span class="score-na">−</span>';

      // 選手ごとに tbody で包む（印刷時ページ内で分割させない）
      tbodyHtml += '<tbody class="ath-block">';

      // DNS: 1行にまとめて表示
      if (r.isDns) {
        tbodyHtml += `<tr class="detail-first detail-last${rankCls}${altCls}">
          <td class="col-rank"><span class="dns-badge">DNS</span></td>
          <td>${nameHtml}</td>
          <td class="left" colspan="${16 + (showTotalCol ? 1 : 0)}" style="text-align:left;color:#999;padding-left:10px;">棄権 (DNS)</td>
        </tr></tbody>`;
        return;
      }

      // Best/Total（選手単位・全行 rowspan）
      const bestInner = isFinal
        ? (r.finalScoreMode === 'combined'
            ? (r.qualScore != null ? fmt2(r.qualScore) : '<span class="score-na">−</span>')
            : (r.a.finalOrder != null ? `No.${r.a.finalOrder}` : '−'))
        : (r.qualScore != null ? fmt2(r.qualScore) : '<span class="score-na">−</span>');

      const totalMetricRows = showRounds.length * METRICS;

      showRounds.forEach((rnd, ri) => {
        const res = rnd === 'pre1' ? r.pre1r : rnd === 'pre2' ? r.pre2r : r.finr;
        const rndLabel = rnd === 'pre1' ? 'R1' : rnd === 'pre2' ? 'R2' : '決勝';
        const firstOfAth = ri === 0;
        const lastOfAth  = ri === showRounds.length - 1;

        // 技別データ抽出
        let dCodes = Array(10).fill(null), eDeds = Array(10).fill(null),
            tofs = Array(10).fill(null), hds = Array(10).fill(null), land = null, vLimit = 10,
            dCounted = Array(10).fill(false);
        let diff = null, exe = null, tofT = null, hdT = null, pen = null, score = null, penReasons = [];
        if (res) {
          const det = getDetailPerSkill(res, _sectionRule);
          dCodes = det.dCodes; eDeds = det.skills; tofs = det.tofs; hds = det.hds; land = det.land; dCounted = det.dCounted;
          vLimit = res.validCount ?? 10;
          diff  = res.officialD     != null ? fmt1(res.officialD)     : null;
          exe   = res.officialE     != null ? fmt1(res.officialE)     : null;
          tofT  = res.tof           != null ? fmt2(res.tof)           : null;  // 合計は小数第2位
          hdT   = res.hd?.total     != null ? fmt2(res.hd.total)      : null;
          pen   = (res.penalty != null && res.penalty !== 0) ? fmt1(res.penalty) : null;
          score = res.officialTotal != null ? fmt2(res.officialTotal) : null;
          // ペナルティ内容（会場表示テキスト＝display を優先）
          penReasons = (Array.isArray(res.penaltyItems) ? res.penaltyItems : [])
            .map(it => (it.display || it.en || it.ja || '')).filter(Boolean);
        }

        // 技別セル生成（有効本数超は空欄）
        const sCells = (arr, cls, fmtFn) => {
          let h = '';
          for (let i = 0; i < 10; i++) {
            if (i >= vLimit) { h += `<td class="score-na"></td>`; continue; }
            const v = arr[i];
            h += `<td class="${cls}">${v != null ? fmtFn(v) : '<span class="score-na">−</span>'}</td>`;
          }
          return h;
        };
        // D技コード: 難度点が加算されている技のみ太字（dd-on）。無効/重複は標準太さ
        let dRowCells = '';
        for (let i = 0; i < 10; i++) {
          if (i >= vLimit) { dRowCells += `<td class="score-na"></td>`; continue; }
          const v = dCodes[i];
          dRowCells += `<td class="d-skill${dCounted[i] ? ' dd-on' : ''}">${v != null ? v : '<span class="score-na">−</span>'}</td>`;
        }
        const eRowCells = sCells(eDeds, 's-val',  v => (Number.isInteger(v) ? v : Number(v).toFixed(1)));
        const tRowCells = sCells(tofs,  't-val',  v => Number(v).toFixed(3));  // 1本ごとは小数第3位
        const hRowCells = sCells(hds,   'h-val',  v => v);

        // L（着地）: E行のみ表示
        const landCell = (vLimit >= 10 && land != null)
          ? `<td class="s-val">${Number.isInteger(land) ? land : Number(land).toFixed(1)}</td>`
          : `<td class="score-na"></td>`;

        // ブロック境界（rowspanセルは inline 底線、非rowspanセルは class 底線）
        const blkBottom = 'border-bottom:2px solid #999';
        const roundSep  = lastOfAth ? blkBottom : 'border-bottom:1.5px solid #bbb';
        const hdRowCls  = lastOfAth ? ' detail-last' : ' round-end';
        const topCls    = firstOfAth ? ' detail-first' : '';

        const rankCell  = firstOfAth ? `<td class="col-rank" rowspan="${totalMetricRows}" style="${blkBottom}"><span class="rank-num">${rank}</span>${qmark}</td>` : '';
        const nameCell  = firstOfAth ? `<td rowspan="${totalMetricRows}" style="${blkBottom}">${nameHtml}</td>` : '';
        const bestCell  = (firstOfAth && showTotalCol) ? `<td class="total-val" rowspan="${totalMetricRows}" style="${blkBottom}">${bestInner}</td>` : '';
        const roundCell = `<td class="round-label" rowspan="${METRICS}" style="${roundSep}">${rndLabel}</td>`;
        const penReasonsHtml = penReasons.length ? `<div class="pen-reasons-cell">${penReasons.join('<br>')}</div>` : '';
        const penCell   = `<td class="col-pen" rowspan="${METRICS}" style="${roundSep}">${cell(pen)}${penReasonsHtml}</td>`;
        const scoreCell = `<td class="score-val" rowspan="${METRICS}" style="${roundSep}">${cell(score)}</td>`;

        // E行（先頭行: Rank/Name/Round/Pen/Score/Best のアンカーを含む）
        tbodyHtml += `<tr class="${rankCls}${altCls}${topCls}">
          ${rankCell}${nameCell}${roundCell}
          <td class="col-item item-e">E</td>
          ${eRowCells}
          ${landCell}
          <td class="sum-val">${cell(exe)}</td>
          ${penCell}${scoreCell}${bestCell}
        </tr>`;
        // D行（Lは無いので「−」）
        tbodyHtml += `<tr class="${rankCls}${altCls}">
          <td class="col-item item-d">D</td>
          ${dRowCells}
          <td class="score-na">−</td>
          <td class="sum-diff">${cell(diff)}</td>
        </tr>`;
        // ToF行（Lは無いので「−」）
        tbodyHtml += `<tr class="${rankCls}${altCls}">
          <td class="col-item item-t">${tLabel}</td>
          ${tRowCells}
          <td class="score-na">−</td>
          <td class="sum-val">${cell(tofT)}</td>
        </tr>`;
        // HD行（Lは無いので「−」）
        tbodyHtml += `<tr class="${rankCls}${altCls}${hdRowCls}">
          <td class="col-item item-hd">HD</td>
          ${hRowCells}
          <td class="score-na">−</td>
          <td class="sum-val">${cell(hdT)}</td>
        </tr>`;
      });
      tbodyHtml += '</tbody>';
    });

    const groupParts = [];
    if (fType === 'synchro') groupParts.push('シンクロ'); else groupParts.push('個人');
    if (fGender) groupParts.push(fGender);
    if (fClass)  groupParts.push(fClass);
    groupParts.push(roundLabels[fRound] || fRound);
    const groupText = groupParts.join(' / ');

    return `<div class="group-label">${groupText}</div>
      <div class="table-wrap">
        <table class="score-table">${colgroup}${thead}${tbodyHtml}</table>
      </div>`;
  }

  // 大会ヘッダー（大会名／会場／日付）のHTML
  function buildSheetHeaderHtml() {
    function toJpDate(ds) {
      if (!ds) return '';
      const d = new Date(ds + 'T00:00:00');
      return new Intl.DateTimeFormat('ja-JP-u-ca-japanese', {
        era:'long', year:'numeric', month:'long', day:'numeric'
      }).format(d);
    }
    const venue = tourData.venue || '';
    const s = tourData.start_date || tourData.startDate || '';
    const e = tourData.end_date   || tourData.endDate   || '';
    const jpS = toJpDate(s), jpE = toJpDate(e);
    const dateStr = jpS && jpE && s !== e ? `${jpS} 〜 ${jpE}` : (jpS || jpE);
    return `
      <div class="sheet-header">
        <div class="header-top">
          <div class="header-main">
            <div class="event-name">${tourData.name || ''}</div>
            ${venue  ? `<div class="sheet-meta">${venue}</div>`   : ''}
            ${dateStr ? `<div class="sheet-meta">${dateStr}</div>` : ''}
          </div>
          <div class="sheet-credit">
            <div class="sys-text">
              <span class="sys-dev">Dev. Hirotaka.H</span>
            </div>
          </div>
        </div>
        <hr class="sheet-divider">
      </div>`;
  }

  // 選択中の1グループを表示
  window.loadRanking = async function() {
    const selGroup = document.getElementById('sel-group').value;
    const output = document.getElementById('output');
    if (!selGroup) { output.innerHTML = '<div class="no-data">グループを選択してください</div>'; return; }
    const [fType, fClass, fGender] = selGroup.split('::');
    const fRound  = document.getElementById('sel-round').value;
    setPrintTitle();
    output.innerHTML = '<div class="loading">読み込み中...</div>';
    const classRules = normalizeClassRules(tourData.classRules);
    const byAth = await fetchResultsByAth();
    const nQual = parseInt(document.getElementById('sel-qual').value) || 0;
    const nResv = parseInt(document.getElementById('sel-resv').value) || 0;
    const section = buildGroupSectionHtml(fType, fClass, fGender, fRound, byAth, classRules, nQual, nResv);
    if (!section) { output.innerHTML = '<div class="no-data">該当する選手がいません</div>'; return; }
    output.innerHTML = buildSheetHeaderHtml() + section;
  };

  // 全クラス印刷（クラス設定順／男子→女子／予選→決勝、クラス・性別が変わるとページ送り）
  window.printAllClasses = async function(mode) {
    applyPrintMode(mode);
    const output = document.getElementById('output');
    output.innerHTML = '<div class="loading">全クラスを読み込み中...</div>';
    const classRules = normalizeClassRules(tourData.classRules);
    const byAth = await fetchResultsByAth();
    const genderRank = g => g === '男子' ? 0 : g === '女子' ? 1 : 2;
    let html = '';
    let first = true;
    ['individual', 'synchro'].forEach(type => {
      const byType = athletes.filter(a => (a.type || 'individual') === type);
      if (!byType.length) return;
      const tourClassDefs = (tourData?.classes?.[type] || [])
        .slice().sort((a, b) => (a.display_order ?? 99) - (b.display_order ?? 99)).map(c => c.name);
      const rawClasses = [...new Set(byType.map(a => a.class || a.category || '').filter(Boolean))];
      const classes = [...tourClassDefs.filter(c => rawClasses.includes(c)), ...rawClasses.filter(c => !tourClassDefs.includes(c))];
      classes.forEach(cls => {
        const genders = [...new Set(
          byType.filter(a => (a.class || a.category || '') === cls).map(a => a.gender || '').filter(Boolean)
        )].sort((a, b) => genderRank(a) - genderRank(b));
        (genders.length ? genders : ['']).forEach(gender => {
          const sections = [];
          const q = buildGroupSectionHtml(type, cls, gender, 'qualifying', byAth, classRules, 0, 0);
          if (q) sections.push(q);
          const f = buildGroupSectionHtml(type, cls, gender, 'final', byAth, classRules, 0, 0);
          if (f) sections.push(f);
          if (!sections.length) return;
          html += `<div class="print-block${first ? '' : ' page-break'}">${buildSheetHeaderHtml()}${sections.join('')}</div>`;
          first = false;
        });
      });
    });
    if (!html) { output.innerHTML = '<div class="no-data">印刷できるデータがありません</div>'; return; }
    output.innerHTML = html;
    document.title = '全クラス_詳細';
    const restore = () => { window.removeEventListener('afterprint', restore); loadRanking(); };
    window.addEventListener('afterprint', restore);
    setTimeout(() => window.print(), 60);
  };

  init();
</script>
