<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>選手一覧 - トランポリン大会システム</title>
    <style>
        :root { --primary-blue: #1a73e8; --bg-gray: #f0f2f5; --text-dark: #202124; --text-gray: #5f6368; --success-green: #1e8e3e; --warning-orange: #f57c00; --indiv-purple: #5e35b1; --sync-teal: #00897b; }
        body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; padding: 20px; background: var(--bg-gray); margin: 0; }
        .list-container { max-width: 1200px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .header-section { text-align: center; margin-bottom: 20px; }
        .admin-back { display: none; margin-bottom: 16px; }
        .admin-back a { text-decoration: none; color: #5f6368; font-size: 0.9rem; border: 1px solid #ccc; padding: 7px 18px; border-radius: 8px; }
        .countdown-container { display: none; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; justify-content: center; }
        .timer-card { flex: 1; min-width: 150px; max-width: 250px; background: #fff; padding: 12px; border-radius: 12px; border-left: 4px solid var(--primary-blue); box-shadow: 0 2px 8px rgba(0,0,0,0.05); text-align: center; }
        .timer-label { font-size: 0.65em; font-weight: bold; color: #90a4ae; margin-bottom: 3px; }
        .timer-time { font-size: 0.82em; color: #546e7a; font-weight: bold; margin-bottom: 4px; }
        .timer-clock { font-family: monospace; font-size: 1.1em; font-weight: 900; }
        .timer-clock.urgent { color: var(--success-green); }
        .timer-clock.expired { color: #d32f2f; }

        .section-header { font-size: 1.8em; font-weight: 900; margin: 50px 0 20px 0; padding-bottom: 10px; border-bottom: 4px solid; }
        .indiv-header { border-color: var(--indiv-purple); color: var(--indiv-purple); }
        .sync-header { border-color: var(--sync-teal); color: var(--sync-teal); }

        .class-header { font-size: 1.3em; font-weight: 900; margin: 30px 0 15px 0; padding: 12px 20px; border-radius: 10px; color: white; }
        .indiv-class-header { background: var(--indiv-purple); }
        .sync-class-header { background: var(--sync-teal); }

        .category-row { background: #f8f9fa; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 30px; table-layout: auto; }
        th, td { padding: 10px 8px; border-bottom: 1px solid #eee; text-align: center; }
        th { color: var(--text-gray); font-size: 0.75em; text-transform: uppercase; white-space: nowrap; }
        .col-num { width: 36px; }
        .col-name { text-align: left; min-width: 120px; }
        .col-btn { width: 88px; white-space: nowrap; }
        .status-link { text-decoration: none; padding: 8px 0; border-radius: 8px; font-size: 0.78em; font-weight: bold; display: block; width: 80px; margin: 0 auto; border: 1px solid transparent; transition: 0.2s; }
        .status-none { background: #fff; color: var(--primary-blue); border-color: var(--primary-blue); }
        .status-done { background: #e8f0fe; color: var(--primary-blue); border-color: transparent; }
        .status-dns { background: #fdecee; color: #d32f2f; border-color: #f3c2c2; }
        .withdrawn-row { background-color: #f5f5f5; color: #999; }
        .withdrawn-row td { text-decoration: line-through; }

        .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .list-container { padding: 14px; border-radius: 12px; }
            #event-title { font-size: 1.3em !important; }
            .section-header { font-size: 1.3em; margin: 30px 0 12px; }
            .class-header { font-size: 1em; padding: 8px 14px; margin: 20px 0 10px; }
            th, td { padding: 8px 5px; font-size: 0.85em; }
            .col-num { width: 28px; }
            .col-btn { width: 70px; }
            .col-name { min-width: 90px; }
            .status-link { width: 62px; font-size: 0.72em; padding: 7px 0; }
        }
    </style>
</head>
<body>
<div class="list-container">
    <div id="admin-back" class="admin-back"><a href="#">← 管理メニューに戻る</a></div>
    <div class="header-section">
        <h1 id="event-title" style="font-size:2em; margin-bottom:5px;">読み込み中...</h1>
        <div id="event-date" style="font-size: 1em; color: #888;"></div>
        <div id="event-venue" style="font-size: 0.95em; color: #888;"></div>
    </div>
    <div id="countdown-area" class="countdown-container"></div>
    <div id="indiv-list"></div>
    <div id="sync-list"></div>
</div>

<script type="module">
    import { db } from "./firebase-config.js";
    import { doc, getDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const params  = new URLSearchParams(location.search);
    const eventId = params.get('event');

    // ── localStorage キャッシュ ──────────────────────────────
    const CACHE_KEY = `ev_${eventId}`;
    function loadCache() {
        try { return JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); }
        catch { return null; }
    }
    function saveCache(tour, athletes, subMap) {
        try {
            localStorage.setItem(CACHE_KEY, JSON.stringify({
                tour, athletes, submissions: Object.fromEntries(subMap)
            }));
        } catch {}
    }

    // ── Promise にタイムアウトを付与（iOS等で getDocs が応答しないハングを防ぐ）──
    function withTimeout(promise, ms = 8000) {
        return Promise.race([
            promise,
            new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
        ]);
    }

    // ── 大会情報をDOMに反映 ─────────────────────────────────
    function applyTourInfo(tour) {
        document.getElementById('event-title').innerText = tour.name;
        const _sd = tour.startDate || tour.start_date || '';
        const _ed = tour.endDate   || tour.end_date   || '';
        const _dateStr = (_sd && _ed && _sd !== _ed) ? `${_sd} ～ ${_ed}` : (_sd || _ed);
        document.getElementById('event-date').innerText  = _dateStr    ? `開催日：${_dateStr}` : '';
        document.getElementById('event-venue').innerText = tour.venue ? `会場：${tour.venue}` : '';
    }

    // ── バッジのピンポイント更新 ────────────────────────────
    function updateStatusBadge(athId, round, sub) {
        const el = document.getElementById(`status-${athId}-${round}`);
        if (!el) return;
        if (dnsSet.has(`${eventId}_${athId}_${round}`)) {
            el.className = 'status-link status-dns';
            el.textContent = 'DNS';
            return;
        }
        el.className = `status-link ${sub ? 'status-done' : 'status-none'}`;
        el.textContent = sub ? '提出済' : '入力';
    }

    // ── 選手リスト全体描画（初回のみ呼ぶ）────────────────────
    function renderList(tour, athletes, subMap) {
        const rawClassRules = tour.classRules || {};
        const hasNewFormat  = 'individual' in rawClassRules || 'synchro' in rawClassRules;
        const classRules    = hasNewFormat ? rawClassRules :
                              Object.keys(rawClassRules).length > 0 ? { individual: rawClassRules, synchro: {} } :
                              { individual: {}, synchro: {} };
        const sortByOrder = arr => (arr || []).slice().sort((a, b) => (a.display_order ?? 0) - (b.display_order ?? 0));
        let indivClassOrder = [], syncClassOrder = [];
        if (tour.classes && !Array.isArray(tour.classes)) {
            indivClassOrder = sortByOrder(tour.classes.individual).map(c => c.name);
            syncClassOrder  = sortByOrder(tour.classes.synchro).map(c => c.name);
        } else if (Array.isArray(tour.classes)) {
            indivClassOrder = sortByOrder(tour.classes).map(c => c.name);
        }
        const indivAthletes = athletes.filter(a => a.type !== 'synchro');
        const syncAthletes  = athletes.filter(a => a.type === 'synchro');
        // グループが1種類しかない大会では Gr 列を表示しない
        const showGroup = new Set(athletes.map(a => a.flightGroup).filter(g => g != null && g !== '')).size > 1;
        const indivContainer = document.getElementById('indiv-list');
        if (indivAthletes.length > 0) {
            indivContainer.innerHTML = '<h2 class="section-header indiv-header">個人競技</h2>' +
                buildTablesHtml(indivAthletes, classRules.individual, subMap, 'individual', rawClassRules, indivClassOrder, showGroup);
        }
        const syncContainer = document.getElementById('sync-list');
        if (syncAthletes.length > 0) {
            syncContainer.innerHTML = '<h2 class="section-header sync-header">シンクロ競技</h2>' +
                buildTablesHtml(syncAthletes, classRules.synchro, subMap, 'synchro', rawClassRules, syncClassOrder, showGroup);
        }
    }

    function buildTablesHtml(athletes, rulesByType, subMap, type, fallbackRules = {}, classOrder = [], showGroup = true) {
        const byClass = athletes.reduce((acc, ath) => {
            const cn = ath.class || 'N/A';
            (acc[cn] = acc[cn] || []).push(ath);
            return acc;
        }, {});
        const ordered  = classOrder.filter(n => byClass[n]);
        const leftover = Object.keys(byClass).filter(n => !classOrder.includes(n)).sort();
        let html = '';
        for (const cn of [...ordered, ...leftover]) {
            const cls   = byClass[cn];
            const rules = (rulesByType || {})[cn] || fallbackRules[cn] || { qualifyingRoutines: 2, hasFinal: false };
            const numPre = rules.finalOnly === true ? 0 : rules.qualifyingRoutines;   // 決勝のみは予選なし
            cls.sort((a, b) =>
                `${a.gender||''}-${String(a.flightGroup||'').padStart(3,'0')}-${String(a.order||'').padStart(3,'0')}`.localeCompare(
                `${b.gender||''}-${String(b.flightGroup||'').padStart(3,'0')}-${String(b.order||'').padStart(3,'0')}`));
            html += `<div class="class-header ${type==='synchro'?'sync-class-header':'indiv-class-header'}">${cn}</div>`;
            let curGender = '';
            cls.forEach(ath => {
                if (curGender !== ath.gender) {
                    if (curGender !== '') html += '</tbody></table></div>';
                    curGender = ath.gender;
                    const rh = Array.from({length: numPre}, (_, i) => `<th class="col-btn">予選${i+1}</th>`).join('');
                    const fh = rules.hasFinal ? '<th class="col-btn">決勝</th>' : '';
                    const grH = showGroup ? '<th class="col-num">Gr</th>' : '';
                    html += `<div class="table-wrap"><table><thead>
                        <tr class="category-row"><td colspan="${(showGroup?3:2)+numPre+(rules.hasFinal?1:0)}" style="text-align:left;">${curGender}</td></tr>
                        <tr>${grH}<th class="col-num">順</th><th class="col-name">選手</th>${rh}${fh}</tr>
                        </thead><tbody>`;
                }
                const pHtml = type === 'synchro'
                    ? `<span style="font-weight:bold;">${ath.name1||''} / ${ath.name2||''}</span><br><small style="color:#888;">${ath.club1||''} / ${ath.club2||''}</small>`
                    : `<span style="font-weight:bold;">${ath.name1}</span><br><small style="color:#888;">${ath.club1}</small>`;
                const grCell = showGroup ? `<td class="col-num">${ath.flightGroup||'-'}</td>` : '';
                html += `<tr class="${ath.isWithdrawn?'withdrawn-row':''}">${grCell}<td class="col-num">${ath.order||'-'}</td><td class="col-name">${pHtml}</td>`;
                for (let i = 1; i <= numPre; i++) html += `<td>${statusButton(ath, `pre${i}`, subMap)}</td>`;
                if (rules.hasFinal) html += `<td>${statusButton(ath, 'final', subMap)}</td>`;
                html += '</tr>';
            });
            if (cls.length > 0) html += '</tbody></table></div>';
        }
        return html;
    }

    function statusButton(ath, round, subMap) {
        if (ath.isWithdrawn) return `<span style="font-size:0.8em;color:#d32f2f;">棄権</span>`;
        const subId = `${eventId}_${ath.id}_${round}`;
        const isDns = dnsSet.has(subId);
        const cls   = isDns ? 'status-dns' : (subMap.get(subId) ? 'status-done' : 'status-none');
        const label = isDns ? 'DNS' : (subMap.get(subId) ? '提出済' : '入力');
        return `<a id="status-${ath.id}-${round}" href="entry.html?event=${eventId}&athlete=${ath.id}&round=${round}" class="status-link ${cls}">${label}</a>`;
    }

    // ── カウントダウンタイマー ────────────────────────────────
    let _timerIds = []; // 起動中のインターバルIDを管理（再呼び出し時にクリアするため）
    function startGlobalTimers(tour) {
        // 既存タイマーをすべてクリア（キャッシュ→Firestore更新時に正しく再描画するため）
        _timerIds.forEach(id => clearInterval(id));
        _timerIds = [];

        const area = document.getElementById('countdown-area');
        const deadlines = [
            { id: 'sub', label: '提出締切', time: tour.submissionDeadline },
            { id: 'rev', label: '修正締切', time: tour.revisionDeadline },
            { id: 'fin', label: '決勝締切', time: tour.finalSubmissionDeadline }
        ].filter(d => d.time).map(d => {
            const dt = new Date(d.time);
            return { ...d,
                timeStr: `${dt.getMonth()+1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`,
                ms: dt.getTime()
            };
        });
        if (deadlines.length === 0) { area.style.display = 'none'; return; }
        area.style.display = 'flex';
        area.innerHTML = deadlines.map(d =>
            `<div class="timer-card"><div class="timer-label">${d.label}</div><div class="timer-time">${d.timeStr}</div><div id="clock-${d.id}" class="timer-clock urgent"></div></div>`
        ).join('');
        const tick = () => {
            const now = Date.now();
            let allDone = true;
            deadlines.forEach(d => {
                const el = document.getElementById(`clock-${d.id}`);
                if (!el) return;
                const diff = d.ms - now;
                if (diff > 0) {
                    allDone = false;
                    el.className = 'timer-clock urgent';
                    el.textContent = `${Math.floor(diff/3600000)}h ${Math.floor(diff%3600000/60000)}m ${Math.floor(diff%60000/1000)}s`;
                } else {
                    el.className = 'timer-clock expired';
                    el.textContent = '終了';
                }
            });
            if (allDone) { _timerIds.forEach(id => clearInterval(id)); _timerIds = []; }
        };
        tick();
        _timerIds.push(setInterval(tick, 1000));
    }

    // ── バックグラウンド差分同期 ─────────────────────────────
    let liveTour     = null;
    let liveAthletes = [];
    let dnsSet       = new Set(); // CJPがDNS（棄権）で確定したラウンドの submission/result ID

    async function backgroundSync() {
        if (!eventId || !liveAthletes.length) return;
        try {
            const snap = await getDocs(query(collection(db, "submissions"), where("eventId", "==", eventId)));
            const freshMap = new Map(snap.docs.map(d => [d.id, d.data()]));
            liveAthletes.forEach(ath => {
                ['pre1','pre2','pre3','final'].forEach(round => {
                    const el = document.getElementById(`status-${ath.id}-${round}`);
                    if (!el) return;
                    const sub = freshMap.get(`${eventId}_${ath.id}_${round}`) || null;
                    if (el.classList.contains('status-done') !== !!sub) updateStatusBadge(ath.id, round, sub);
                });
            });
            if (liveTour) saveCache(liveTour, liveAthletes, freshMap);
        } catch(e) { console.warn('BG sync failed:', e.message); }
    }

    // ── 初期化 ───────────────────────────────────────────────
    async function init() {
        if (!eventId) return;

        if (params.get('from') === 'admin') {
            const backDiv = document.getElementById('admin-back');
            backDiv.style.display = 'block';
            backDiv.querySelector('a').href = `admin_menu.html?event=${eventId}`;
        }

        // ① キャッシュがあれば即座に描画（0ms）
        const cache = loadCache();
        if (cache?.tour && cache?.athletes) {
            liveTour     = cache.tour;
            liveAthletes = cache.athletes;
            applyTourInfo(cache.tour);
            startGlobalTimers(cache.tour);
            renderList(cache.tour, cache.athletes, new Map(Object.entries(cache.submissions || {})));
        }

        // ② 最新データを常時フェッチ（iOS等での失敗/ハングに備えタイムアウトを付与）
        try {
            const tourSnap = await withTimeout(getDoc(doc(db, "tournaments", eventId)));
            if (!tourSnap.exists()) return;
            const tour = tourSnap.data();
            liveTour = tour;
            applyTourInfo(tour);
            startGlobalTimers(tour); // timerStarted フラグで二重起動ガード

            const [subSnap, athSnap, resSnap] = await withTimeout(Promise.all([
                getDocs(query(collection(db, "submissions"), where("eventId", "==", eventId))),
                getDocs(collection(db, "tournaments", eventId, "athletes")),
                getDocs(query(collection(db, "results"), where("eventId", "==", eventId)))
            ]));
            const freshSubMap = new Map(subSnap.docs.map(d => [d.id, d.data()]));
            const allAthletes = athSnap.docs.map(d => ({ ...d.data(), id: d.id }));
            liveAthletes = allAthletes;
            // CJPがDNS（棄権）で確定したラウンド（results.dns===true）
            dnsSet = new Set(resSnap.docs.filter(d => d.data().dns === true).map(d => d.id));

            if (cache?.athletes) {
                // キャッシュ描画済み → バッジを最新化（DNS含む）
                allAthletes.forEach(ath => {
                    ['pre1','pre2','pre3','final'].forEach(round => {
                        if (!document.getElementById(`status-${ath.id}-${round}`)) return;
                        const sub = freshSubMap.get(`${eventId}_${ath.id}_${round}`) || null;
                        updateStatusBadge(ath.id, round, sub);
                    });
                });
            } else {
                // 初回：全体描画
                renderList(tour, allAthletes, freshSubMap);
            }
            saveCache(tour, allAthletes, freshSubMap);
        } catch(e) {
            console.error('Fetch failed:', e.message);
            // キャッシュからの一覧描画も無い場合は、空白のまま固まらないよう失敗を明示し再読み込み導線を出す
            if (!cache?.athletes) {
                document.getElementById('indiv-list').innerHTML =
                    '<div style="text-align:center;padding:40px;color:#90a4ae;">読み込みに失敗しました。通信状況をご確認ください。'
                    + '<br><button onclick="location.reload()" style="margin-top:12px;padding:8px 22px;border:none;background:#1a73e8;color:#fff;border-radius:8px;cursor:pointer;font-size:0.95em;">再読み込み</button></div>';
            }
        }
    }

    // ③ タブ復帰時にバックグラウンド差分同期
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') backgroundSync();
    });

    init();
</script>
</body>
</html>
