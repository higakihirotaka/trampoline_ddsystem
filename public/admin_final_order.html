<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>決勝試技順処理</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root { --primary:#263238; --accent:#1a73e8; --gold:#f9a825; --bg:#f0f2f5; --card:#fff; --green:#2e7d32; --text-main:#263238; --text-sub:#546e7a; }
    body { font-family:'Inter',sans-serif; background:var(--bg); margin:0; padding:20px; color:var(--text-main); }
    .container { max-width:900px; margin:0 auto; }

    .header-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
    .btn-back { text-decoration:none; color:var(--text-sub); font-size:.9rem; border:1px solid #ccc; padding:8px 20px; border-radius:8px; }
    .auth-info { font-size:.85em; color:#999; display:none; align-items:center; }
    .logout-btn { background:none; border:1px solid #ccc; border-radius:5px; color:var(--accent); cursor:pointer; font-size:.9em; margin-left:12px; padding:3px 8px; }

    .header { text-align:center; margin-bottom:24px; }
    .header h1 { margin:0 0 8px; }
    .event-badge { display:inline-block; padding:6px 16px; background:var(--accent); color:white; border-radius:20px; font-weight:bold; }

    .card { background:var(--card); border-radius:16px; padding:24px 28px; box-shadow:0 2px 8px rgba(0,0,0,.07); margin-bottom:16px; }

    /* クラス選択 */
    .filter-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
    .filter-row:last-child { margin-bottom:0; }
    .filter-label { font-size:.8rem; font-weight:700; color:var(--text-sub); width:50px; flex-shrink:0; }
    .tab-btn { padding:5px 14px; border-radius:20px; border:1px solid #b0bec5; background:#fff; color:#546e7a; font-size:.8rem; font-weight:700; cursor:pointer; transition:.15s; white-space:nowrap; }
    .tab-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }

    /* 決勝人数 */
    .finalcount-row { display:flex; align-items:center; gap:12px; margin-top:12px; }
    .finalcount-row label { font-weight:700; font-size:.95rem; }
    .finalcount-row input[type=number] { width:70px; padding:6px 10px; border:2px solid #ccc; border-radius:8px; font-size:1.1rem; text-align:center; }
    .btn-apply { padding:8px 22px; background:var(--accent); color:#fff; border:none; border-radius:8px; font-weight:700; cursor:pointer; font-size:.9rem; }
    .btn-apply:hover { background:#1558b0; }

    /* シャッフル選択 */
    .shuffle-row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px; }
    .shuffle-opt { display:flex; align-items:center; gap:5px; font-size:.82rem; cursor:pointer; padding:5px 14px; border:1px solid #b0bec5; border-radius:20px; background:#fff; color:#546e7a; font-weight:700; transition:.15s; white-space:nowrap; user-select:none; }
    .shuffle-opt:has(input:checked) { background:var(--accent); color:#fff; border-color:var(--accent); }
    .shuffle-opt input[type=radio] { display:none; }

    /* 順位表 */
    .standings-card { background:var(--card); border-radius:16px; padding:0; box-shadow:0 2px 8px rgba(0,0,0,.07); overflow:hidden; margin-bottom:16px; }
    .standings-head { padding:16px 24px; border-bottom:2px solid #e0e0e0; font-weight:900; font-size:1.05rem; display:flex; align-items:center; gap:10px; }
    table { width:100%; border-collapse:collapse; }
    th { background:#37474f; color:#fff; padding:10px 12px; font-size:.8rem; text-align:center; }
    th:nth-child(2) { text-align:left; }
    td { padding:10px 12px; text-align:center; border-bottom:1px solid #f0f0f0; font-size:.95rem; }
    td:nth-child(2) { text-align:left; }
    tr.finalist { background:#fffde7; }
    tr.finalist td:first-child { font-weight:900; color:var(--gold); }
    tr.finalist .final-order-badge { display:inline-block; background:var(--gold); color:#000; border-radius:5px; padding:2px 8px; font-weight:900; font-size:.9rem; }
    tr.non-finalist { opacity:.45; }
    .no-score { color:#bbb; font-size:.85rem; }
    .num { font-family:'Courier New',monospace; }

    /* 保存ボタン */
    .btn-save { display:block; width:100%; padding:16px; background:var(--green); color:#fff; border:none; border-radius:12px; font-size:1.05rem; font-weight:700; cursor:pointer; transition:.2s; margin-top:0; }
    .btn-save:hover { background:#1b5e20; }
    .btn-save:disabled { background:#aaa; cursor:default; }
    .save-status { text-align:center; font-size:.9rem; min-height:1.4em; margin-top:10px; font-weight:600; }

    .info-box { background:#e3f2fd; border-radius:10px; padding:12px 18px; font-size:.85rem; color:#1565c0; margin-bottom:16px; line-height:1.6; }
    .warn-box { background:#fff3e0; border-radius:10px; padding:12px 18px; font-size:.85rem; color:#e65100; margin-bottom:16px; }
    .empty-msg { text-align:center; color:#90a4ae; padding:40px 0; font-size:.9rem; }

    /* ===== スタートリスト ===== */
    .sl-section-head { display:flex; align-items:center; gap:12px; margin:28px 0 12px; }
    .sl-section-head h2 { margin:0; font-size:1rem; font-weight:900; }
    .btn-print { padding:8px 20px; background:#455a64; color:#fff; border:none; border-radius:8px; font-weight:700; cursor:pointer; font-size:.85rem; }
    .btn-print:hover { background:#263238; }
    .btn-refresh { padding:8px 20px; background:#fff; color:var(--text-sub); border:1px solid #ccc; border-radius:8px; font-weight:700; cursor:pointer; font-size:.85rem; }
    .btn-refresh:hover { background:#f5f5f5; }

    .sl-accordion { background:var(--card); border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.07); margin-bottom:10px; overflow:hidden; }
    .sl-header { display:flex; align-items:center; gap:10px; padding:14px 20px; cursor:pointer; user-select:none; }
    .sl-header:hover { background:#f5f7fa; }
    .sl-title { font-weight:800; font-size:.97rem; flex:1; }
    .sl-count { font-size:.8rem; color:var(--text-sub); }
    .sl-chevron { font-size:.75rem; color:var(--text-sub); transition:transform .2s; }
    .sl-accordion.open .sl-chevron { transform:rotate(180deg); }
    .sl-body { display:none; border-top:1px solid #eee; }
    .sl-accordion.open .sl-body { display:block; }

    .sl-table { width:100%; border-collapse:collapse; }
    .sl-table th { background:#37474f; color:#fff; padding:8px 14px; font-size:.78rem; font-weight:700; text-align:left; }
    .sl-table th.num-col { text-align:center; width:52px; }
    .sl-table td { padding:10px 14px; border-bottom:1px solid #f0f0f0; vertical-align:middle; }
    .sl-table td.sl-no { text-align:center; font-weight:900; font-size:1.15rem; color:var(--gold); }
    .sl-kana { font-size:.75rem; color:var(--text-sub); line-height:1.3; }
    .sl-name { font-weight:700; font-size:.95rem; line-height:1.4; }
    .sl-club { font-size:.88rem; color:var(--text-sub); }
    .sl-btn-print-cls { padding:4px 12px; background:#607d8b; color:#fff; border:none; border-radius:6px; font-size:.75rem; font-weight:700; cursor:pointer; white-space:nowrap; }
    .sl-btn-print-cls:hover { background:#455a64; }

    /* 印刷 */
    .sl-print-title { display:none; }
    @media print {
      .header-bar, .header, .info-box, .card, .standings-card,
      #warn-overwrite, #save-btn, .save-status,
      .sl-section-head .btn-print, .sl-section-head .btn-refresh { display:none !important; }
      .sl-print-title { display:block; text-align:center; margin-bottom:16px; }
      .sl-print-title h1 { font-size:14pt; margin:0 0 4px; }
      .sl-print-title p  { font-size:9pt;  margin:0; color:#555; }
      .sl-accordion { box-shadow:none; margin-bottom:16pt; page-break-inside:avoid; }
      .sl-header { background:#263238 !important; color:#fff !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
      .sl-chevron { display:none; }
      .sl-body { display:block !important; }
      .sl-table th { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
      .sl-table td.sl-no { color:#000 !important; }
      body { background:#fff; padding:0; }
      /* クラス単体印刷モード: 対象以外を非表示 */
      body.printing-class .sl-accordion:not(.print-target) { display:none !important; }
      body.printing-class .sl-section-head h2,
      body.printing-class .sl-print-title p { display:block !important; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header-bar">
    <a id="back-link" href="admin_menu.html" class="btn-back">← メニューに戻る</a>
    <div id="auth-info" class="auth-info">
      <span id="user-name"></span>としてログイン中
      <button id="logout-btn" class="logout-btn">ログアウト</button>
    </div>
  </div>

  <div class="header">
    <h1>🏆 決勝試技順処理</h1>
    <div id="event-name" class="event-badge">読み込み中...</div>
  </div>

  <div class="info-box">
    クラスを選び、決勝進出人数・試技順を設定して「確認・確定」を押してください。<br>
    確定後は「保存する」を押すまで反映されません。
  </div>

  <!-- クラス選択 -->
  <div class="card">
    <div id="type-row" class="filter-row" style="display:none">
      <span class="filter-label">種目</span>
    </div>
    <div id="gender-row" class="filter-row" style="display:none">
      <span class="filter-label">性別</span>
    </div>
    <div id="class-row" class="filter-row" style="display:none">
      <span class="filter-label">クラス</span>
    </div>
    <div class="finalcount-row">
      <label>決勝人数：</label>
      <input type="number" id="final-count" min="1" max="40" value="8">
      <span style="font-size:.85rem;color:var(--text-sub);">（クラス設定値を自動反映）</span>
      <button class="btn-apply" onclick="applyFinalCount()">確認・確定</button>
    </div>
    <div class="shuffle-row">
      <span class="filter-label">順序</span>
      <label class="shuffle-opt"><input type="radio" name="shuffle" value="none" checked>シャッフルなし（予選逆順）</label>
      <label class="shuffle-opt"><input type="radio" name="shuffle" value="full">完全シャッフル</label>
      <label class="shuffle-opt"><input type="radio" name="shuffle" value="split4">上位4名とそれ以外でシャッフル</label>
    </div>
  </div>

  <!-- 順位表 -->
  <div class="standings-card" id="standings-card" style="display:none">
    <div class="standings-head">
      <span id="standings-title">予選順位</span>
      <span id="standings-meta" style="font-size:.8rem;color:var(--text-sub);margin-left:auto;"></span>
    </div>
    <table>
      <thead>
        <tr>
          <th style="width:50px">予選順位</th>
          <th>選手名 / 所属</th>
          <th style="width:90px">R1</th>
          <th style="width:90px">R2</th>
          <th style="width:100px">予選スコア</th>
          <th style="width:100px">決勝試技順</th>
        </tr>
      </thead>
      <tbody id="standings-tbody"></tbody>
    </table>
  </div>

  <div id="warn-overwrite" class="warn-box" style="display:none">
    ⚠️ このクラスにはすでに決勝試技順が設定されています。保存すると上書きされます。
  </div>

  <button class="btn-save" id="save-btn" style="display:none" disabled>保存する</button>
  <div class="save-status" id="save-status"></div>

  <!-- スタートリスト -->
  <div id="startlist-section" style="display:none">
    <div class="sl-print-title">
      <h1 id="sl-print-event"></h1>
      <p>決勝スタートリスト</p>
    </div>
    <div class="sl-section-head">
      <h2>📋 スタートリスト</h2>
      <button class="btn-print" onclick="window.print()">🖨️ 印刷</button>
      <button class="btn-refresh" onclick="refreshStartList()">↻ 更新</button>
    </div>
    <div id="startlist-container"></div>
  </div>
</div>

<script type="module">
  import { db } from "./firebase-config.js";
  import { doc, getDocs, collection, query, where, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { ensureAdmin, logout } from "./auth.js";
  import { getTournament, getAthletes, getFinalOrders, invalidateCache } from "./cache.js";
  import { normalizeClassRules, calcQualifyingScore, calcQualifyingTb, compareRankEntries } from "./shared.js";

  const params  = new URLSearchParams(location.search);
  const eventId = params.get('event');
  document.getElementById('back-link').href = `admin_menu.html?event=${eventId}`;

  let athletes = [], tourData = null;
  let fType = 'individual', fGender = '', fClass = '';
  let pendingFinalOrder = null; // 確定前プレビュー

  const fmt = v => (v != null ? Number(v).toFixed(3) : '--');

  // ---- 認証 & 初期化 ----
  ensureAdmin(async user => {
    document.getElementById('auth-info').style.display = 'flex';
    document.getElementById('user-name').textContent = user.displayName || user.email;
    document.getElementById('logout-btn').onclick = logout;

    if (!eventId) { document.getElementById('event-name').textContent = 'URLにeventパラメータがありません'; return; }

    const [fetchedTour, fetchedAth] = await Promise.all([
      getTournament(eventId),
      getAthletes(eventId)
    ]);
    if (!fetchedTour) { document.getElementById('event-name').textContent = '大会が見つかりません'; return; }

    tourData = fetchedTour;
    document.getElementById('event-name').textContent = tourData.name || eventId;

    athletes = fetchedAth;
    // 決勝試技順はキャッシュ除外なので毎回Firestoreから取得してマージ
    const finalOrders = await getFinalOrders(eventId);
    athletes.forEach(a => {
      const fo = finalOrders[a.id];
      if (fo) { a.finalOrder = fo.finalOrder; a.isInFinal = fo.isInFinal; }
    });

    buildFilters();
    updateFinalCountFromRule();
    buildStartList();
  });

  // ---- フィルターUI構築 ----
  function buildFilters() {
    const types   = [...new Set(athletes.map(a => a.type || 'individual'))];
    const genders = [...new Set(athletes.map(a => a.gender || '').filter(Boolean))];

    const typeRow = document.getElementById('type-row');
    if (types.length > 1) {
      typeRow.style.display = '';
      [['individual','個人'],['synchro','シンクロ']].forEach(([v,l]) => {
        if (!types.includes(v)) return;
        const b = document.createElement('button');
        b.className = 'tab-btn' + (fType === v ? ' active' : '');
        b.textContent = l;
        b.onclick = () => { fType = v; fGender = ''; fClass = ''; renderFilters(); updateFinalCountFromRule(); };
        typeRow.appendChild(b);
      });
    }

    renderFilters();
  }

  function renderFilters() {
    const byType = athletes.filter(a => (a.type || 'individual') === fType);
    const genders = [...new Set(byType.map(a => a.gender || '').filter(Boolean))];
    const tourClassDefs = (tourData?.classes?.[fType] || []).slice().sort((a,b)=>(a.display_order??99)-(b.display_order??99)).map(c=>c.name);
    const rawClasses = [...new Set(byType.map(a => a.class || a.category || '').filter(Boolean))];
    const classes = [...tourClassDefs.filter(c=>rawClasses.includes(c)), ...rawClasses.filter(c=>!tourClassDefs.includes(c))];

    const genderRow = document.getElementById('gender-row');
    genderRow.innerHTML = '<span class="filter-label">性別</span>';
    if (genders.length > 1) {
      genderRow.style.display = '';
      const allBtn = mkTabBtn('全て', fGender === '', () => { fGender = ''; renderFilters(); updateFinalCountFromRule(); });
      genderRow.appendChild(allBtn);
      genders.forEach(g => {
        genderRow.appendChild(mkTabBtn(g, fGender === g, () => { fGender = g; renderFilters(); updateFinalCountFromRule(); }));
      });
    } else {
      genderRow.style.display = 'none';
      if (genders.length === 1) fGender = genders[0];
    }

    const classRow = document.getElementById('class-row');
    classRow.innerHTML = '<span class="filter-label">クラス</span>';
    if (classes.length > 1) {
      classRow.style.display = '';
      const allBtn = mkTabBtn('全て', fClass === '', () => { fClass = ''; renderFilters(); updateFinalCountFromRule(); });
      classRow.appendChild(allBtn);
      classes.forEach(c => {
        classRow.appendChild(mkTabBtn(c, fClass === c, () => { fClass = c; renderFilters(); updateFinalCountFromRule(); }));
      });
    } else {
      classRow.style.display = classes.length === 1 ? '' : 'none';
      if (classes.length === 1) { fClass = classes[0]; classRow.appendChild(mkTabBtn(classes[0], true, () => {})); }
    }

    // アクティブボタン更新
    document.querySelectorAll('#type-row .tab-btn').forEach(b => {
      b.classList.toggle('active', (b.textContent === '個人' && fType === 'individual') || (b.textContent === 'シンクロ' && fType === 'synchro'));
    });

    pendingFinalOrder = null;
    document.getElementById('standings-card').style.display = 'none';
    document.getElementById('save-btn').style.display = 'none';
    document.getElementById('warn-overwrite').style.display = 'none';
  }

  function mkTabBtn(label, active, fn) {
    const b = document.createElement('button');
    b.className = 'tab-btn' + (active ? ' active' : '');
    b.textContent = label;
    b.onclick = fn;
    return b;
  }

  // ---- クラスルールから決勝人数を自動入力 ----
  function updateFinalCountFromRule() {
    if (!tourData) return;
    const byType = normalizeClassRules(tourData.classRules);
    const rule = (byType[fType] || {})[fClass] || {};
    if (rule.finalCount) document.getElementById('final-count').value = rule.finalCount;
  }

  // ---- Fisher-Yates シャッフル ----
  function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ---- 確認・確定ボタン ----
  window.applyFinalCount = async function() {
    const finalCount  = parseInt(document.getElementById('final-count').value);
    if (!finalCount || finalCount < 1) { alert('決勝人数を入力してください'); return; }
    const shuffleMode = document.querySelector('input[name="shuffle"]:checked')?.value || 'none';

    // このクラスの全選手を取得
    const classAthletes = athletes.filter(a =>
      (a.type || 'individual') === fType &&
      (!fGender || (a.gender || '') === fGender) &&
      (!fClass  || (a.class || a.category || '') === fClass)
    );
    if (classAthletes.length === 0) { alert('該当する選手がいません'); return; }

    // publishedな予選結果を取得
    const resSnap = await getDocs(query(
      collection(db, 'results'),
      where('eventId', '==', eventId),
      where('published', '==', true)
    ));
    const resultsByAth = {};
    resSnap.docs.forEach(d => {
      const r = d.data();
      if (!resultsByAth[r.athleteId]) resultsByAth[r.athleteId] = {};
      resultsByAth[r.athleteId][r.round] = r;
    });

    // クラスルールからscoreMode取得
    const byType = normalizeClassRules(tourData.classRules);
    const rule = (byType[fType] || {})[fClass] || {};
    const numPre    = rule.qualifyingRoutines ?? tourData.qualifyingRoutines ?? 1;
    const scoreMode = rule.scoreMode || 'best';

    // 予選スコア計算・順位付け（shared.js 共通関数を使用）
    const sorted = classAthletes.map(a => {
      const rMap  = resultsByAth[a.id] || {};
      const pre1r = rMap['pre1'] || null;
      const pre2r = rMap['pre2'] || null;
      const pre1  = pre1r?.officialTotal ?? null;
      const pre2  = pre2r?.officialTotal ?? null;
      const qualScore       = calcQualifyingScore(pre1, pre2, numPre, scoreMode);
      const { tbSum, tb }   = calcQualifyingTb(pre1, pre2, pre1r, pre2r, numPre, scoreMode);
      return { a, pre1, pre2, qualScore, tbSum, tb };
    }).sort(compareRankEntries);

    const actual = Math.min(finalCount, sorted.filter(r => r.qualScore != null).length);

    // 予選順位を付与
    const withRanks = sorted.map((entry, idx) => ({
      ...entry,
      qualRank: idx + 1,
      inFinal:  idx < actual && entry.qualScore != null
    }));

    const finalists    = withRanks.filter(e => e.inFinal);
    const nonFinalists = withRanks.filter(e => !e.inFinal);

    // シャッフルモードに応じて試技順を決定
    let trialOrder;
    if (shuffleMode === 'full') {
      trialOrder = shuffleArray(finalists);
    } else if (shuffleMode === 'split4') {
      if (actual <= 4) {
        // 4人以下は完全シャッフルと同じ
        trialOrder = shuffleArray(finalists);
      } else {
        const top4 = shuffleArray(finalists.slice(0, 4)); // 予選上位4名
        const rest = shuffleArray(finalists.slice(4));    // それ以外
        trialOrder = [...rest, ...top4]; // 下位グループが先、上位4名が後
      }
    } else {
      // none: 予選逆順（下位から先に試技、1位が最後）
      trialOrder = [...finalists].reverse();
    }

    // finalOrder割り当て（1 = 最初に試技、actual = 最後に試技）
    trialOrder.forEach((entry, i) => { entry.finalOrder = i + 1; });

    // 予選順位順に並べて表示用データとする
    pendingFinalOrder = [...finalists, ...nonFinalists].sort((a, b) => a.qualRank - b.qualRank);

    renderStandings(pendingFinalOrder, numPre, actual, shuffleMode);
    document.getElementById('standings-card').style.display = '';
    document.getElementById('save-btn').style.display = '';
    document.getElementById('save-btn').disabled = false;
    document.getElementById('save-status').textContent = '';

    const hasExisting = classAthletes.some(a => a.finalOrder != null);
    document.getElementById('warn-overwrite').style.display = hasExisting ? '' : 'none';
  };

  // ---- 順位表描画 ----
  function renderStandings(entries, numPre, actual, shuffleMode = 'none') {
    const title = [fClass, fGender, fType === 'synchro' ? 'シンクロ' : '個人'].filter(Boolean).join(' ');
    const shuffleLabel = { none:'逆順', full:'完全シャッフル', split4:'上位4名分割シャッフル' }[shuffleMode] || shuffleMode;
    document.getElementById('standings-title').textContent = `${title} 予選順位`;
    document.getElementById('standings-meta').textContent = `決勝進出: ${actual}人 ／ ${shuffleLabel}`;

    const r2col = numPre >= 2;
    const tbody = document.getElementById('standings-tbody');
    tbody.innerHTML = entries.map(e => {
      const badge = e.inFinal
        ? `<span class="final-order-badge">${e.finalOrder}</span>`
        : '<span style="color:#bbb;font-size:.8rem;">−</span>';
      const r2cell = r2col ? `<td class="num">${fmt(e.pre2)}</td>` : '';
      return `<tr class="${e.inFinal ? 'finalist' : 'non-finalist'}">
        <td class="num">${e.qualRank}</td>
        <td>
          <div style="font-weight:700">${e.a.name1 || '---'}</div>
          <div style="font-size:.78rem;color:var(--text-sub)">${e.a.club1 || ''}</div>
        </td>
        <td class="num">${fmt(e.pre1)}</td>
        ${r2cell}
        <td class="num">${e.qualScore != null ? fmt(e.qualScore) : '<span class="no-score">未提出</span>'}</td>
        <td>${badge}</td>
      </tr>`;
    }).join('');

    // theadのR2列
    const thead = document.querySelector('table thead tr');
    const r2th = thead.querySelector('th:nth-child(4)');
    if (!r2col && r2th) r2th.style.display = 'none';
    else if (r2th) r2th.style.display = '';
  }

  // ---- スタートリスト ----
  function buildStartList() {
    const finalists = athletes.filter(a => a.isInFinal && a.finalOrder != null);
    const section   = document.getElementById('startlist-section');
    if (finalists.length === 0) { section.style.display = 'none'; return; }

    // 印刷タイトルに大会名をセット
    document.getElementById('sl-print-event').textContent = tourData?.name || '';

    // クラス別グループ化（種目 → 性別 → クラス順）
    const tourClassDefs = {};
    ['individual','synchro'].forEach(tp => {
      (tourData?.classes?.[tp] || [])
        .slice().sort((a,b)=>(a.display_order??99)-(b.display_order??99))
        .forEach((c, i) => { tourClassDefs[`${tp}|${c.name}`] = i; });
    });

    const groupMap = {};
    finalists.forEach(a => {
      const type   = a.type || 'individual';
      const gender = a.gender || '';
      const cls    = a.class || a.category || '';
      const key    = `${type}|${gender}|${cls}`;
      if (!groupMap[key]) groupMap[key] = { type, gender, cls, athletes: [] };
      groupMap[key].athletes.push(a);
    });

    // グループを種目→クラス定義順→性別順でソート
    const groups = Object.entries(groupMap).sort(([ka,a],[kb,b]) => {
      if (a.type !== b.type) return a.type === 'individual' ? -1 : 1;
      const oa = tourClassDefs[`${a.type}|${a.cls}`] ?? 99;
      const ob = tourClassDefs[`${b.type}|${b.cls}`] ?? 99;
      if (oa !== ob) return oa - ob;
      return (a.gender||'').localeCompare(b.gender||'');
    }).map(([,g]) => g);

    const container = document.getElementById('startlist-container');
    container.innerHTML = '';

    groups.forEach(g => {
      g.athletes.sort((a,b) => (a.finalOrder||999) - (b.finalOrder||999));
      const typeLabel = g.type === 'synchro' ? 'シンクロ' : '個人';
      const title = [g.cls, g.gender, typeLabel].filter(Boolean).join(' ');

      const rows = g.athletes.map(a => {
        if (a.type === 'synchro') {
          const kana = [a.kana1, a.kana2].filter(Boolean).join(' / ');
          const name = `${a.name1 || '---'} / ${a.name2 || '---'}`;
          const club = [a.club1, a.club2].filter(Boolean).join(' / ');
          return `<tr>
            <td class="sl-no">${a.finalOrder}</td>
            <td>${kana ? `<div class="sl-kana">${kana}</div>` : ''}<div class="sl-name">${name}</div></td>
            <td class="sl-club">${club}</td>
          </tr>`;
        } else {
          return `<tr>
            <td class="sl-no">${a.finalOrder}</td>
            <td>${a.kana1 ? `<div class="sl-kana">${a.kana1}</div>` : ''}<div class="sl-name">${a.name1 || '---'}</div></td>
            <td class="sl-club">${a.club1 || ''}</td>
          </tr>`;
        }
      }).join('');

      const acc = document.createElement('div');
      acc.className = 'sl-accordion';
      acc.innerHTML = `
        <div class="sl-header" onclick="this.closest('.sl-accordion').classList.toggle('open')">
          <span class="sl-title">${title}</span>
          <span class="sl-count">${g.athletes.length}人</span>
          <button class="sl-btn-print-cls" onclick="event.stopPropagation();printClass(this,'${title}')">🖨️ 印刷</button>
          <span class="sl-chevron">▼</span>
        </div>
        <div class="sl-body">
          <table class="sl-table">
            <thead><tr>
              <th class="num-col">No.</th>
              <th>ふりがな / 氏名</th>
              <th>所属</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
      container.appendChild(acc);
    });

    section.style.display = '';
  }

  window.printClass = function(btn, title) {
    const acc = btn.closest('.sl-accordion');
    // 印刷タイトルをクラス名に更新
    document.getElementById('sl-print-event').textContent = `${tourData?.name || ''} — ${title}`;
    acc.classList.add('print-target', 'open'); // 本文を確実に展開
    document.body.classList.add('printing-class');
    window.print();
    window.onafterprint = () => {
      acc.classList.remove('print-target');
      document.body.classList.remove('printing-class');
      document.getElementById('sl-print-event').textContent = tourData?.name || '';
      window.onafterprint = null;
    };
  };

  window.refreshStartList = async function() {
    const btn = document.querySelector('.btn-refresh');
    btn.textContent = '読込中...'; btn.disabled = true;
    try {
      const finalOrders = await getFinalOrders(eventId);
      athletes.forEach(a => {
        const fo = finalOrders[a.id];
        a.finalOrder = fo?.finalOrder ?? null;
        a.isInFinal  = fo?.isInFinal  ?? false;
      });
      buildStartList();
    } finally {
      btn.textContent = '↻ 更新'; btn.disabled = false;
    }
  };

  // ---- 保存 ----
  document.getElementById('save-btn').addEventListener('click', async () => {
    if (!pendingFinalOrder) return;
    const btn = document.getElementById('save-btn');
    const status = document.getElementById('save-status');
    btn.disabled = true;
    status.style.color = '#888';
    status.textContent = '保存中...';

    try {
      const batch = writeBatch(db);
      pendingFinalOrder.forEach(e => {
        const ref = doc(db, 'tournaments', eventId, 'athletes', e.a.id);
        batch.update(ref, {
          finalOrder: e.inFinal ? e.finalOrder : null,
          isInFinal:  e.inFinal
        });
      });
      await batch.commit();
      invalidateCache(eventId);

      // ローカルのathletesデータも更新
      pendingFinalOrder.forEach(e => {
        const a = athletes.find(x => x.id === e.a.id);
        if (a) { a.finalOrder = e.inFinal ? e.finalOrder : null; a.isInFinal = e.inFinal; }
      });

      status.style.color = '#2e7d32';
      status.textContent = `✅ 保存しました。CJP・D審判の「決勝のみ」フィルターに反映されます。`;
      document.getElementById('warn-overwrite').style.display = 'none';
      buildStartList();
    } catch (err) {
      status.style.color = '#c62828';
      status.textContent = `❌ 保存に失敗しました: ${err.message}`;
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
