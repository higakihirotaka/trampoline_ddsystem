<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>審判入力 (2画面比較) - Trampoline Scoring System</title>
    <style>
        :root { --primary: #37474f; --accent: #1a73e8; --bg: #eceff1; --card: #ffffff; --ok-green: #2e7d32; --warn-orange: #f57c00; --gray: #78909c; --danger: #d32f2f; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 350px; background: #fff; border-right: 1px solid #cfd8dc; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 25px; background: var(--primary); color: white; }
        .sidebar-filters { background: #eceff1; border-bottom: 2px solid #cfd8dc; padding: 8px 10px; display: flex; flex-direction: column; gap: 5px; flex-shrink: 0; }
        .filter-row { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
        .filter-label { font-size: 0.58rem; color: #90a4ae; font-weight: bold; text-transform: uppercase; min-width: 24px; }
        .tab-btn { padding: 4px 10px; border-radius: 20px; border: 1px solid #b0bec5; background: white; color: #546e7a; font-size: 0.72rem; font-weight: bold; cursor: pointer; transition: 0.15s; white-space: nowrap; }
        .tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        .sidebar-list { flex-grow: 1; overflow-y: auto; padding-bottom: 50px; }

        .cat-group { background: #cfd8dc; padding: 10px 15px; font-size: 0.85em; font-weight: bold; color: #37474f; border-bottom: 1px solid #b0bec5; }
        .gender-group { background: #f1f3f4; padding: 6px 20px; font-size: 0.75em; font-weight: bold; color: #78909c; border-bottom: 1px solid #eee; }

        .athlete-row { padding: 8px 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .athlete-row.active-athlete { background: #f0f7ff; }
        .ath-name-text { flex-grow: 1; min-width: 0; }
        .ath-name-main { font-size: 0.85em; font-weight: bold; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ath-name-sub { font-size: 0.72em; color: #90a4ae; font-weight: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
        .ath-order { color: var(--accent); margin-right: 4px; font-family: monospace; }
        
        .round-box { display: flex; gap: 6px; }
        .r-dot { 
            width: 42px; height: 28px; border-radius: 4px; font-size: 0.75em; 
            display: flex; align-items: center; justify-content: center; 
            background: #eee; color: #999; text-decoration: none; border: 2px solid transparent; font-weight: bold; transition: 0.2s;
        }
        .r-dot.has-sub { background: #e3f2fd; color: #1a73e8; border: 1px solid #bbdefb; } 
        .r-dot.has-res { background: #e8f5e9; color: var(--ok-green); border: 1px solid #c8e6c9; } 
        .r-dot.current { border: 2px solid #000; transform: scale(1.15); z-index: 1; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .r-dot.current:not(.has-res) { background: #fff; color: var(--accent); }
        .r-dot.has-res.current { background: var(--ok-green); color: #fff; border-color: #000; }
        /* CJPがDNS（棄権）で確定したラウンドは薄い赤にする（CJP画面と統一） */
        .r-dot.dns-dot { background: #fee2e2; color: #dc2626; border-color: #fca5a5; }
        .r-dot.dns-dot.current { background: #fee2e2; color: #dc2626; border-color: #dc2626; }

        /* 【重要】申告相違があるラウンドの文字を赤くする */
        .r-dot.diff-dot { color: var(--danger) !important; font-weight: 900; }

        .main-content { flex-grow: 1; overflow-y: auto; padding: 18px 24px; display: flex; justify-content: center; align-items: flex-start; }
        .score-card { background: white; width: 100%; max-width: 1150px; padding: 20px 26px; border-radius: 20px; box-shadow: 0 4px 25px rgba(0,0,0,0.08); margin-top: 4px; }

        .header-info { border-bottom: 2px solid #eee; padding-bottom: 12px; margin-bottom: 16px; }
        .header-info h2 { margin: 4px 0 6px 0; font-size: 1.5em; font-weight: 900; display: flex; align-items: baseline; gap: 10px; }

        /* 技テーブル（左）＋ サイドパネル（右：有効本数・合計・縦長の確定ボタン）の横並び */
        .score-body { display: flex; gap: 18px; align-items: stretch; }
        .table-wrap { flex: 1; min-width: 0; }
        .side-panel { width: 230px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; }

        .comparison-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .comparison-table th, .comparison-table td { padding: 7px 5px; border-bottom: 1px solid #f0f0f0; text-align: center; font-size: 1.05em; transition: 0.3s; }
        .col-num { width: 45px; color: #999; font-size: 0.85em; position: relative; }
        .col-num.designated { color: #d97706; font-weight: 900; }
        .col-num.designated::after {
            content: '★';
            position: absolute; top: 3px; right: 4px;
            font-size: 0.55em; color: #f59e0b; line-height: 1;
        }
        .col-sub { width: 22%; background: #f9f9f9; color: #555; font-weight: bold; } 
        .col-sub-dd { width: 65px; background: #f9f9f9; color: #999; font-family: monospace; }
        
        select { width: 100%; box-sizing: border-box; padding: 7px 8px; border-radius: 8px; border: 1px solid #ddd; font-size: 1em; background: #fff; cursor: pointer; }
        select:disabled { background: #f5f5f5; color: #777; cursor: default; border-color: #eee; }

        /* 重複ハイライト & 無効行 & 申告相違赤字 */
        .duplicate-row td { background-color: #fff176 !important; }
        .invalid-row td { background-color: #f5f5f5 !important; color: #bbb !important; }
        .diff-skill { color: var(--danger) !important; font-weight: 900; }
        .dd-zero { color: var(--danger) !important; font-weight: 900; }
        .dd-capped { color: #e65100 !important; font-weight: 900; }

        .valid-count-area { margin: 0; padding: 10px; background: #f8f9fa; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 1px solid #eee; }
        .footer-stats { margin: 0; padding: 10px 8px; border-top: none; display: flex; flex-direction: column; align-items: center; gap: 3px; background: #f1f8e9; border-radius: 12px; border: 1px solid #c8e6c9; }
        .total-official { font-size: 2.4em; font-weight: 900; color: var(--ok-green); line-height: 1.0; display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .total-official span { white-space: nowrap; }
        .total-official.diff-skill { color: var(--danger); }

        .action-area { margin: 0; flex: 1; display: flex; }
        .btn { width: 100%; height: 100%; min-height: 110px; padding: 18px 12px; border: none; border-radius: 14px; font-size: 1.25em; font-weight: bold; cursor: pointer; transition: 0.2s; line-height: 1.4; }
        .btn-submit { background: var(--ok-green); color: white; box-shadow: 0 8px 20px rgba(46, 125, 50, 0.2); }
        .btn-modify { background: white; color: var(--warn-orange); border: 3px solid var(--warn-orange); }
        .btn-fetch-declared { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--accent); background: #e8f0fe; color: var(--accent); font-size: 0.82em; font-weight: bold; cursor: pointer; white-space: nowrap; transition: 0.15s; }
        .btn-fetch-declared:hover { background: var(--accent); color: #fff; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        /* 難度制限あり: 合計Dの下に参考表示（確定ボタンはその分だけ縦が縮むだけ） */
        .cap-ref { margin: 0; padding: 10px 12px; background: #fff8e1; border: 1px solid #ffe0b2; border-radius: 12px; display: flex; flex-direction: column; gap: 5px; flex-shrink: 0; }
        .cap-ref-title { font-size: 0.78em; font-weight: 900; color: #e65100; letter-spacing: 0.03em; text-align: center; }
        .cap-ref-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.9em; color: #6d4c41; }
        .cap-ref-row b { font-size: 1.15em; color: #e65100; }
        .status-badge { display: inline-block; font-size: 0.75em; font-weight: bold; padding: 4px 12px; border-radius: 20px; }
        .badge-locked { background: #e8f5e9; color: var(--ok-green); border: 1px solid #c8e6c9; }
        .badge-cjp-locked { background: #ffebee; color: var(--danger); border: 1px solid #ffcdd2; }
        .cjp-lock-msg { width: 100%; min-height: 110px; box-sizing: border-box; color: var(--danger); font-weight: bold; padding: 14px; text-align: center; background: #ffebee; border-radius: 10px; border: 2px solid #ffcdd2; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">
        <div style="font-size: 0.8em; opacity: 0.8;">JUDGE CONSOLE</div>
        <div id="event-name" style="font-weight: 900; font-size: 1.2em; margin-top: 5px;">Loading...</div>
        <div id="panel-role-label" style="font-size: 0.75em; opacity: 0.85; margin-top: 6px; letter-spacing: 0.05em;"></div>
        <a href="#" id="menu-back" style="color: white; font-size: 0.75em; text-decoration: none; display: block; margin-top: 10px; opacity: 0.7;">← 役割選択に戻る</a>
    </div>
    <div id="sidebar-filters" class="sidebar-filters"></div>
    <div id="sidebar-list" class="sidebar-list"></div>
</div>

<div class="main-content" id="main-content">
    <div style="margin-top: 150px; text-align: center; color: #90a4ae;">
        <div style="font-size: 4em; margin-bottom: 20px;">📋</div>
        <div style="font-size: 1.2em;">左のリストからラウンドを選択してください</div>
    </div>
</div>

<script type="module">
    import { db } from "./firebase-config.js";
    import { doc, collection, getDocs, query, where, setDoc, serverTimestamp, increment, onSnapshot, deleteField } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getTournament, getAthletes, getFinalOrders } from "./cache.js";
    import { round1 } from "./shared.js";
    
    const params = new URLSearchParams(location.search);
    const eventId = params.get('event')?.trim();
    const panel   = params.get('panel')?.trim() || '';
    const role    = params.get('role')?.trim()  || '';
    let athleteId = params.get('athlete')?.trim(), round = params.get('round') || "pre1";

    let skillMaster = [], athletes = [], submissions = {}, results = {}, currentTour = null;
    // id/symbol → skill の索引。renderSidebar 経由で checkHasDiff が選手×ラウンドぶん
    // 繰り返し呼ぶため、線形 .find() のままだと再描画のたびに技マスタ全件スキャンになる。
    let skillMasterById = new Map(), skillMasterBySymbol = new Map();
    let _pendingSidebarScroll = null; // 確定後の再読込で左リストのスクロール位置を保持するため
    let cjpConfirmed = false; // CJPが公式スコアを確定済（published:true）かどうか
    let unsubValidCount = null;
    let fType = 'individual', fClass = '', fGender = '', fFinalOnly = false;
    let designatedDDCount = -1;   // -1=無効, 0=全DD0, 1以上=N本指定
    let perSkillDDCap = null;     // 1技あたり難度上限（null=なし）
    let routineDDCap  = null;     // 構成あたり難度上限（null=なし）
    let designatedDDIndices = []; // 指定技インデックス（0-based）

    // Firestore doc ID (文字列 or 数値) でスキルを引く。位置アクセスは使わない
    function findSkillById(id) {
        if (id === null || id === undefined || id === '') return null;
        return skillMasterById.get(String(id)) || null;
    }

    function resolveSubSkill(s) {
        if (!s) return null;
        if (typeof s === 'object') {
            if (s.id) return findSkillById(s.id);
            if (s.skill) return skillMasterBySymbol.get(s.skill) || null;
            return null;
        }
        // 数値文字列 → ID として検索（旧形式互換）
        if (!isNaN(s) && s !== '') return findSkillById(s) || skillMasterBySymbol.get(String(s)) || null;
        return skillMasterBySymbol.get(s) || null;
    }

    function withTimeout(promise, ms) {
        return Promise.race([
            promise,
            new Promise((_, reject) => setTimeout(() => reject(new Error('TIMEOUT')), ms))
        ]);
    }

    function showLoadState(msg, isError) {
        document.getElementById('sidebar-list').innerHTML = `
            <div style="padding:24px;text-align:center;color:${isError ? '#e53935' : '#90a4ae'};">
                <div style="font-size:2em;margin-bottom:10px;">${isError ? '⚠️' : '⏳'}</div>
                <div style="font-weight:bold;margin-bottom:${isError ? '14px' : '0'};">${msg}</div>
                ${isError ? '<button onclick="retryInit()" style="padding:10px 24px;background:#1a73e8;color:white;border:none;border-radius:8px;font-size:0.9em;cursor:pointer;font-weight:bold;">🔄 再読み込み</button>' : ''}
            </div>`;
        if (isError) document.getElementById('event-name').innerText = '読み込みエラー';
    }

    window.retryInit = () => init();
    let _initRunning = false;

    async function init() {
        if (!eventId || _initRunning) return;
        _initRunning = true;
        document.getElementById('menu-back').href = `judge_role_select.html?event=${eventId}`;
        if (panel || role) {
            const parts = [panel && `PANEL ${panel}`, role && `ROLE ${role}`].filter(Boolean);
            document.getElementById('panel-role-label').textContent = parts.join(' | ');
        }
        showLoadState('データを読み込んでいます...', false);
        try {
            // tournaments/athletes は cache.js 経由（同タブ内で他画面が読み込み済みならFirestore不要）。
            // finalOrder/isInFinal は試技順変更で頻繁に更新されるためキャッシュ対象外＝毎回取得し、
            // athletes にマージする（judge_cjp.html と同一パターン）。
            const [tourData, athleteList, subSnap, resSnap, smSnap, finalOrders] = await withTimeout(
                Promise.all([
                    getTournament(eventId),
                    getAthletes(eventId),
                    getDocs(query(collection(db, "submissions"), where("eventId", "==", eventId))),
                    getDocs(query(collection(db, "results"), where("eventId", "==", eventId))),
                    getDocs(collection(db, "skillMaster")),
                    getFinalOrders(eventId)
                ]),
                20000
            );

            // skillMaster: ドキュメントID（数値文字列）でソートして配列化（ID=インデックスでアクセスされる）
            skillMaster = smSnap.docs
                .sort((a, b) => parseInt(a.id) - parseInt(b.id))
                .map(d => {
                    const data = d.data();
                    const dd = parseFloat(data.dd) || 0;
                    const s = {
                        id: d.id,
                        symbol: data.symbol,
                        dd,
                        isTriple: data.isTriple === true,
                        direction: data.direction || '',
                        somersaultType: data.somersaultType || '',
                        note: data.note || '',
                        displayOrder: data.displayOrder ?? parseInt(d.id)
                    };
                    // 2回宙は DD で低(≤1.5)/高(≥1.6) に自動分類（選手入力の getSkills と同一）
                    if (s.somersaultType === '2回宙') s.doubleSomaGroup = (dd >= 1.6) ? 'high' : 'low';
                    return s;
                });
            skillMasterById     = new Map(skillMaster.map(s => [s.id, s]));
            skillMasterBySymbol = new Map(skillMaster.map(s => [s.symbol, s]));

            if (!tourData) throw new Error('大会データが見つかりません');
            currentTour = tourData;
            document.getElementById('event-name').innerText = currentTour.name;
            // 決勝試技順はキャッシュ除外なので毎回取得したものをマージ
            athletes = athleteList.map(a => {
                const fo = finalOrders[a.id];
                return fo ? { ...a, finalOrder: fo.finalOrder, isInFinal: fo.isInFinal } : a;
            });
            submissions = {}; subSnap.forEach(d => { submissions[d.id] = d.data(); });
            results = {}; resSnap.forEach(d => { results[d.id] = d.data(); });

            renderSidebar();
            if (athleteId) renderScoringArea();
        } catch (e) {
            console.error("Init Error:", e);
            const msg = e.message === 'TIMEOUT' ? 'ネットワーク接続に時間がかかっています' : 'データの読み込みに失敗しました';
            showLoadState(msg, true);
        } finally {
            _initRunning = false;
        }
    }

    function checkHasDiff(aid, rid) {
        const subId = `${eventId}_${aid}_${rid}`;
        const sub = submissions[subId], res = results[subId];
        if (!sub || !res || !res.officialSkills) return false;
        const validLimit = res.validCount !== undefined ? res.validCount : 10;
        for (let i = 0; i < validLimit; i++) {
            const skill = findSkillById(res.officialSkills[i]);
                const subSkill = resolveSubSkill(sub.skills[i]);
            if (skill && subSkill && skill.symbol !== subSkill.symbol) return true;
        }
        return false;
    }

    function renderSidebar() {
        if (!currentTour) return;
        const isSynchro = fType === 'synchro';

        // 種目でまず分ける
        const byType = athletes.filter(a => (a.type || 'individual') === fType);

        // クラス一覧
        const tourClassDefs = (Array.isArray(currentTour?.classes) ? currentTour.classes : (currentTour?.classes?.[fType] || [])).slice().sort((a,b)=>(a.display_order??99)-(b.display_order??99)).map(c=>c.name);
        const rawClasses = [...new Set(byType.map(a => a.class || a.category || ''))];
        const classes = [...tourClassDefs.filter(c=>rawClasses.includes(c)), ...rawClasses.filter(c=>!tourClassDefs.includes(c))];

        // 性別一覧
        const genders = [...new Set(byType.map(a => a.gender || ''))].filter(Boolean);

        // フィルタータブ描画
        const hasType = athletes.some(a => (a.type || 'individual') === 'synchro');
        const filterEl = document.getElementById('sidebar-filters');
        let filHtml = '';

        if (hasType) {
            filHtml += `<div class="filter-row">
                <span class="filter-label">種目</span>
                <button class="tab-btn ${fType==='individual'?'active':''}" onclick="setFilter('type','individual')">個人</button>
                <button class="tab-btn ${fType==='synchro'?'active':''}" onclick="setFilter('type','synchro')">シンクロ</button>
            </div>`;
        }

        if (classes.length > 1) {
            filHtml += `<div class="filter-row"><span class="filter-label">クラス</span>
                <button class="tab-btn ${fClass===''?'active':''}" onclick="setFilter('class','')">全て</button>
                ${classes.map(c => `<button class="tab-btn ${fClass===c?'active':''}" onclick="setFilter('class','${c}')">${c}</button>`).join('')}
            </div>`;
        }

        if (genders.length > 1) {
            filHtml += `<div class="filter-row"><span class="filter-label">性別</span>
                <button class="tab-btn ${fGender===''?'active':''}" onclick="setFilter('gender','')">全て</button>
                ${genders.map(g => `<button class="tab-btn ${fGender===g?'active':''}" onclick="setFilter('gender','${g}')">${g}</button>`).join('')}
            </div>`;
        }

        // 決勝フィルター行を追加
        const hasAnyFinals = athletes.some(a => a.finalOrder != null);
        if (hasAnyFinals) {
            filHtml += `<div class="filter-row">
                <span class="filter-label">決勝</span>
                <button class="tab-btn ${!fFinalOnly?'active':''}" onclick="setFilter('finalOnly',false)">全て</button>
                <button class="tab-btn ${fFinalOnly?'active':''}" onclick="setFilter('finalOnly',true)">🏆 決勝のみ</button>
            </div>`;
        }

        filterEl.style.display = filHtml ? '' : 'none';
        filterEl.innerHTML = filHtml;

        // 絞り込み＆ソート
        let filtered;
        if (fFinalOnly) {
            filtered = byType  // athletes ではなく種目フィルタ済みの byType を使う
                .filter(a => a.finalOrder != null)
                .filter(a => !fClass  || (a.class || a.category || '') === fClass)
                .filter(a => !fGender || (a.gender || '') === fGender)
                .sort((a, b) => (a.finalOrder ?? 999) - (b.finalOrder ?? 999));
        } else {
            filtered = byType
                .filter(a => !fClass  || (a.class || a.category || '') === fClass)
                .filter(a => !fGender || (a.gender || '') === fGender)
                .sort((a, b) => {
                    const ca = (a.class || a.category || ''), cb = (b.class || b.category || '');
                    if (ca !== cb) return ca.localeCompare(cb);
                    const ga = a.gender || '', gb = b.gender || '';
                    if (ga !== gb) return ga.localeCompare(gb);
                    return (a.order ?? 999) - (b.order ?? 999);
                });
        }

        const listEl = document.getElementById('sidebar-list');
        let html = "";
        let lastCat = "", lastGender = "";

        filtered.forEach(ath => {
            const cls = ath.class || ath.category || '';
            if (cls !== lastCat) {
                html +=`<div class="cat-group">${cls}</div>`;
                lastCat = cls; lastGender = "";
            }
            if (!fFinalOnly && (ath.gender || '') !== lastGender) {
                html +=`<div class="gender-group">${ath.gender || ''}</div>`;
                lastGender = ath.gender || '';
            }

            // クラスごとの予選本数を classRules から取得
            const athType = ath.type || 'individual';
            const classRule = currentTour.classRules?.[athType]?.[cls] || {};
            const numPre = classRule.qualifyingRoutines ?? currentTour.qualifyingRoutines ?? 1;
            const hasFinalClass = classRule.hasFinal ?? false;

            let dotsHtml = "";
            if (fFinalOnly) {
                dotsHtml = getDotHtml(ath.id, 'final', 'F');
            } else {
                for (let i = 1; i <= numPre; i++) dotsHtml += getDotHtml(ath.id, `pre${i}`, `R${i}`);
                if (hasFinalClass) dotsHtml += getDotHtml(ath.id, 'final', 'F');
            }

            const orderNum = fFinalOnly ? ath.finalOrder : ath.order;
            const nameLine1 = isSynchro
                ? `<span class="ath-order">${orderNum}.</span>${ath.name1} / ${ath.name2 || ''}`
                : `<span class="ath-order">${orderNum}.</span>${ath.name1}`;
            const nameLine2 = isSynchro
                ? (ath.kana1 || ath.kana2 ? `${ath.kana1 || ''} / ${ath.kana2 || ''}` : '')
                : (ath.kana1 || '');
            const titleAttr = `${ath.name1 || ''}${ath.kana1 ? ' (' + ath.kana1 + ')' : ''}`;

            html += `
                <div class="athlete-row ${ath.id === athleteId ? 'active-athlete' : ''}" title="${titleAttr}">
                    <div class="ath-name-text">
                        <div class="ath-name-main">${nameLine1}</div>

    // ディスプレイサイズに合わせてスコアカード全体を自動フィット（縮小/拡大）させる
    function fitScoreCard() {
        const mc = document.getElementById('main-content');
        const card = mc && mc.querySelector('.score-card');
        if (!card) return;
        card.style.zoom = '1';
        const cs = getComputedStyle(mc);
        const availW = mc.clientWidth  - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
        const availH = mc.clientHeight - parseFloat(cs.paddingTop)  - parseFloat(cs.paddingBottom);
        const natW = card.offsetWidth, natH = card.offsetHeight;
        if (!natW || !natH) return;
        let z = Math.min(availW / natW, (availH - 6) / natH);
        z = Math.max(0.5, Math.min(z, 1.4)); // 縮小は0.5倍まで・拡大は1.4倍まで
        card.style.zoom = String(z);
    }

        const rawDDCount = classRule.designatedDDCount ?? -1;

                headerClub = [p1, p2].filter(Boolean).join(' / ');

        } else {

        }

        // 難度制限（1技/構成）があるときは合計Dの下に参考表示する（確定ボタンはその分だけ縦が縮む）
        const actionBtnHtml = cjpConfirmed

        const capRefHtml = (perSkillDDCap != null || routineDDCap != null) ? `

                            ${routineDDCap  != null ? `<div class="cap-ref-row"><span>構成上限</span><b>${routineDDCap.toFixed(1)}</b></div>` : ''}

        document.getElementById('main-content').innerHTML = `
            <div class="score-card">

                        <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">

                            ${cjpConfirmed ? '<span class="status-badge badge-cjp-locked">🔒 CJP確定済</span>' : dSaved ? '<span class="status-badge badge-locked">✓ D確定済</span>' : ''}
                            ${noSub ? '<span style="font-size:0.85em; font-weight:bold; color:var(--warn-orange); background:#fff3e0; padding:4px 10px; border-radius:6px; border:1px solid #ffcc80;">⚠ 選手未申告</span>' : ''}

        const tbody = document.getElementById('skill-rows');
        for (let i = 1; i <= 10; i++) {
            const currentId = initialIds[i-1] || "";
            const skill = findSkillById(currentId) || {};
            const subSkill = resolveSubSkill((sub?.skills || [])[i-1]);

            const tr = document.createElement('tr'); tr.id = `row-${i}`;
            // 2段目セレクタ（宙系 or 基礎技の開始姿勢）は updateOptions() が系統に応じて動的構築する（選手入力と同一）
            tr.innerHTML = `<td class="col-num">${i}</td><td class="col-sub">${subSkill?.symbol || "-"}</td><td class="col-sub-dd">${subSkill?.dd?.toFixed(1) || '0.0'}</td>
                <td><select id="dir-${i}" onchange="updateOptions(${i})" ${(isLocked || cjpConfirmed) ? 'disabled' : ''}>

    // 2段目セレクタの選択肢（系統で出し分け: 基礎技=開始姿勢 / 宙技=宙系）※選手入力(entry.html)と同一
    const SOMA_OPTIONS = {
        basic:  [['','--（全て）'], ['スタンドから','スタンドから'], ['腰から','腰から'], ['腹から','腹から'], ['背から','背から']],
        aerial: [['','--'], ['1回宙','1回宙系'], ['2回宙（1.5以下）','2回宙系（1.5以下）'], ['2回宙（1.6以上）','2回宙系（1.6以上）'], ['3回宙','3回宙系'], ['4回宙','4回宙系']]

        const sel    = document.getElementById(`skill-${idx}`);
        if (!sel) return;
        const currentVal = sel.value;
        const isBasic = dir === '基礎技';
        // 2段目セレクタ: 系統に応じて選択肢を再構築（基礎技でも表示し、開始姿勢を選べるようにする）
        if (somaEl) {
            const showSoma = !!dir;
            somaEl.style.visibility = showSoma ? '' : 'hidden';
            let want = somaEl.value;
            if (selectedId) {
                const sk = skillMaster.find(s => s.id === selectedId);
                if (sk) {
                    want = (sk.direction === '基礎技') ? (sk.somersaultType || '')
                         : (sk.somersaultType === '2回宙')
                             ? (sk.doubleSomaGroup === 'high' ? '2回宙（1.6以上）' : '2回宙（1.5以下）')
                             : (sk.somersaultType || '');
                }
            }
            const opts = isBasic ? SOMA_OPTIONS.basic : SOMA_OPTIONS.aerial;
            somaEl.innerHTML = opts.map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
            somaEl.value = (showSoma && opts.some(([v]) => v === want)) ? want : '';
        }
        const soma = somaEl?.value || '';
        // '2回宙（1.5以下）' / '2回宙（1.6以上）' を somersaultType + doubleSomaGroup にマップ
        let somaType = soma, somaGroup = '';
        if (soma === '2回宙（1.5以下）') { somaType = '2回宙'; somaGroup = 'low'; }
        else if (soma === '2回宙（1.6以上）') { somaType = '2回宙'; somaGroup = 'high'; }
        sel.innerHTML = '<option value="">選択</option>';
        if (dir) {
            skillMaster.filter(s => {

            }).sort((a, b) => a.displayOrder - b.displayOrder).forEach(s => {

    window.calcTotal = () => {
        const subId = `${eventId}_${athleteId}_${round}`, sub = submissions[subId];
        const validCountEl = document.getElementById('valid-count'), totalDDContainer = document.getElementById('total-dd');
        if (!validCountEl) return;

        const validLimit = parseInt(validCountEl.value);
        let baseDD = 0, tripleCount = 0, hasAnyDiff = false;
        const seenIds = new Set(), idCounts = {};

        for(let i=1; i<=validLimit; i++) {
            const id = document.getElementById(`skill-${i}`)?.value;
            if(id) idCounts[id] = (idCounts[id] || 0) + 1;
        }

            const id = document.getElementById(`skill-${i}`)?.value, row = document.getElementById(`row-${i}`), ddSpan = document.getElementById(`dd-${i}`), selSkill = document.getElementById(`skill-${i}`), selDir = document.getElementById(`dir-${i}`);
            const subSkill = resolveSubSkill((sub?.skills || [])[i-1]);

            // 指定難度の星マーク（中断以降も含めて全行対象）
            const isDesigIdx = designatedDDCount > 0 && designatedDDIndices.includes(i - 1);
            const numCell = row?.querySelector('td.col-num');
            if (numCell) numCell.classList.toggle('designated', isDesigIdx);
            if (ddSpan) ddSpan.classList.remove('dd-capped'); // 前回描画の上限色をリセット

        // 構成あたり難度上限: 合計（Base＋ボーナス）が上限を超えたら上限で頭打ち
        let totalDD = baseDD + bonus;

        totalDDContainer.innerHTML = `${totalDD.toFixed(1)} <span style="font-size:0.4em; color:#999; font-weight:normal;">(Base ${baseDD.toFixed(1)} + Bonus ${bonus.toFixed(1)})</span>${capNote}`;
    };

    // 申請種目（選手申告）をD入力欄に取り込む（CJPがDなしで確定した等で空欄化した場合の救済用）
    window.loadDeclaredSkills = function() {
        const subId = `${eventId}_${athleteId}_${round}`;
        const declared = submissions[subId]?.skills || [];
        if (cjpConfirmed) { alert('CJPが確定済みのため取得できません。\n先にCJP側で確定を解除してください。'); return; }
        if (!declared.length) { alert('この選手の申請種目データがありません。'); return; }

        if (hasExisting && !confirm('現在のD入力を、選手の申請種目で上書きします。よろしいですか？')) return;
        // ソフトロック中（「修正する」ボタン状態）なら編集を有効化してから取り込む
        if (document.getElementById('skill-1')?.disabled) enableEditing();

            const dirEl = document.getElementById(`dir-${i}`);

                updateOptions(i, m.id, false);
            } else {
                dirEl.value = '';
                if (somaEl) somaEl.value = '';
                updateOptions(i, '', false);
            }
        }
        calcTotal();
    };

    window.enableEditing = () => {
        if (cjpConfirmed) return; // CJP確定済のため修正不可
        document.querySelectorAll('select').forEach(s => s.disabled = false);
        document.getElementById('action-area').innerHTML = `<button id="btn-save" class="btn btn-submit" onclick="saveOfficialScore()">修正を保存</button>`;
        // 修正開始 → D確定を解除（CJP画面を「未確定」表示に戻す）。再度「修正を保存」で確定される。
        if (athleteId && round) {
            setDoc(doc(db, "results", `${eventId}_${athleteId}_${round}`), { dConfirmedAt: deleteField() }, { merge: true })
                .catch(e => console.error('D確定解除に失敗:', e));
        }
    };

    window.saveOfficialScore = async () => {
        const btn = document.getElementById('btn-save'); if (!btn) return;
        const validCount = parseInt(document.getElementById('valid-count').value);
        const skills = [];
        for (let i = 1; i <= 10; i++) {
            const val = document.getElementById(`skill-${i}`).value;
            if (i <= validCount && !val) {
                alert(`${i}本目の技が未選択です。すべての技を選択してから保存してください。`);
                return;
            }
            skills.push(val);
        }
        btn.disabled = true;
        try {
            const totalVal = parseFloat(document.getElementById('total-dd').innerText.split(' ')[0]);
            const resId = `${eventId}_${athleteId}_${round}`;
            await setDoc(doc(db, "results", resId), { eventId, athleteId, round, officialSkills: skills, validCount, officialTotalDD: totalVal, dConfirmedAt: serverTimestamp(), revisionCount: increment(1) }, { merge: true });
            // 全データ再取得(init)は重い（大会全体の submissions/results と技マスタ全件を毎回フェッチ）。
            // 確定で変わるのは自分が書いた1件だけなので、ローカルの results を更新して
            // 左リストと採点エリアのみ再描画する（再フェッチなし）。
            results[resId] = { ...(results[resId] || {}), eventId, athleteId, round, officialSkills: skills, validCount, officialTotalDD: totalVal, dConfirmedAt: new Date() };
            _pendingSidebarScroll = document.getElementById('sidebar-list')?.scrollTop ?? null; // 再描画後も左リストの位置を維持
            renderSidebar();
            renderScoringArea();
        } catch (e) { console.error(e); btn.disabled = false; }
    };
    window.addEventListener('pageshow', e => {
        if (e.persisted) { _initRunning = false; init(); }
    });
    init();
</script>
</body>
</html>
