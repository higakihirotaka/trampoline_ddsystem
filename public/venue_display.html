<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trampoline Competition Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg-dark: #000c1a;
      --bg-panel: rgba(255,255,255,0.08);
      --accent-gold: #ffd700;
      --accent-cyan: #00f2ff;
      --text-white: #ffffff;
      --text-muted: #cbd5e0;
      --border-ui: rgba(0,242,255,0.2);
      --alert-red: #ff3d3d;
      --font-ui: "DIN 2014","DIN 2014 Demi","DIN 2014 Bold",
                 "DIN Alternate","DIN Condensed",
                 "Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",
                 system-ui,-apple-system,"Segoe UI",sans-serif;
      --left-col: 8cqw;
      --col-gap: 0.6cqw;
      --frame-pad-x: 3cqw;
    }
    @font-face { font-family:"DIN 2014"; src:url("./fonts/DIN2014-Regular.woff2") format("woff2"); font-weight:400; font-style:normal; font-display:swap; }
    @font-face { font-family:"DIN 2014"; src:url("./fonts/DIN2014-SemiBold.woff2") format("woff2"); font-weight:600; font-style:normal; font-display:swap; }
    @font-face { font-family:"DIN 2014"; src:url("./fonts/DIN2014-Bold.woff2") format("woff2"); font-weight:700; font-style:normal; font-display:swap; }
    @font-face { font-family:"DIN 2014"; src:url("./fonts/DIN2014-ExtraBold.woff2") format("woff2"); font-weight:800; font-style:normal; font-display:swap; }
    @font-face { font-family:"DIN 2014"; src:url("./fonts/DIN2014-Black.woff2") format("woff2"); font-weight:900; font-style:normal; font-display:swap; }
    html, body{
      margin:0; padding:0; height:100%; width:100%;
      background:#000; color:var(--text-white);
      font-family:var(--font-ui);
      overflow:hidden;
      display:flex; align-items:center; justify-content:center;
    }
    *{ box-sizing:border-box; }
    .num{
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1, "lnum" 1;
    }
    .monitor-frame{
      aspect-ratio: 16 / 9;
      width:100%;
      height:auto;
      max-width:100%;
      max-height:100%;
      background: radial-gradient(circle at 50% 0%, #001e3d 0%, #000810 100%);
      display:grid;
      grid-template-rows: 6.5% 17.5% 40% 10% 22% 4%;
      padding: 0 var(--frame-pad-x);
      border: 1px solid rgba(0,242,255,0.1);
      container-type: inline-size;
    }
    @supports not (width: 1cqw){
      :root{ --left-col: 8vw; --col-gap: 0.6vw; --frame-pad-x: 3vw; }
    }
    /* ===== アニメーション ===== */
    @keyframes enter {
      from { opacity: 0; transform: translateY(1.2cqh); filter: blur(2px); }
      to   { opacity: 1; transform: translateY(0);      filter: blur(0); }
    }
    .convention-header,.athlete-section,.ribbon-wrapper,.breakdown-row,.result-section,.footer-credits{
      opacity:0; animation: enter var(--anim-duration, 2600ms) ease-out forwards;
    }
    .convention-header{ animation-delay: 0ms; }
    .athlete-section  { animation-delay: calc(var(--anim-stagger, 1400ms) * 1); }
    .ribbon-wrapper   { animation-delay: calc(var(--anim-stagger, 1400ms) * 2); }
    .breakdown-row    { animation-delay: calc(var(--anim-stagger, 1400ms) * 3); }
    .result-section   { animation-delay: calc(var(--anim-stagger, 1400ms) * 4); }
    .footer-credits   { animation-delay: calc(var(--anim-stagger, 1400ms) * 5); }
    /* スコア更新時はアニメなし */
    .monitor-frame.no-anim .convention-header,
    .monitor-frame.no-anim .athlete-section,
    .monitor-frame.no-anim .ribbon-wrapper,
    .monitor-frame.no-anim .breakdown-row,
    .monitor-frame.no-anim .result-section,
    .monitor-frame.no-anim .footer-credits{
      animation: none !important;
      opacity: 1 !important;
    }
    @media (prefers-reduced-motion: reduce){
      *{ animation:none !important; transition:none !important; }
      .convention-header,.athlete-section,.ribbon-wrapper,.breakdown-row,.result-section,.footer-credits{ opacity:1 !important; }
    }
    /* ===== 1. 大会名 ===== */
    .convention-header{
      border-bottom: 1.5px solid var(--border-ui);
      display:flex; align-items:center; justify-content:center;
      font-size: 1.1cqw; font-weight:700;
      letter-spacing: 0.8cqw;
      text-transform: uppercase;
      white-space: nowrap; overflow:hidden; text-overflow: ellipsis;
    }
    /* ===== 2. 選手情報 ===== */
    .athlete-section{
      display:grid;
      grid-template-columns: var(--left-col) repeat(11, 1fr);
      column-gap: var(--col-gap);
      grid-template-rows: auto 1fr;
      align-items:end;
      padding-bottom: 2cqh;
      min-height:0;
    }
    .class-no{
      grid-column: 1 / 7; grid-row: 1;
      font-size: 1.8cqw; font-weight:800;
      color: var(--accent-gold);
      line-height: 1.1;
      white-space: nowrap;
      align-self:end;
      padding-bottom: 0.5cqh;
    }
    .session-info{
      grid-column: 8 / -1; grid-row: 1;
      text-align:right;
      color: var(--text-muted);
      font-size: 1cqw; font-weight:700;
      line-height: 1.3;
      white-space: nowrap;
      align-self:end;
      padding-bottom: 0.5cqh;
    }
    .athlete-identity-group{
      grid-column: 1 / -1; grid-row: 2;
      display:flex; flex-direction:column;
      align-items:center; justify-content:flex-end;
      pointer-events:none;
      min-height:0;
      padding-bottom: 0.6cqh;
    }
    .athlete-name{
      font-size: 5.5cqw; font-weight:900;
      line-height: 0.9;
      letter-spacing: -2px;
      margin:0;
      white-space: nowrap;
      text-shadow: 0 0 30px rgba(0,242,255,0.2);
    }
    .athlete-team{
      font-size: 2.2cqw; font-weight:900;
      color: var(--text-white);
      margin-top: 1.35cqh;
      text-transform: uppercase;
      opacity: 0.95;
      letter-spacing: 0.15cqw;
      text-shadow: 0 0 22px rgba(0,242,255,0.15);
      line-height: 1.05;
    }
    /* ===== 3. リボン ===== */
    .ribbon-wrapper{
      display:grid;
      grid-template-columns: var(--left-col) repeat(11, 1fr);
      column-gap: var(--col-gap);
      align-items: stretch;
      padding-bottom: 1cqh;
      min-height:0;
    }
    .row-labels{
      display:grid;
      grid-template-rows: 12fr 50fr 19fr 19fr;
      row-gap:0;
      text-align:right;
      color: var(--text-muted);
      font-weight:900;
      font-size: 1.05cqw;
      min-height:0;
    }
    .row-title{
      display:flex; align-items:center; justify-content:flex-end;
      text-transform: uppercase;
      white-space: nowrap;
      letter-spacing: 0.06cqw;
    }
    .row-title.idx-label{ opacity:0.95; font-size: 0.95cqw; color:var(--text-white); }
    .row-title.e-label{ color:var(--text-white); }
    .row-title.d-sub-label{ font-size: 0.95cqw; opacity:0.9; }
    .skill-stack{
      display:grid;
      grid-template-rows: 12fr 50fr 19fr 19fr;
      row-gap:0;
      min-height:0;
    }
    .col-idx{
      grid-row:1;
      display:flex; align-items:center; justify-content:center;
      font-size: 0.9cqw; font-weight:900;
      color: var(--text-white);
      letter-spacing: 1px;
      min-width:0;
    }
    .card{
      background: var(--bg-panel);
      border: 1.5px solid var(--border-ui);
      border-radius: 4px;
      overflow:hidden;
      min-width:0; min-height:0;
      box-shadow: inset 0 0 15px rgba(0,242,255,0.03);
    }
    .card.e-card{
      grid-row:2;
      border-color: rgba(255,255,255,0.15);
      display:flex; align-items:stretch; justify-content:stretch;
    }
    .e-val{
      flex:1;
      display:flex; align-items:center; justify-content:center;
      font-size: 4.8cqw; font-weight:900;
      line-height:1;
    }
    .card.d-card{
      grid-row: 3 / 5;
      background: rgba(0,0,0,0.3);
      border-color: var(--border-ui);
      display:grid;
      grid-template-rows: 1fr 1fr;
      min-height:0;
    }
    .d-code{
      display:flex; align-items:center; justify-content:center;
      font-size: 1.8cqw; font-weight:900;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-ui);
      letter-spacing: -0.5px;
      background: rgba(255,255,255,0.02);
      white-space: nowrap; overflow:hidden; text-overflow: ellipsis;
      padding: 0 6px;
      line-height:1;
    }
    .d-val{
      display:flex; align-items:center; justify-content:center;
      font-size: 2cqw; font-weight:900;
      line-height:1;
    }
    /* ===== LAN列 ===== */
    .skill-stack.bonus-style .col-idx{
      font-size: 0.95cqw;
      font-weight: 900;
      color: var(--text-white);
      text-transform: uppercase;
      letter-spacing: 0.2cqw;
    }
    .skill-stack.bonus-style .bonus-note-block{
      grid-row: 3;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-end;
      gap: 0.12cqh;
      padding-bottom: 0.35cqh;
      min-height:0;
      pointer-events:none;
      white-space: nowrap;
    }
    .skill-stack.bonus-style .bonus-note-block span{
      font-size: 0.82cqw;
      font-weight: 900;
      letter-spacing: 0.12cqw;
      text-transform: uppercase;
      line-height: 1;
      color: var(--accent-cyan);
      opacity: 0.95;
    }
    .skill-stack.bonus-style .bonus-dval{
      grid-row: 4;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:0;
    }
    .skill-stack.bonus-style .bonus-val{
      font-size: 2cqw;
      font-weight: 900;
      line-height: 1;
      color: var(--text-white);
    }
    /* ===== 4. 内訳 ===== */
    .breakdown-row{
      display:grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 2cqw;
      border-top: 2.5px solid var(--border-ui);
      border-bottom: 2.5px solid var(--border-ui);
      align-items:center;
      background: rgba(0,242,255,0.02);
      min-height:0;
    }
    .stat-item{ display:flex; align-items:center; gap: 1.2cqw; height:100%; }
    .stat-item label{
      font-size: 1cqw; font-weight:800;
      color: var(--text-muted);
      text-transform: uppercase;
      white-space: nowrap;
    }
    .stat-item .val{
      font-size: 3.8cqw; font-weight:900;
      letter-spacing: -1.5px;
      line-height:1;
    }
    /* ===== 5. 結果 ===== */
    .result-section{
      display:grid;
      grid-template-columns: 50% 50%;
      align-items:center;
      min-height:0;
    }
    .routine-totals{
      display:flex;
      gap: 3cqw;
      align-items:flex-end;
      min-height:0;
    }
    .routine-box{ display:flex; flex-direction:column; align-items:flex-start; }
    .routine-box label{
      font-size: 1cqw;
      color: var(--text-muted);
      font-weight:800;
      margin-bottom: 0.25cqh;
    }
    .routine-box .val{
      font-size: 5.6cqw;
      font-weight:800;
      color: rgba(255,255,255,0.10);
      line-height:1;
      letter-spacing: -1.5px;
    }
    .routine-box.active label{ color: var(--accent-gold); }
    .routine-box.active .val{
      color: rgba(255,255,255,0.85);
      border-bottom: 6px solid rgba(255,215,0,0.85);
      padding-bottom: 3px;
      text-shadow: 0 0 14px rgba(255,215,0,0.18);
    }
    .final-results{
      display:flex;
      justify-content:flex-end;
      align-items:flex-end;
      gap: 4cqw;
      padding-bottom: 1.5cqh;
      min-height:0;
    }
    .score-unit{ display:flex; align-items:flex-end; gap: 1cqw; }
    .score-unit label{
      font-size: 1.2cqw;
      color: var(--accent-gold);
      font-weight:900;
      margin-bottom: 1.2cqw;
      white-space: nowrap;
    }
    .total-val{ font-size: 8.5cqw; font-weight:900; line-height:1; letter-spacing:-2px; }
    .rank-val{ font-size: 10.5cqw; font-weight:900; color: var(--accent-gold); line-height:1; }
    /* ===== 6. クレジット ===== */
    .footer-credits{
      display:flex;
      justify-content:flex-end;
      align-items:center;
      font-size: 0.8cqw;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.2cqw;
      font-weight:700;
      text-transform: uppercase;
      min-height:0;
    }
    .alert{ color: var(--alert-red) !important; }
    .repeat{ color: var(--alert-red) !important; font-weight:900; }
    /* ===== 待機状態 ===== */
    .waiting-msg{
      grid-column: 1 / -1; grid-row: 1 / -1;
      display:flex; align-items:center; justify-content:center;
      font-size: 1.5cqw; font-weight:700;
      letter-spacing: 0.4cqw;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    /* ===== 順位表オーバーレイ ===== */
    .monitor-frame{ position: relative; }
    #ranking-overlay{
      position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 0%, #001e3d 0%, #000810 100%);
      display: flex; flex-direction: column;
      padding: 1.4cqw 3cqw 0.8cqw;
      opacity: 0; transform: translateY(0.6cqw);
      transition: opacity 700ms ease-out, transform 700ms ease-out;
      pointer-events: none; z-index: 10;
      overflow: hidden;
    }
    #ranking-overlay.visible{
      opacity: 1; transform: translateY(0); pointer-events: auto;
    }
    .rk-title{
      font-size: 1.3cqw; font-weight: 800; line-height: 1.0;
      letter-spacing: 0.45cqw; color: var(--accent-gold);
      text-transform: uppercase;
      border-bottom: 1.5px solid var(--border-ui);
      padding-bottom: 0.3cqw; margin-bottom: 0.25cqw;
      white-space: nowrap; flex-shrink: 0;
    }
    .rk-col-head{
      display: grid;
      grid-template-columns: 4cqw 1fr 12cqw 12cqw 16cqw;
      gap: 0.8cqw; padding: 0 0.8cqw 0.25cqw;
      font-size: 0.85cqw; font-weight: 800; line-height: 1.0;
      color: var(--text-muted); text-transform: uppercase;
      letter-spacing: 0.1cqw; flex-shrink: 0;
    }
    .rk-col-head span:nth-child(n+3){ text-align: right; }
    .rk-table{
      display: flex; flex-direction: column;
      gap: 0.2cqw; flex: 1; overflow: hidden;
    }
    .rk-row{
      flex: 1; display: grid;
      grid-template-columns: 4cqw 1fr 12cqw 12cqw 16cqw;
      gap: 0.8cqw; align-items: center; padding: 0 0.8cqw;
      border-radius: 4px; border: 1px solid transparent;
      background: rgba(255,255,255,0.035); min-height: 0;
      overflow: hidden;
    }
    .rk-row.rk-current{
      background: rgba(255,215,0,0.09);
      border-color: rgba(255,215,0,0.35);
    }
    .rk-rank{ font-size: 1.9cqw; font-weight: 900; line-height: 1.0; color: var(--text-muted); }
    .rk-name-group{
      display: flex; flex-direction: row; align-items: baseline;
      gap: 0.7cqw; overflow: hidden; min-width: 0;
    }
    .rk-name{
      font-size: 2.15cqw; font-weight: 800; line-height: 1.0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      flex-shrink: 0;
    }
    .rk-team{
      font-size: 1.1cqw; font-weight: 600; line-height: 1.0;
      color: var(--text-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      flex: 1; min-width: 0;
    }
    .rk-current .rk-name{ color: var(--accent-gold); }
    .rk-current .rk-team{ color: rgba(255,215,0,0.65); }
    .rk-sc{ font-size: 1.9cqw; font-weight: 700; line-height: 1.0; text-align: right; color: var(--text-muted); }
    .rk-tot{ font-size: 2.8cqw; font-weight: 900; line-height: 1.0; text-align: right; }
    .rk-current .rk-tot{ color: var(--accent-gold); }
    .rk-page-info{
      float: right;
      font-size: 0.9cqw;
      color: var(--text-muted);
      letter-spacing: 0.1cqw;
    }
    .rk-event-name{
      position: absolute; top: 1.2cqw; right: 3cqw;
      font-size: 1.1cqw; font-weight: 800; letter-spacing: 0.15cqw;
      color: var(--text-white); text-align: right;
      white-space: nowrap; pointer-events: none;
      text-shadow: 0 0 20px rgba(255,255,255,0.1);
    }
    .rk-footer{
      font-size: 0.75cqw; font-weight: 700; letter-spacing: 0.2em;
      color: rgba(255,255,255,0.28); text-transform: uppercase;
      text-align: center; flex-shrink: 0;
      padding-top: 0.6cqw; padding-bottom: 0.2cqw;
      border-top: 1px solid rgba(255,255,255,0.08);
      margin-top: 0.4cqw;
    }
  /* ===== 会場画面オーバーレイ（タイトル / 表彰式 / 会場練習） ===== */
  .venue-screen{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    background: radial-gradient(circle at 50% 0%, #001e3d 0%, #000810 100%);
    z-index:100;
    opacity:0; pointer-events:none;
    transition: opacity 0.8s ease;
    font-family:var(--font-ui);
    color:white; text-align:center;
    padding:4vw;
  }
  .venue-screen.active{ opacity:1; pointer-events:auto; }
  /* ===== 集計中画面 ===== */
  #vs-calculating{ container-type:size; padding:0; align-items:stretch; justify-content:flex-start; }
  .calc-layout{
    width:100%; height:100%;
    display:flex; flex-direction:column;
    padding: 0 6cqw;
    box-sizing:border-box;
  }
  /* 大会名ヘッダー */
  .calc-conv{
    flex-shrink:0;
    font-size:1.1cqw; font-weight:700; letter-spacing:0.7cqw;
    color:rgba(255,200,70,0.85); text-transform:uppercase; text-align:center;
    border-bottom:1.5px solid rgba(255,255,255,0.1);
    padding: 2.8cqh 0 2.2cqh;
  }
  /* クラス・ラウンド行 */
  .calc-meta{
    flex-shrink:0;
    display:flex; justify-content:space-between; align-items:baseline;
    padding-top:3cqh;
  }
  .calc-class{
    font-size:1.8cqw; font-weight:800; color:rgba(255,200,70,0.9);
  }
  .calc-round{
    font-size:1.1cqw; font-weight:600; letter-spacing:0.15em;
    color:rgba(255,255,255,0.42); text-transform:uppercase;
  }
  /* 選手名ブロック（画面の縦中央付近に配置） */
  .calc-name-block{
    flex:1; display:flex; flex-direction:column;
    justify-content:center; align-items:flex-start;
  }
  .calc-name{
    font-size:5.5cqw; font-weight:900; line-height:0.9;
    letter-spacing:-2px; color:#ffffff;
    white-space:nowrap;
  }
  .calc-team{
    font-size:2.2cqw; font-weight:700;
    color:rgba(255,255,255,0.65);
    margin-top:1.8cqh; letter-spacing:0.1cqw;
    white-space:nowrap;
  }
  /* 得点集計中 */
  .calc-status{
    flex-shrink:0;
    font-size:4.5cqw; font-weight:900; letter-spacing:0.45em;
    color:rgba(255,255,255,0.42);
    padding-bottom:5cqh;
    animation:calcPulse 1.8s ease-in-out infinite;
  }
  /* クレジット */
  .calc-credit{
    flex-shrink:0;
    font-size:0.68cqw; font-weight:700; letter-spacing:0.25em;
    color:rgba(255,255,255,0.25); text-align:center;
    padding-bottom:2cqh;
  }
  @keyframes calcPulse{
    0%,100%{ opacity:1; } 50%{ opacity:0.3; }
  }
  .vs-label{
    font-size:1.0vw; font-weight:700; letter-spacing:0.4em;
    color:var(--text-muted); text-transform:uppercase;
    margin-bottom:1.2rem;
  }
  .vs-title-name{
    font-size:var(--vs-title-fs,6.5vw); font-weight:900; line-height:1.05;
    letter-spacing:0.03em;
    color:var(--accent-cyan);
    text-shadow:0 0 80px rgba(0,242,255,0.35);
  }
  .vs-cer-name{
    font-size:var(--vs-cer-name-fs,3.5vw); font-weight:800; line-height:1.2;
    color:var(--text-muted);
    letter-spacing:0.05em;
    margin-bottom:1.5rem;
  }
  .vs-ceremony-label{
    font-size:var(--vs-cer-label-fs,10vw); font-weight:900; letter-spacing:0.15em;
    color:var(--accent-gold);
    text-shadow:0 0 80px rgba(255,215,0,0.35);
  }
  .vs-class-names{
    font-size:var(--vs-class-fs,4.5vw); font-weight:900;
    color:var(--accent-cyan);
    letter-spacing:0.05em;
    margin-bottom:1.5rem;
    text-shadow:0 0 50px rgba(0,242,255,0.3);
    white-space:pre-line;
  }
  .vs-timer{
    font-size:var(--vs-timer-fs,16vw); font-weight:900; line-height:0.95;
    letter-spacing:-0.02em;
    color:var(--text-white);
    text-shadow:0 0 100px rgba(255,255,255,0.1);
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1;
    transition: color 0.5s, text-shadow 0.5s;
  }
  .vs-timer.warning{ color:#ff6b35; text-shadow:0 0 100px rgba(255,107,53,0.4); }
  .vs-timer.done   { color:var(--accent-gold); text-shadow:0 0 100px rgba(255,215,0,0.4); animation:pulse 1s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:0.6} }
  .vs-footer{
    position:absolute; bottom:1.2vw; left:0; width:100%; text-align:center;
    font-size:0.6vw; font-weight:700; letter-spacing:0.22em;
    color:rgba(255,255,255,0.22); text-transform:uppercase; pointer-events:none;
  }
  </style>
</head>
<body>
  <div class="monitor-frame no-anim" id="monitor">
    <div class="convention-header" id="event-name-el" style="opacity:1;">---</div>
    <div class="athlete-section" style="opacity:1;">
      <div class="waiting-msg">WAITING FOR JUDGE CONFIRMATION</div>
    </div>
    <div class="ribbon-wrapper" style="opacity:1;"></div>
    <div class="breakdown-row" style="opacity:1;"></div>
    <div class="result-section" style="opacity:1;"></div>
    <footer class="footer-credits" style="opacity:1;">SYSTEM DESIGN &amp; DEVELOPMENT BY HIROTAKA.H</footer>
  </div>

  <!-- 大会タイトル画面 -->
  <div id="vs-title" class="venue-screen">
    <div class="vs-label">COMPETITION</div>
    <div class="vs-title-name" id="vs-title-name">---</div>
    <footer class="vs-footer">SYSTEM DESIGN &amp; DEVELOPMENT BY HIROTAKA.H</footer>
  </div>

  <!-- 表彰式画面 -->
  <div id="vs-ceremony" class="venue-screen">
    <div class="vs-cer-name" id="vs-cer-name">---</div>
    <div class="vs-ceremony-label">表彰式</div>
    <footer class="vs-footer">SYSTEM DESIGN &amp; DEVELOPMENT BY HIROTAKA.H</footer>
  </div>

  <!-- 集計中画面（内容はJS動的生成） -->
  <div id="vs-calculating" class="venue-screen"></div>

  <!-- 会場練習画面 -->
  <div id="vs-warmup" class="venue-screen">
    <div class="vs-class-names" id="vs-class-names">---</div>
    <div class="vs-timer num done" id="vs-timer">--:--</div>
    <footer class="vs-footer">SYSTEM DESIGN &amp; DEVELOPMENT BY HIROTAKA.H</footer>
  </div>

<script type="module">
  import { db } from "./firebase-config.js";
  import { doc, getDoc, getDocs, collection, query, where, onSnapshot, orderBy, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { normalizeClassRules, calcBonus } from "./shared.js";

  const params    = new URLSearchParams(location.search);
  const eventId   = params.get('event')?.trim();
  let skillMaster = [], athleteMap = {}, tournamentName = '---';
  let lastResultId = null;
  let tournamentData = null;  // numExecJudges 等を保持

  // ---- ラベル ----
  function getRoundLabel(rid) {
    const labels = { pre1:'QUALIFYING ROUND 1', pre2:'QUALIFYING ROUND 2', final:'FINAL ROUND' };
    return labels[rid] || rid.toUpperCase();
  }

  // ---- 中間2名合計（個人用）: CJP の middle2 と同じ計算式 ----
  function mid2sum(vals) {
    const filled = vals.filter(v => v !== null && v !== undefined);
    if (filled.length < 2) return 0;
    filled.sort((a, b) => a - b);
    const mid = Math.floor((filled.length - 2) / 2);
    return filled[mid] + filled[mid + 1];
  }

  // ---- 中央値1名（3人から真ん中） ----
  function median1(vals) {
    const filled = vals.filter(v => v !== null && v !== undefined);
    if (filled.length === 0) return null;
    filled.sort((a, b) => a - b);
    if (filled.length === 1) return filled[0];
    if (filled.length === 2) return (filled[0] + filled[1]) / 2;
    return filled[Math.floor(filled.length / 2)];
  }

  // ---- シンクロ用E減点（審判数に応じた平均） ----
  function synchroEAvg(vals, numE) {
    const filled = vals.filter(v => v !== null && v !== undefined);
    if (filled.length === 0) return 0;
    if (numE <= 4) {
      return filled.reduce((a, b) => a + b, 0) / filled.length;
    }
    // 6人: E1,3,5の中間値 + E2,4,6の中間値 → 平均
    const oddVals  = [vals[0], vals[2], vals[4]];
    const evenVals = [vals[1], vals[3], vals[5]];
    const medOdd  = median1(oddVals);
    const medEven = median1(evenVals);
    if (medOdd === null && medEven === null) return 0;
    if (medOdd === null) return medEven;
    if (medEven === null) return medOdd;
    return (medOdd + medEven) / 2;
  }

  // ---- パネル別審判データ取得 ----
  function getPanelJudges(resData) {
    const allJudges = resData.execution?.judges || {};
    if (Object.keys(allJudges).length === 0) return null;
    const byPanel = {};
    Object.entries(allJudges).forEach(([k, v]) => {
      const p    = k.split('_')[0];
      const jKey = k.slice(p.length + 1);
      if (!byPanel[p]) byPanel[p] = {};
      byPanel[p][jKey] = v;
    });
    return Object.values(byPanel).reduce(
      (best, cur) => Object.keys(cur).length > Object.keys(best).length ? cur : best, {}
    );
  }

  // ---- 選手がシンクロかどうか ----
  function isSynchroAthlete(athleteId) {
    return (athleteMap[athleteId]?.type || 'individual') === 'synchro';
  }

  // ---- 技ごとのE減点（データなし→null、表示は×10の整数） ----
  function getSkillEDed(panelJudges, si, synchro) {
    if (!panelJudges) return null;
    const jKeys = Object.keys(panelJudges);
    if (jKeys.length < 2) return null;
    const vals   = jKeys.map(k => panelJudges[k]?.deductions?.[si] ?? null);
    const filled = vals.filter(v => v !== null);
    if (filled.length === 0) return null;
    const numE = tournamentData?.numExecJudges || jKeys.length;
    return synchro ? synchroEAvg(vals, numE) : mid2sum(vals);
  }

  // ---- 着地E減点 ----
  function getLandingDed(panelJudges, synchro) {
    if (!panelJudges) return null;
    const jKeys = Object.keys(panelJudges);
    if (jKeys.length < 2) return null;
    const vals   = jKeys.map(k => panelJudges[k]?.landing ?? null);
    const filled = vals.filter(v => v !== null);
    if (filled.length === 0) return null;
    const numE = tournamentData?.numExecJudges || jKeys.length;
    return synchro ? synchroEAvg(vals, numE) : mid2sum(vals);
  }

  // ---- E合計スコア ----
  function calcMedE(resData) {
    if (resData.officialE !== undefined && resData.officialE !== null) return resData.officialE;
    const panelJudges = getPanelJudges(resData);
    if (!panelJudges) return null;
    const jKeys  = Object.keys(panelJudges);
    if (jKeys.length < 2) return null;
    const vLimit = resData.validCount ?? 10;
    const synchro = isSynchroAthlete(resData.athleteId);
    const numE = tournamentData?.numExecJudges || jKeys.length;
    let totalDed = 0;
    for (let si = 0; si < vLimit; si++) {
      const vals = jKeys.map(k => panelJudges[k]?.deductions?.[si] ?? null);
      totalDed += synchro ? synchroEAvg(vals, numE) : mid2sum(vals);
    }
    if (vLimit === 10) {
      const lVals = jKeys.map(k => panelJudges[k]?.landing ?? null);
      totalDed += synchro ? synchroEAvg(lVals, numE) : mid2sum(lVals);
    }
    const basePerSkill = synchro ? 1.0 : 2.0;
    return vLimit * basePerSkill - totalDed;
  }

  // ---- 選手の他ラウンド結果取得 ----
  async function getAthleteResults(athleteId) {
    if (!eventId || !athleteId) return {};
    try {
      const q    = query(collection(db, "results"), where("eventId", "==", eventId), where("athleteId", "==", athleteId));
      const snap = await getDocs(q);
      const res  = {};
      snap.docs.forEach(d => {
        const data = d.data();
        if (data.officialTotal !== undefined) res[data.round] = data.officialTotal;
      });
      return res;
    } catch { return {}; }
  }

  // ---- 順位計算（タイブレーク対応） ----
  // タイブレーク: 個人=T→H→D, シンクロ=S(=tof)→H→D
  function getTbScores(data) {
    return {
      tof:  data.tof ?? null,
      hd:   data.hd?.total ?? null,
      diff: data.officialD ?? data.dd ?? null
    };
  }

  function tbCompare(myTb, otherTb) {
    // 各タイブレーク項目で相手が上位かどうか判定
    // 返り値: true = 相手が上位（rankを+1すべき）
    const keys = ['tof', 'hd', 'diff'];
    for (const k of keys) {
      const mv = myTb[k], ov = otherTb[k];
      if (mv != null && ov != null && Math.abs(mv - ov) > 1e-9) {
        return ov > mv;  // 相手が高い → 上位
      }
    }
    return false;  // ブレイクできない → 同順位（rank加算しない）
  }

  async function calcRank(ath, round, qualTotal) {
    if (qualTotal === null || qualTotal === undefined) return null;
    const classVal  = ath.class  || '';
    const genderVal = ath.gender || '';
    const typeVal   = ath.type   || 'individual';
    const rule      = getClassRule(ath);
    const numPre    = rule.qualifyingRoutines ?? 1;
    const scoreMode = rule.scoreMode || 'best';
    const sameGroup = a => a?.class === classVal && a?.gender === genderVal && (a?.type || 'individual') === typeVal;
    try {
      let rank = 1;
      if (round === 'final') {
        // 決勝: 決勝スコア同士で比較
        const snap = await getDocs(query(collection(db,"results"), where("eventId","==",eventId), where("round","==","final"), where("published","==",true)));
        snap.docs.forEach(d => {
          const data = d.data(); const a = athleteMap[data.athleteId];
          if (sameGroup(a) && (data.officialTotal ?? 0) > qualTotal + 1e-9) rank++;
        });
      } else if (numPre <= 1) {
        // 予選1ラウンドのみ: pre1スコアで比較
        const snap = await getDocs(query(collection(db,"results"), where("eventId","==",eventId), where("round","==","pre1"), where("published","==",true)));
        snap.docs.forEach(d => {
          const data = d.data(); const a = athleteMap[data.athleteId];
          if (sameGroup(a) && (data.officialTotal ?? 0) > qualTotal + 1e-9) rank++;
        });
      } else {
        // 予選2ラウンド: 両ラウンド取得し予選合計で比較
        const [pre1Snap, pre2Snap] = await Promise.all([
          getDocs(query(collection(db,"results"), where("eventId","==",eventId), where("round","==","pre1"), where("published","==",true))),
          getDocs(query(collection(db,"results"), where("eventId","==",eventId), where("round","==","pre2"), where("published","==",true)))
        ]);
        const sc = {};
        pre1Snap.docs.forEach(d => { const r=d.data(); sc[r.athleteId] = { pre1: r.officialTotal ?? null }; });
        pre2Snap.docs.forEach(d => { const r=d.data(); if (!sc[r.athleteId]) sc[r.athleteId]={}; sc[r.athleteId].pre2 = r.officialTotal ?? null; });
        Object.entries(sc).forEach(([aid, s]) => {
          const a = athleteMap[aid];
          if (!sameGroup(a)) return;
          let other = (s.pre1 != null && s.pre2 != null)
            ? (scoreMode === 'total' ? s.pre1 + s.pre2 : Math.max(s.pre1, s.pre2))
            : (s.pre1 ?? s.pre2);
          if (other != null && other > qualTotal + 1e-9) rank++;
        });
      }
      return rank;
    } catch { return null; }
  }

  // ---- メインレンダリング ----
  async function renderFocusResult(resultDoc) {
    const isNew   = resultDoc.id !== lastResultId;
    lastResultId  = resultDoc.id;
    const resData = resultDoc.data();
    const ath     = athleteMap[resData.athleteId] || {};

    // 順位表→スコア切替時: 旧スコアが一瞬見えるのを防ぐためモニターを隠す
    const monitor = document.getElementById('monitor');
    if (currentMode === 'ranking' || rankingPageTimer) {
      monitor.style.opacity = '0';
    }

    // 提出データ取得
    const subId   = `${eventId}_${resData.athleteId}_${resData.round}`;
    const subSnap = await getDoc(doc(db, "submissions", subId));
    const sub     = subSnap.exists() ? subSnap.data() : { skills: [] };

    const vLimit        = resData.validCount ?? 10;
    const officialSkills= resData.officialSkills || [];
    // officialE の有無に関わらず、技ごとの表示には審判ごとのデータを使う
    const panelJudges   = getPanelJudges(resData);
    const synchro       = isSynchroAthlete(resData.athleteId);

    // ---- 技ごとデータ計算 ----
    const seenIds = new Set();
    let baseDD = 0, tripleCount = 0, hasAnyDiff = false;

    const hasManualDDValues = !!(resData.officialDDValues && resData.officialDDValues.length > 0);

    const skillCols = [];
    for (let i = 0; i < 10; i++) {
      if (i >= vLimit) {
        skillCols.push(`
          <div class="skill-stack" style="opacity:0.25;">
            <div class="col-idx num">${String(i+1).padStart(2,'0')}</div>
            <div class="card e-card"><div class="e-val num" style="color:var(--text-muted);">--</div></div>
            <div class="card d-card">
              <div class="d-code">-</div>
              <div class="d-val num">-</div>
            </div>
          </div>`);
        continue;
      }

      const offId      = officialSkills[i];
      const skill      = skillMaster.find(m => m.id === String(offId));
      const subRaw     = sub.skills?.[i] || '';
      const subSkillRaw= (typeof subRaw === 'object' && subRaw !== null) ? subRaw.skill : subRaw;
      const subSkill   = isNaN(subSkillRaw)
                         ? skillMaster.find(m => m.symbol === subSkillRaw)
                         : skillMaster.find(m => m.id === String(subSkillRaw));

      const isDiff  = !!(skill && subSkill && skill.symbol !== subSkill.symbol);
      const isRepeat= !!(skill && seenIds.has(String(offId)));
      if (isDiff) hasAnyDiff = true;

      let displayDD = 0, dCodeTxt, dValTxt;
      if (hasManualDDValues) {
        // 手動入力: officialDDValues から各技の DD 値を復元
        displayDD = Number(resData.officialDDValues[i]) || 0;
        if (!isRepeat && offId) baseDD += displayDD;
        dCodeTxt = offId || '-';
        dValTxt  = displayDD.toFixed(1);
      } else {
        if (skill && !isRepeat) {
          displayDD = skill.dd;
          baseDD   += skill.dd;
          if (skill.isTriple) tripleCount++;
          seenIds.add(String(offId));
        }
        dCodeTxt = skill ? skill.symbol : '-';
        dValTxt  = skill ? (isRepeat ? '0.0' : displayDD.toFixed(1)) : '-';
      }

      const eDedVal  = getSkillEDed(panelJudges, i, synchro);
      const eDisplay = eDedVal !== null ? Math.round(eDedVal * 10) : '--';
      const hasAlert = isDiff || isRepeat;

      skillCols.push(`
        <div class="skill-stack">
          <div class="col-idx num">${String(i+1).padStart(2,'0')}</div>
          <div class="card e-card"><div class="e-val num">${eDisplay}</div></div>
          <div class="card d-card">
            <div class="d-code${hasAlert ? ' alert' : ''}">${dCodeTxt}</div>
            <div class="d-val num${hasAlert ? ' alert' : ''}">${dValTxt}</div>
          </div>
        </div>`);
    }

    // ---- ボーナス計算 ----
    const bonus   = hasManualDDValues ? (resData.officialDDBonus || 0) : calcBonus(ath.gender, tripleCount);
    const finalDD = hasManualDDValues ? (resData.officialTotalDD || baseDD + bonus) : baseDD + bonus;

    // LAN列
    const landDed = getLandingDed(panelJudges, synchro);
    const isLanValid = vLimit === 10;
    const bonusCol = `
      <div class="skill-stack bonus-style" style="${isLanValid ? '' : 'opacity:0.25;'}">
        <div class="col-idx">LAN</div>
        <div class="card e-card"><div class="e-val num">${isLanValid && landDed !== null ? Math.round(landDed * 10) : '--'}</div></div>
        <div class="bonus-note-block">
          <span>D-SCORE</span>
          <span>BONUS</span>
        </div>
        <div class="bonus-dval">
          <span class="bonus-val num">+${bonus.toFixed(1)}</span>
        </div>
      </div>`;

    // ---- スコア集計 ----
    const dScore = resData.officialD     !== undefined ? resData.officialD     : finalDD;
    const eScore = calcMedE(resData);
    const tScore = resData.tof           !== undefined ? resData.tof           : null;
    const hdScore= resData.hd?.total     !== undefined ? resData.hd?.total     : null;
    const pScore = resData.penalty       !== undefined ? resData.penalty       : 0;

    let totalScore = null;
    if (resData.officialTotal !== undefined) {
      totalScore = resData.officialTotal;
    } else if (eScore !== null && tScore !== null && hdScore !== null) {
      totalScore = Math.max(0, dScore + eScore + tScore + hdScore - pScore);
    }

    const isPublished = resData.published === true;
    const fmt1 = v => (v !== null && v !== undefined) ? Number(v).toFixed(1) : '--';
    const fmt2 = v => (v !== null && v !== undefined) ? Number(v).toFixed(2) : '--';
    const fmt3 = v => (v !== null && v !== undefined) ? Number(v).toFixed(3) : '--';

    // ---- 他ラウンド結果 & 順位 ----
    const athResults = await getAthleteResults(resData.athleteId);
    // 予選合計（2ラウンドの場合はbest/total）で順位計算
    let qualTotal = totalScore;
    const rule2   = getClassRule(ath);
    const numPre2 = rule2.qualifyingRoutines ?? 1;
    const sMode2  = rule2.scoreMode || 'best';
    if (numPre2 >= 2 && (resData.round === 'pre1' || resData.round === 'pre2')) {
      const p1 = resData.round === 'pre1' ? totalScore : (athResults['pre1'] ?? null);
      const p2 = resData.round === 'pre2' ? totalScore : (athResults['pre2'] ?? null);
      if (p1 != null && p2 != null) qualTotal = sMode2 === 'total' ? p1 + p2 : Math.max(p1, p2);
      else qualTotal = p1 ?? p2;
    }
    const rank = await calcRank(ath, resData.round, qualTotal);

    // ---- ルーティン合計 ----
    let routineTotalsHTML = '';
    if (resData.round === 'pre1' || resData.round === 'pre2') {
      const r1 = athResults['pre1'];
      const r2 = athResults['pre2'];
      routineTotalsHTML = `
        <div class="routine-box${resData.round === 'pre1' ? ' active' : ''}">
          <label>ROUTINE 1</label>
          <div class="val num">${r1 !== undefined ? Number(r1).toFixed(3) : '--'}</div>
        </div>
        <div class="routine-box${resData.round === 'pre2' ? ' active' : ''}">
          <label>ROUTINE 2</label>
          <div class="val num">${r2 !== undefined ? Number(r2).toFixed(3) : '--'}</div>
        </div>`;
    } else {
      routineTotalsHTML = `
        <div class="routine-box active">
          <label>FINAL</label>
          <div class="val num">${fmt3(totalScore)}</div>
        </div>`;
    }

    // ---- セッション情報 ----
    const dateStr    = new Date().toLocaleDateString('ja-JP').replace(/\//g, '.');
    const groupStr   = ath.flightGroup ? `PANEL ${ath.flightGroup}` : '';
    const sessionLine2 = [groupStr, dateStr].filter(Boolean).join(' | ');
    const classGender  = [ath.class, ath.gender].filter(Boolean).join(' ');

    // ---- フルHTML生成 ----
    const html = `
      <div class="convention-header">${tournamentName}</div>

      <div class="athlete-section">
        <div class="class-no">${classGender} / No.${ath.order || '?'}</div>
        <div class="session-info">
          ${getRoundLabel(resData.round)}<br>
          ${sessionLine2}
        </div>
        <div class="athlete-identity-group">
          ${ath.type === 'synchro' && ath.name2
            ? `<h1 class="athlete-name" style="font-size:5cqw">${ath.name1 || '---'} <span style="opacity:0.5;font-weight:400;letter-spacing:0">/</span> ${ath.name2}</h1>
               <div class="athlete-team">${ath.club1 || '---'}</div>`
            : `<h1 class="athlete-name">${ath.name1 || '---'}</h1>
               <div class="athlete-team">${ath.club1 || '---'}</div>`
          }
        </div>
      </div>

      <div class="ribbon-wrapper">
        <div class="row-labels">
          <div class="row-title idx-label">Skill No</div>
          <div class="row-title e-label">E-Deduction</div>
          <div class="row-title d-sub-label">Skill Code</div>
          <div class="row-title d-sub-label">D-Score</div>
        </div>
        ${skillCols.join('')}
        ${bonusCol}
      </div>

      <div class="breakdown-row">
        <div class="stat-item"><label>Exec.</label><div class="val num">${fmt1(eScore)}</div></div>
        <div class="stat-item"><label>Diff.</label><div class="val num${hasAnyDiff ? ' alert':''}">${fmt1(dScore)}</div></div>
        <div class="stat-item"><label>ToF</label><div class="val num">${fmt3(tScore)}</div></div>
        <div class="stat-item"><label>HD</label><div class="val num">${fmt2(hdScore)}</div></div>
        <div class="stat-item"><label>Penalty</label><div class="val num">${fmt1(pScore)}</div></div>
      </div>

      <div class="result-section">
        <div class="routine-totals">${routineTotalsHTML}</div>
        <div class="final-results">
          <div class="score-unit">
            ${(() => {
              const isBestMode = numPre2 >= 2 && sMode2 === 'best' && (resData.round === 'pre1' || resData.round === 'pre2');
              const lbl  = isBestMode ? 'BEST' : 'TOTAL';
              const disp = isBestMode ? qualTotal : totalScore;
              return `<label>${isPublished ? lbl : lbl + '*'}</label><div class="total-val num">${fmt3(disp)}</div>`;
            })()}
          </div>
          <div class="score-unit">
            <label>RANK</label>
            <div class="rank-val num">${rank !== null ? rank : '--'}</div>
          </div>
        </div>
      </div>

      <footer class="footer-credits">SYSTEM DESIGN &amp; DEVELOPMENT BY HIROTAKA.H</footer>`;

    // 順位表用にデータを保持
    lastShownResData = resData;
    lastShownAth     = ath;

    // 既存タイマー・オーバーレイをリセット
    if (rankingTimer) { clearTimeout(rankingTimer); rankingTimer = null; }
    stopRankingLoop();
    let overlay = document.getElementById('ranking-overlay');
    if (overlay) overlay.classList.remove('visible');

    if (isNew) {
      monitor.classList.remove('no-anim');
    } else {
      monitor.classList.add('no-anim');
    }
    monitor.innerHTML = html;
    monitor.style.opacity = '';

    // オーバーレイを再アタッチ（innerHTML で消えるため）
    if (!overlay) { overlay = document.createElement('div'); overlay.id = 'ranking-overlay'; }
    overlay.className = 'ranking-overlay';
    overlay.innerHTML = '';
    monitor.appendChild(overlay);

    // スコア表示後 → キュー処理 or 順位表ループへ
    const displayDelay = (displaySettings.animTotalSec + displaySettings.holdSec) * 1000;
    rankingTimer = setTimeout(() => onScoreDisplayDone(), displayDelay);
  }

  // ==== 表示設定（Firestoreから読み込み、デフォルト値付き） ====
  let displaySettings = {
    animTotalSec:  10,   // スコアアニメーションが完了するまでの秒数
    holdSec:        3,   // アニメーション完了後に保持する秒数
    rankingRows:   12,   // 順位表の1ページあたりの表示人数
    rankingPageSec: 8,   // 順位表ページ送りの間隔（秒）
  };

  let rankingTimer     = null;   // スコア表示→順位表遷移タイマー
  let rankingPageTimer = null;   // 順位表ページ切替タイマー
  let currentMode      = 'idle'; // 'idle' | 'score' | 'ranking'
  let displayQueue     = [];     // 表示待ちの resultDoc キュー
  let lastShownResData = null;   // 最後に表示したスコアのデータ（順位表用）
  let lastShownAth     = null;   // 最後に表示した選手情報
  let currentRankingPage = 0;
  let allRankingEntries  = [];

  function enqueueResult(resultDoc) {
    displayQueue.push(resultDoc);
    if (currentMode !== 'score') processQueue();
  }

  async function processQueue() {
    if (displayQueue.length === 0) {
      if (lastShownResData) startRankingLoop();
      return;
    }
    currentMode = 'score';
    stopRankingLoop();
    const resultDoc = displayQueue.shift();
    await renderFocusResult(resultDoc);
  }

  function onScoreDisplayDone() {
    // スコア表示完了 → キューに次があれば続行、なければ順位表へ
    processQueue();
  }

  // ---- 順位表ループ ----
  async function startRankingLoop() {
    currentMode = 'ranking';
    allRankingEntries = await fetchRankingEntries();
    currentRankingPage = 0;
    showRankingPage();
  }

  function stopRankingLoop() {
    if (rankingPageTimer) { clearTimeout(rankingPageTimer); rankingPageTimer = null; }
    const overlay = document.getElementById('ranking-overlay');
    if (overlay) overlay.classList.remove('visible');
  }

  function getClassRule(ath) {
    const classRules = normalizeClassRules(tournamentData?.classRules);
    const selType = (ath.type || 'individual');
    const classVal = ath.class || ath.category || '';
    return (classRules[selType] || {})[classVal] || {};
  }

  async function fetchRankingEntries() {
    if (!lastShownResData) return [];
    const ath       = lastShownAth || {};
    const classVal  = ath.class  || ath.category || '';
    const genderVal = ath.gender || '';
    const selType   = ath.type || 'individual';

    // クラスルールからscoreModeとnumPreを取得
    const rule      = getClassRule(ath);
    const numPre    = rule.qualifyingRoutines || 1;
    const scoreMode = rule.scoreMode || 'best';

    try {
      const snap = await getDocs(
        query(collection(db, "results"),
          where("eventId", "==", eventId),
          where("published", "==", true))
      );
      const byAth = {};
      snap.docs.forEach(d => {
        const r = d.data();
        const a = athleteMap[r.athleteId];
        if (!a) return;
        if ((a.class || a.category || '') !== classVal) return;
        if ((a.gender || '') !== genderVal) return;
        if ((a.type || 'individual') !== selType) return;
        if (!byAth[r.athleteId]) byAth[r.athleteId] = { a, pre1: null, pre2: null, final: null, tb1: null, tb2: null };
        if (r.round === 'pre1')  { byAth[r.athleteId].pre1 = r.officialTotal ?? null; byAth[r.athleteId].tb1 = getTbScores(r); }
        if (r.round === 'pre2')  { byAth[r.athleteId].pre2 = r.officialTotal ?? null; byAth[r.athleteId].tb2 = getTbScores(r); }
        if (r.round === 'final') byAth[r.athleteId].final = r.officialTotal ?? null;
      });
      return Object.entries(byAth)
        .map(([id, s]) => {
          // 予選スコア計算: best=高い方、total=合計
          let qualScore = null;
          if (numPre === 1) {
            qualScore = s.pre1;
          } else {
            if (s.pre1 != null && s.pre2 != null) {
              qualScore = scoreMode === 'total' ? s.pre1 + s.pre2 : Math.max(s.pre1, s.pre2);
            } else if (s.pre1 != null) {
              qualScore = s.pre1;
            } else if (s.pre2 != null) {
              qualScore = s.pre2;
            }
          }
          // タイブレーク: bestモードは選ばれた方のルーティン、totalは合計
          let tb;
          if (scoreMode === 'best' && numPre >= 2 && s.pre1 != null && s.pre2 != null) {
            tb = s.pre1 >= s.pre2 ? (s.tb1 || {}) : (s.tb2 || {});
          } else {
            tb = {
              tof:  (s.tb1?.tof ?? 0) + (s.tb2?.tof ?? 0),
              hd:   (s.tb1?.hd ?? 0) + (s.tb2?.hd ?? 0),
              diff: (s.tb1?.diff ?? 0) + (s.tb2?.diff ?? 0)
            };
          }
          return { id, ...s, total: qualScore, _tb: tb };
        })
        .sort((a, b) => {
          const sa = a.total ?? -Infinity, sb = b.total ?? -Infinity;
          const diff = sb - sa;
          if (Math.abs(diff) > 1e-9) return diff;
          // bestモード: 同点なら2本の合計で比較
          if (scoreMode === 'best' && numPre >= 2) {
            const ca = (a.pre1 ?? 0) + (a.pre2 ?? 0);
            const cb = (b.pre1 ?? 0) + (b.pre2 ?? 0);
            if (Math.abs(ca - cb) > 1e-9) return cb - ca;
          }
          // タイブレーク: 個人=T→H→D, シンクロ=S→H→D
          const keys = ['tof', 'hd', 'diff'];
          for (const k of keys) {
            const va = a._tb[k], vb = b._tb[k];
            if (va != null && vb != null && Math.abs(va - vb) > 1e-9) return vb - va;
          }
          return 0;
        });
    } catch(e) { console.error(e); return []; }
  }

  function showRankingPage() {
    if (allRankingEntries.length === 0) return;
    const rowsPerPage = displaySettings.rankingRows;
    const totalPages = Math.ceil(allRankingEntries.length / rowsPerPage);
    const page  = currentRankingPage % totalPages;
    const start = page * rowsPerPage;
    let pageEntries = allRankingEntries.slice(start, start + rowsPerPage);
    // 空行でpadして全ページ同じ行数にする（レイアウトを1ページ目と揃える）
    while (pageEntries.length < rowsPerPage) pageEntries.push(null);
    renderRankingOverlay(pageEntries, start, totalPages, page);
    rankingPageTimer = setTimeout(() => {
      currentRankingPage++;
      showRankingPage();
    }, displaySettings.rankingPageSec * 1000);
  }

  function renderRankingOverlay(entries, startOffset, totalPages, currentPage) {
    const overlay = document.getElementById('ranking-overlay');
    if (!overlay) return;
    const ath       = lastShownAth || {};
    const classVal  = ath.class  || ath.category || '';
    const genderVal = ath.gender || '';
    const heading   = [classVal, genderVal].filter(Boolean).join(' ');
    const f = v => v !== null && v !== undefined ? Number(v).toFixed(3) : '--';
    const curAthId = lastShownResData?.athleteId;

    const rule      = getClassRule(ath);
    const numPre    = rule.qualifyingRoutines || 1;
    const scoreMode = rule.scoreMode || 'best';
    const scoreModeLabel = scoreMode === 'total' ? 'TOTAL' : 'BEST';
    const show2     = numPre >= 2;

    const rowsHTML = entries.map((e, i) => {
      if (!e) return `<div class="rk-row" style="visibility:hidden;"></div>`;
      const rank   = startOffset + i + 1;
      const cur    = e.id === curAthId;
      const hasAny = e.pre1 !== null || e.pre2 !== null;
      const r2col  = show2 ? `<div class="rk-sc num">${f(e.pre2)}</div>` : '';
      return `<div class="rk-row${cur ? ' rk-current' : ''}">
        <div class="rk-rank num">${rank}</div>
        <div class="rk-name-group">
          ${e.a.type === 'synchro' && e.a.name2
            ? `<div class="rk-name">${e.a.name1} <span style="opacity:0.45;font-weight:400">/</span> ${e.a.name2}</div>`
            : `<div class="rk-name">${e.a.name1 || '---'}</div>
               <div class="rk-team">${e.a.club1 || ''}</div>`
          }
        </div>
        <div class="rk-sc num">${f(e.pre1)}</div>
        ${r2col}
        <div class="rk-tot num">${hasAny ? f(e.total) : '--'}</div>
      </div>`;
    }).join('');

    const pageIndicator = totalPages > 1
      ? `<span class="rk-page-info">${currentPage + 1} / ${totalPages}</span>`
      : '';

    const r2head = show2 ? '<span>R2</span>' : '';
    const totalHead = show2 ? scoreModeLabel : 'TOTAL';

    overlay.innerHTML = `
      <div class="rk-event-name">${tournamentName}</div>
      <div class="rk-title">${heading} — STANDINGS ${pageIndicator}</div>
      <div class="rk-col-head">
        <span>#</span><span>NAME</span><span>R1</span>${r2head}<span>${totalHead}</span>
      </div>
      <div class="rk-table">${rowsHTML}</div>
      <div class="rk-footer">SYSTEM DESIGN &amp; DEVELOPMENT BY HIROTAKA.H</div>`;
    overlay.classList.add('visible');
  }

  // ---- アニメーション設定をCSS変数で適用 ----
  // animTotalSec から duration / stagger を比率（元の 2600:1400 = 13:7）で自動計算
  // 5要素分の stagger + duration = animTotal なので:
  //   stagger = animTotal * 7/48、duration = animTotal * 13/48
  function applyAnimSettings() {
    const total    = displaySettings.animTotalSec * 1000;
    const stagger  = Math.round(total * 7 / 48);
    const duration = Math.round(total * 13 / 48);
    document.documentElement.style.setProperty('--anim-duration', duration + 'ms');
    document.documentElement.style.setProperty('--anim-stagger',  stagger  + 'ms');
  }

  // ---- 会場画面オーバーレイ管理 ----
  let warmupTimerInterval = null;

  function applyVenueScreen(tourData) {
    const screen = tourData.venueScreen || 'score';
    const warmup = tourData.warmupSettings  || {};
    const ts     = tourData.titleSettings   || {};
    const cs     = tourData.ceremonySettings|| {};
    const name   = tournamentName || '---';

    // フォントサイズ CSS変数を適用
    document.documentElement.style.setProperty('--vs-title-fs',    (ts.fontSize      || 6.5) + 'vw');
    document.documentElement.style.setProperty('--vs-cer-name-fs', (cs.nameFontSize  || 3.5) + 'vw');
    document.documentElement.style.setProperty('--vs-cer-label-fs',(cs.labelFontSize || 10)  + 'vw');
    document.documentElement.style.setProperty('--vs-class-fs',    (warmup.classFontSize || 4.5) + 'vw');
    document.documentElement.style.setProperty('--vs-timer-fs',    (warmup.timerFontSize || 16)  + 'vw');

    // 大会名を各画面に反映
    document.getElementById('vs-title-name').textContent = name;
    document.getElementById('vs-cer-name').textContent   = name;

    // クラス名（2クラスまで）
    const classes = [warmup.class1, warmup.class2].filter(Boolean);
    document.getElementById('vs-class-names').textContent = classes.join('\n') || '---';

    // 全画面を一旦非表示
    ['vs-title','vs-ceremony','vs-warmup','vs-calculating'].forEach(id => {
      document.getElementById(id)?.classList.remove('active');
    });
    clearInterval(warmupTimerInterval);
    warmupTimerInterval = null;

    // 集計中は最優先（他の画面より前面）
    if (tourData.calculating) {
      const calcEl = document.getElementById('vs-calculating');
      const ath = athleteMap[tourData.calculatingAthleteId || ''] || {};
      const classGender = [ath.class, ath.gender].filter(Boolean).join(' ');
      const orderPart   = ath.order ? ` / No.${ath.order}` : '';
      const roundLbl    = tourData.calculatingRound ? getRoundLabel(tourData.calculatingRound) : '';
      const nameHtml = ath.type === 'synchro' && ath.name2
        ? `<div class="calc-name" style="font-size:4.8cqw">${ath.name1||'---'} <span style="opacity:0.45;font-weight:400">/</span> ${ath.name2}</div>`
        : `<div class="calc-name">${ath.name1||'---'}</div>`;
      calcEl.innerHTML = `
        <div class="calc-layout">
          <div class="calc-conv">${tournamentName}</div>
          <div class="calc-meta">
            <div class="calc-class">${classGender}${orderPart}</div>
            <div class="calc-round">${roundLbl}</div>
          </div>
          <div class="calc-name-block">
            ${nameHtml}
            <div class="calc-team">${ath.club1||''}</div>
          </div>
          <div class="calc-status">得点集計中</div>
          <div class="calc-credit">SYSTEM DESIGN &amp; DEVELOPMENT BY HIROTAKA.H</div>
        </div>`;
      calcEl.classList.add('active');
      return;
    }

    if (screen === 'title') {
      document.getElementById('vs-title').classList.add('active');
    } else if (screen === 'ceremony') {
      document.getElementById('vs-ceremony').classList.add('active');
    } else if (screen === 'warmup') {
      document.getElementById('vs-warmup').classList.add('active');
      startWarmupDisplay(warmup);
    }
    // 'score' の場合はオーバーレイなし（通常のスコア表示）
  }

  function startWarmupDisplay(warmup) {
    const timerEl = document.getElementById('vs-timer');
    function tick() {
      if (!timerEl) return;
      if (warmup.timerPaused || !warmup.timerEndTime) {
        const rem = warmup.timerRemainingMs ?? 0;
        showTimerDisplay(timerEl, rem);
        return;
      }
      const rem = Math.max(0, warmup.timerEndTime - Date.now());
      showTimerDisplay(timerEl, rem);
      if (rem === 0) { clearInterval(warmupTimerInterval); warmupTimerInterval = null; }
    }
    tick();
    if (!warmup.timerPaused && warmup.timerEndTime) {
      warmupTimerInterval = setInterval(tick, 500);
    }
  }

  function showTimerDisplay(el, ms) {
    const totalSec = Math.ceil(ms / 1000);
    const min = Math.floor(totalSec / 60);
    const sec = totalSec % 60;
    el.textContent = `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    el.className = 'vs-timer num' +
      (ms === 0 ? ' done' : ms < 60000 ? ' warning' : '');
  }

  // ---- 初期化 ----
  async function init() {
    if (!eventId) return;
    try {
      const [smSnap, athSnap, tourSnap] = await Promise.all([
        getDocs(collection(db, "skillMaster")),
        getDocs(collection(db, "tournaments", eventId, "athletes")),
        getDoc(doc(db, "tournaments", eventId))
      ]);

      skillMaster = smSnap.docs
        .sort((a, b) => (a.data().displayOrder ?? parseInt(a.id)) - (b.data().displayOrder ?? parseInt(b.id)))
        .map(d => ({
          id      : d.id,
          symbol  : d.data().symbol,
          dd      : parseFloat(d.data().dd) || 0,
          isTriple: d.data().isTriple === true,
          direction: d.data().direction || '',
          displayOrder: d.data().displayOrder ?? parseInt(d.id)
        }));

      athSnap.forEach(d => athleteMap[d.id] = d.data());

      if (tourSnap.exists()) {
        const tourData = tourSnap.data();
        tournamentData = tourData;
        tournamentName = tourData.name || '---';
        document.getElementById('event-name-el').textContent = tournamentName;
        // displaySettings を読み込み
        if (tourData.displaySettings) {
          Object.assign(displaySettings, tourData.displaySettings);
          applyAnimSettings();
        }
      }

      // 大会ドキュメントをリアルタイム監視（displaySettings + 会場画面切り替え）
      onSnapshot(doc(db, 'tournaments', eventId), snap => {
        if (!snap.exists()) return;
        const data = snap.data();
        if (data.displaySettings) {
          Object.assign(displaySettings, data.displaySettings);
          applyAnimSettings();
        }
        applyVenueScreen(data);
      });

      // 全published結果を監視（デュアルパネル対応）
      const q = query(
        collection(db, "results"),
        where("eventId", "==", eventId),
        where("published", "==", true),
        orderBy("publishedAt", "desc")
      );
      let initialLoad = true;
      onSnapshot(q, snap => {
        if (initialLoad) {
          initialLoad = false;
          // 初回: 最新1件のみ表示
          if (!snap.empty) enqueueResult(snap.docs[0]);
          return;
        }
        // 以後: 新規追加分のみキューに入れる
        snap.docChanges().forEach(change => {
          // 新規公開(added)と再公開(modified)の両方を表示
          if (change.type === 'added' || change.type === 'modified') {
            // 集計中画面が出ていたらローカルで即消し＋Firestoreも更新＆キューリセット
            // calculating が実際に active のときだけ書き込む（余分な snapshot 発火を防ぐ）
            const calcEl = document.getElementById('vs-calculating');
            if (calcEl?.classList.contains('active')) {
              calcEl.classList.remove('active');
              displayQueue.length = 0;
              updateDoc(doc(db, 'tournaments', eventId), { calculating: false }).catch(console.error);
            }
            // 会場画面（title/ceremony/warmup）はローカルのみ解除
            // updateDoc(venueScreen:'score') は余分な tournament snapshot を引き起こすため廃止
            ['vs-title','vs-ceremony','vs-warmup'].forEach(id => {
              document.getElementById(id)?.classList.remove('active');
            });
            enqueueResult(change.doc);
          }
        });
      });

    } catch (e) { console.error(e); }
  }

  init();
</script>
