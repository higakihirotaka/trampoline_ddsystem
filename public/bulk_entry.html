<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>演技構成一括登録 - Trampoline System</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --primary: #263238; --accent: #1a73e8; --danger: #d32f2f;
            --bg: #f0f2f5; --card: #ffffff; --text-sub: #546e7a; --border: #e0e7ef;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; color: var(--primary);
               height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* 上部ヘッダーバー（他ページ共通） */
        .header-bar { display: flex; justify-content: space-between; align-items: center;
                      padding: 12px 20px; background: var(--card); border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .header-bar .left { display: flex; align-items: center; gap: 16px; min-width: 0; }
        .btn-back { text-decoration: none; color: var(--text-sub); font-size: 0.9rem; border: 1px solid #ccc;
                    padding: 8px 20px; border-radius: 8px; white-space: nowrap; }
        .btn-back:hover { background: #f1f3f4; }
        .page-title { font-size: 1.15rem; font-weight: 900; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .page-title .event { font-size: 0.8rem; font-weight: 600; color: var(--text-sub); margin-left: 12px; }
        .auth-info { font-size: 0.85em; color: #999; display: none; align-items: center; flex-shrink: 0; }
        .auth-info span { font-weight: bold; color: var(--primary); }
        .logout-btn { background: none; border: 1px solid #ccc; border-radius: 5px; color: var(--accent);
                      cursor: pointer; font-size: 0.9em; margin-left: 12px; padding: 3px 8px; }

        /* 2ペイン作業領域 */
        .workspace { flex: 1; display: flex; min-height: 0; padding: 20px; gap: 20px; }

        /* 左: 選手選択リスト */
        .sidebar { width: 500px; background: var(--card); border: 1px solid var(--border); border-radius: 14px;
                   display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
        .sidebar-header { padding: 16px 20px; border-bottom: 1px solid var(--border); }
        .sidebar-header h2 { margin: 0; font-size: 1rem; font-weight: 900; border-left: 5px solid var(--accent); padding-left: 12px; }
        .list-header { position: sticky; top: 0; background: #f8f9fb; z-index: 10; display: flex; align-items: center;
                       padding: 10px 15px; font-size: 0.72rem; font-weight: 700; color: #78909c; border-bottom: 1px solid var(--border); }
        .list-area { flex-grow: 1; overflow-y: auto; }
        .cat-group { background: #eef1f4; padding: 8px 15px; font-size: 0.8em; font-weight: bold; color: var(--primary); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 5px; }
        .cat-name { flex: 1; min-width: 0; }
        .cls-all-btn { padding: 2px 8px; font-size: 0.85em; cursor: pointer; background: white; border: 1px solid var(--border); border-radius: 4px; color: var(--accent); font-weight: 700; }
        .cls-all-btn:hover { background: #f0f7ff; }
        .gender-group { background: #f6f8fa; padding: 5px 20px; font-size: 0.75em; font-weight: bold; color: var(--text-sub); border-bottom: 1px solid #eee; }
        .ath-row { display: flex; align-items: center; padding: 8px 15px; border-bottom: 1px solid #f3f3f3; gap: 5px; font-size: 0.85em; }
        .ath-row:hover { background: #fafcff; }
        .col-name { flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: baseline; gap: 5px; }
        .col-round { width: 50px; text-align: center; }
        .ath-order { color: var(--accent); font-weight: bold; font-variant-numeric: tabular-nums; width: 25px; }
        .header-btn { padding: 2px 6px; font-size: 0.72em; cursor: pointer; background: white; border: 1px solid var(--border);
                      border-radius: 4px; color: var(--accent); margin-top: 3px; }
        .header-btn:hover { background: #f0f7ff; }

        /* 右: 一括適用フォーム */
        .main-content { flex-grow: 1; overflow-y: auto; display: flex; justify-content: center; align-items: flex-start; }
        .form-card { background: var(--card); padding: 28px; border-radius: 16px; border: 1px solid var(--border);
                     box-shadow: 0 2px 8px rgba(0,0,0,0.06); width: 100%; max-width: 520px; }
        .form-card h2 { margin: 0 0 18px; font-size: 1.1rem; font-weight: 900; border-left: 5px solid var(--accent); padding-left: 14px; }
        .skills-table { width: 100%; border-collapse: collapse; margin: 4px 0 16px; table-layout: fixed; }
        .skills-table th { padding: 8px 4px; border-bottom: 1px solid var(--border); text-align: center;
                           font-size: 0.72rem; font-weight: 700; color: #78909c; }
        .skills-table td { padding: 6px 4px; border-bottom: 1px solid #f3f3f3; text-align: center; }
        select { width: 100%; padding: 9px 5px; border-radius: 8px; border: 1px solid var(--border); font-size: 0.9em; background: #fff; }
        select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 2px rgba(26,115,232,0.1); }
        .total-bar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 4px;
                     padding: 10px 16px; background: #e8f0fe; border-radius: 10px; }
        .total-bar-label { font-size: 0.75em; font-weight: bold; color: var(--accent); }
        .total-bar-val { font-size: 1.6em; font-weight: 900; color: var(--accent); font-variant-numeric: tabular-nums; }
        .btn-group { display: flex; flex-direction: column; gap: 12px; margin-top: 26px; }
        .btn { padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.15s; }
        .btn-save { background: var(--accent); color: white; box-shadow: 0 4px 12px rgba(26,115,232,0.25); }
        .btn-save:hover:not(:disabled) { background: #1557b0; }
        .btn-save:disabled { background: #b0bec5; box-shadow: none; cursor: not-allowed; }
        .btn-clear { background: white; color: var(--danger); border: 1.5px solid var(--danger); }
        .btn-clear:hover { background: #ffebee; }

        /* 狭い画面では縦積み */
        @media (max-width: 900px) {
            .workspace { flex-direction: column; overflow-y: auto; }
            .sidebar { width: 100%; height: 55vh; flex-shrink: 0; }
        }
    </style>
</head>
<body>

<div class="header-bar">
    <div class="left">
        <a href="#" id="menu-back" class="btn-back">← 管理メニューに戻る</a>
        <h1 class="page-title">演技構成 一括登録<span class="event" id="event-name">Loading...</span></h1>
    </div>
    <div id="auth-info" class="auth-info">
        <span id="user-name"></span>としてログイン中
        <button id="logout-btn" class="logout-btn">ログアウト</button>
    </div>
</div>

<div class="workspace">
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>一括登録対象の選択</h2>
        </div>
        <div class="list-header">
            <div class="col-name">選手名</div>
            <div class="col-round">R1<br><button class="header-btn" data-round-name="pre1">全</button></div>
            <div class="col-round">R2<br><button class="header-btn" data-round-name="pre2">全</button></div>
            <div class="col-round">Final<br><button class="header-btn" data-round-name="final">全</button></div>
        </div>
        <div class="list-area" id="athlete-list"></div>
    </div>
    <div class="main-content">
        <div class="form-card">
            <h2>一括適用する演技構成</h2>
            <table class="skills-table">
                <thead><tr><th style="width:35px;">#</th><th style="width:22%;">系統</th><th style="width:20%;">宙系</th><th>技名</th><th style="width:50px;">DD</th></tr></thead>
                <tbody id="skill-rows"></tbody>
            </table>
            <div class="total-bar">
                <span class="total-bar-label">Total DD</span>
                <span id="total-dd" class="total-bar-val">0.0</span>
            </div>
            <div class="btn-group">
                <button id="save-btn" class="btn btn-save">選択した項目に一括保存</button>
                <button id="clear-btn" class="btn btn-clear">選択した項目のデータを全消去</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { ensureAdmin, logout, getTournamentDetails, bulkSaveSubmissions, bulkClearSubmissions } from './auth.js';
    import { getAthletes, getSkills } from './cache.js';

    const params = new URLSearchParams(location.search);
    const eventId = params.get('event')?.trim();
    let skillMaster = [], athletes = [], currentTour = null;

    ensureAdmin(user => {
        document.getElementById('auth-info').style.display = 'flex';
        document.getElementById('user-name').textContent = user.displayName || user.email;
        document.getElementById('logout-btn').onclick = logout;
        init();
    });

    async function init() {
        if (!eventId) {
            document.body.innerHTML = `<h1>大会IDが指定されていません。</h1><a href='admin_index.html'>大会選択に戻る</a>`;
            return;
        }
        document.getElementById('menu-back').href = `admin_menu.html?event=${eventId}`;

        try {
            [currentTour, athletes, skillMaster] = await Promise.all([
                getTournamentDetails(eventId),
                getAthletes(eventId),
                getSkills()
            ]);

            if (!currentTour) throw new Error("大会情報が見つかりません。");

            document.getElementById('event-name').innerText = currentTour.name;
            renderAthleteList();
            renderForm();
            attachEventListeners();
        } catch (error) {
            console.error("Initialization failed:", error);
            document.body.innerHTML = `<h1>ページの読み込みに失敗しました: ${error.message}</h1>`;
        }
    }

    function renderAthleteList() {
        const container = document.getElementById('athlete-list');
        const classRules = currentTour.classRules || {};

        // 個人→シンクロ、クラス→性別→出場順 でソート
        athletes.sort((a, b) => {
            const ta = a.type || 'individual', tb = b.type || 'individual';
            if (ta !== tb) return ta.localeCompare(tb);
            const ca = (a.class || a.category || ''), cb = (b.class || b.category || '');
            if (ca !== cb) return ca.localeCompare(cb);
            const ga = a.gender || '', gb = b.gender || '';
            if (ga !== gb) return ga.localeCompare(gb);
            return (a.order ?? 999) - (b.order ?? 999);
        });

        let html = "", lastCat = "", lastGender = "", classIdx = -1;
        athletes.forEach(ath => {
            const cls     = ath.class || ath.category || '未分類';
            const athType = ath.type === 'synchro' ? 'synchro' : 'individual';
            const athRules = classRules[athType]?.[cls] || { qualifyingRoutines: currentTour.qualifyingRoutines ?? 1, hasFinal: currentTour.hasFinal ?? false };
            const numPre   = athRules.finalOnly === true ? 0 : (athRules.qualifyingRoutines || 1);   // 決勝のみは予選なし

            if (cls !== lastCat) {
                classIdx++;
                html += `<div class="cat-group" data-cls-idx="${classIdx}">
                    <span class="cat-name">${cls}</span>
                    <div class="col-round">${numPre >= 1 ? `<button class="cls-all-btn" data-cls-idx="${classIdx}" data-rid="pre1">全</button>` : ''}</div>
                    <div class="col-round">${numPre >= 2 ? `<button class="cls-all-btn" data-cls-idx="${classIdx}" data-rid="pre2">全</button>` : ''}</div>
                    <div class="col-round">${athRules.hasFinal ? `<button class="cls-all-btn" data-cls-idx="${classIdx}" data-rid="final">全</button>` : ''}</div>
                </div>`;
                lastCat = cls; lastGender = "";
            }
            if ((ath.gender || '') !== lastGender) {
                html += `<div class="gender-group">${ath.gender || ''}</div>`;
                lastGender = ath.gender || '';
            }

            const nameHtml = athType === 'synchro'
                ? `${ath.name1 || ''} / ${ath.name2 || ''}`
                : `${ath.name1 || ''}`;

            html += `<div class="ath-row">
                <div class="col-name"><span class="ath-order">${ath.order || '-'}.</span><span>${nameHtml}</span></div>
                <div class="col-round">${numPre >= 1 ? `<input type="checkbox" class="chk-item chk-pre1" data-cls-idx="${classIdx}" data-aid="${ath.id}" data-rid="pre1">` : '-'}</div>
                <div class="col-round">${numPre >= 2 ? `<input type="checkbox" class="chk-item chk-pre2" data-cls-idx="${classIdx}" data-aid="${ath.id}" data-rid="pre2">` : '-'}</div>
                <div class="col-round">${athRules.hasFinal ? `<input type="checkbox" class="chk-item chk-final" data-cls-idx="${classIdx}" data-aid="${ath.id}" data-rid="final">` : '-'}</div>
            </div>`;
        });
        container.innerHTML = html || '<div style="padding:20px; color:#999;">選手データがありません</div>';
    }

    function renderForm() {
        let rows = "";
        for (let i = 1; i <= 10; i++) {
            rows += `<tr id="row-${i}">
                <td>${i}</td>
                <td><select id="dir-${i}" data-idx="${i}">
                    <option value="">--</option>
                    <option value="前方系">前方系</option>
                    <option value="後方系">後方系</option>
                    <option value="基礎技">基礎技</option>
                </select></td>
                <td><select id="soma-${i}" data-idx="${i}" style="visibility:hidden;"></select></td>
                <td><select id="skill-${i}" data-idx="${i}"><option value="">選択してください</option></select></td>
                <td><span id="dd-${i}" style="font-weight:bold; color:var(--accent);">-</span></td>
            </tr>`;
        }
        document.getElementById('skill-rows').innerHTML = rows;
    }

    // 2段目セレクタの選択肢（系統で出し分け: 基礎技=開始姿勢 / 宙技=宙系）※選手入力(entry.html)と同一
    const SOMA_OPTIONS = {
        basic:  [['','--（全て）'], ['スタンドから','スタンドから'], ['腰から','腰から'], ['腹から','腹から'], ['背から','背から']],
        aerial: [['','--'], ['1回宙','1回宙系'], ['2回宙（1.5以下）','2回宙系（1.5以下）'], ['2回宙（1.6以上）','2回宙系（1.6以上）'], ['3回宙','3回宙系'], ['4回宙','4回宙系']]
    };

    function updateOptions(idx) {
        const dir = document.getElementById(`dir-${idx}`).value;
        const somaEl = document.getElementById(`soma-${idx}`);
        const sel = document.getElementById(`skill-${idx}`);
        const isBasic = dir === '基礎技';
        // 2段目セレクタを系統で動的構築（基礎技→開始姿勢 / 宙技→宙系）。現在の選択は可能なら維持
        const showSoma = !!dir;
        somaEl.style.visibility = showSoma ? '' : 'hidden';
        const want = somaEl.value;
        const opts = isBasic ? SOMA_OPTIONS.basic : SOMA_OPTIONS.aerial;
        somaEl.innerHTML = opts.map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
        somaEl.value = (showSoma && opts.some(([v]) => v === want)) ? want : '';

        // '2回宙（1.5以下）' / '2回宙（1.6以上）' を somersaultType + doubleSomaGroup にマップ
        const soma = somaEl.value;
        let somaType  = soma;
        let somaGroup = '';
        if (soma === '2回宙（1.5以下）') { somaType = '2回宙'; somaGroup = 'low'; }
        else if (soma === '2回宙（1.6以上）') { somaType = '2回宙'; somaGroup = 'high'; }
        sel.innerHTML = '<option value="">選択してください</option>';
        if (dir) {
            skillMaster.filter(s => {
                if (s.direction !== dir) return false;
                if (somaType && s.somersaultType !== somaType) return false;
                if (somaGroup && s.doubleSomaGroup !== somaGroup) return false;
                return true;
            }).forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.id;
                opt.textContent = s.note ? `${s.symbol}（${s.note}）` : s.symbol;
                sel.appendChild(opt);
            });
        }
        updateDD(idx);
    }

    function updateDD(idx) {
        const skillId = document.getElementById(`skill-${idx}`).value;
        const skill = skillMaster.find(s => s.id === skillId);
        document.getElementById(`dd-${idx}`).textContent = skill ? skill.dd.toFixed(1) : '-';
        calcTotal();
    }

    function calcTotal() {
        let total = 0;
        const seenIds = new Set();
        for (let i = 1; i <= 10; i++) {
            const id = document.getElementById(`skill-${i}`).value;
            if (id && !seenIds.has(id)) {
                const skill = skillMaster.find(s => s.id === id);
                if (skill) total += skill.dd;
                seenIds.add(id);
            }
        }
        document.getElementById('total-dd').textContent = total.toFixed(1);
    }

    function attachEventListeners() {
        document.getElementById('skill-rows').addEventListener('change', e => {
            const idx = e.target.dataset.idx;
            if (!idx) return;
            if (e.target.id.startsWith('dir-') || e.target.id.startsWith('soma-')) {
                updateOptions(Number(idx));
            } else if (e.target.id.startsWith('skill-')) {
                updateDD(Number(idx));
            }
        });

        document.querySelectorAll('.list-header .header-btn').forEach(btn => {
            btn.addEventListener('click', () => toggleColumn(btn.dataset.roundName));
        });

        // クラス×ラウンドの「全」ボタン（そのクラスのそのラウンドを全選択/全解除）
        const list = document.getElementById('athlete-list');
        list.addEventListener('click', e => {
            const btn = e.target.closest('.cls-all-btn');
            if (!btn) return;
            const items = [...list.querySelectorAll(`.chk-item[data-cls-idx="${btn.dataset.clsIdx}"][data-rid="${btn.dataset.rid}"]`)];
            if (!items.length) return;
            const allChecked = items.every(i => i.checked);
            items.forEach(i => i.checked = !allChecked);
        });

        document.getElementById('save-btn').addEventListener('click', bulkSave);
        document.getElementById('clear-btn').addEventListener('click', bulkClear);
    }

    function toggleColumn(rid) {
        const checks = document.querySelectorAll(`.chk-${rid}`);
        if (checks.length === 0) return;
        const allChecked = Array.from(checks).every(c => c.checked);
        checks.forEach(c => c.checked = !allChecked);
    };

    async function bulkSave() {
        const selected = Array.from(document.querySelectorAll('.chk-item:checked')).map(chk => ({ athleteId: chk.dataset.aid, round: chk.dataset.rid }));
        if (selected.length === 0) return alert("対象を選択してください。");

        const skillIds = [];
        for (let i = 1; i <= 10; i++) {
            const skillId = document.getElementById(`skill-${i}`).value;
            if (!skillId) return alert("10本すべての技を選択してください。");
            const skill = skillMaster.find(s => s.id === skillId);
            skillIds.push({ id: skillId, skill: skill.symbol, dd: skill.dd });
        }

        if (!confirm(`${selected.length}件の演技構成を一括登録します。よろしいですか？`)) return;

        const btn = document.getElementById('save-btn');
        btn.disabled = true; btn.textContent = '登録中...';

        const result = await bulkSaveSubmissions(eventId, selected, skillIds);
        alert(result.message);

        btn.disabled = false; btn.textContent = '選択した項目に一括保存';
        if(result.success) location.reload();
    }

    async function bulkClear() {
        const selected = Array.from(document.querySelectorAll('.chk-item:checked')).map(chk => ({ athleteId: chk.dataset.aid, round: chk.dataset.rid }));
        if (selected.length === 0) return alert("削除する対象を選択してください。");

        if (!confirm(`選択された${selected.length}件の演技構成データを完全に削除します。この操作は元に戻せません。よろしいですか？`)) return;

        const btn = document.getElementById('clear-btn');
        btn.disabled = true; btn.textContent = '削除中...';

        const result = await bulkClearSubmissions(eventId, selected);
        alert(result.message);

        btn.disabled = false; btn.textContent = '選択した項目のデータを全消去';
        if(result.success) location.reload();
    }
</script>
</body>
</html>
