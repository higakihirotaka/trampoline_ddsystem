<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>公開スコアページ レイアウト確認（サンプル）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --soft: #f8fafc;
    --soft-hover: #f1f5f9;
    --line: #e2e8f0;
    --line-soft: #f1f5f9;
    --ink: #0f172a;
    --sub: #475569;
    --mute: #94a3b8;

    --hero: #0f172a;
    --hero2: #1e3a8a;
    --sel: #1e293b;
    --on-sel: #ffffff;
    --accent: #2563eb;
    --accent-soft: #eff6ff;

    --hl: #f59e0b;
    --on-hl: #451a03;
    --hl-soft: #fefce8;
    --hl-border: #fde047;

    --ok: #059669;
    --ok-soft: #ecfdf5;
    --ok-border: #a7f3d0;

    --danger: #dc2626;
    --danger-soft: #fef2f2;

    --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.04), 0 1px 2px rgba(15, 23, 42, 0.02);
    --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
    --num: "Barlow", "DIN 2014", system-ui, -apple-system, sans-serif;
    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-sm: 8px;
  }

  :root[data-theme="red"] {
    --hero: #450a0a;
    --hero2: #881337;
    --sel: #881337;
    --accent: #e11d48;
    --accent-soft: #fff1f2;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #090d16;
      --card: #131b2e;
      --soft: #1c263b;
      --soft-hover: #25334d;
      --line: #28354e;
      --line-soft: #1e293b;
      --ink: #f1f5f9;
      --sub: #94a3b8;
      --mute: #64748b;

      --hero: #060911;
      --hero2: #172554;
      --sel: #3b82f6;
      --on-sel: #ffffff;
      --accent: #60a5fa;
      --accent-soft: rgba(59, 130, 246, 0.15);

      --hl: #f59e0b;
      --on-hl: #451a03;
      --hl-soft: rgba(245, 158, 11, 0.12);
      --hl-border: rgba(245, 158, 11, 0.4);

      --ok: #34d399;
      --ok-soft: rgba(16, 185, 129, 0.15);
      --ok-border: rgba(52, 211, 153, 0.3);

      --danger: #f87171;
      --danger-soft: rgba(239, 68, 68, 0.15);
      --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 6px 16px rgba(0, 0, 0, 0.4);
    }
    :root[data-theme="red"] {
      --hero: #2a060c;
      --hero2: #4c0519;
      --sel: #f43f5e;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans JP", system-ui, -apple-system, "Hiragino Sans", sans-serif;
    -webkit-text-size-adjust: 100%;
    line-height: 1.5;
  }

  /* サンプルバー */
  .sample-bar {
    background: #1e293b;
    color: #cbd5e1;
    font-size: 11px;
    text-align: center;
    padding: 5px 12px;
    letter-spacing: .02em;
  }

  /* ヒーローヘッダー */
  .hero {
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, var(--hero) 0%, var(--hero2) 100%);
    color: #fff;
    padding: 20px 0 18px;
  }
  .hero .arc {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .hero .arc path {
    fill: none;
    stroke: #fff;
    stroke-opacity: .07;
    stroke-width: 2;
  }
  .hero .arc circle {
    fill: var(--hl);
    fill-opacity: .6;
  }
  .hero-in {
    position: relative;
    max-width: 680px;
    margin: 0 auto;
    padding: 0 16px;
  }
  .kicker-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .kicker {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--num);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .12em;
    color: #ffd277;
    background: rgba(245, 158, 11, 0.18);
    border: 1px solid rgba(245, 158, 11, 0.35);
    padding: 2px 9px;
    border-radius: 999px;
  }
  .kicker::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--hl);
  }
  .stamp {
    font-family: var(--num);
    font-size: 11px;
    color: rgba(255, 255, 255, .65);
  }
  .hero h1 {
    font-size: 20px;
    line-height: 1.35;
    margin: 8px 0 0;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .hero .meta {
    font-size: 12px;
    color: rgba(255, 255, 255, .75);
    margin-top: 4px;
  }
  .hero .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid rgba(255, 255, 255, .12);
    flex-wrap: wrap;
  }
  .notice {
    font-size: 11px;
    color: rgba(255, 255, 255, .75);
  }
  .ctl {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .ctl button {
    font: inherit;
    font-size: 11px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, .25);
    background: rgba(255, 255, 255, .1);
    color: #fff;
    cursor: pointer;
    transition: all .15s ease;
  }
  .ctl button:hover {
    background: rgba(255, 255, 255, .18);
  }
  .ctl button:active {
    transform: scale(0.96);
  }
  .ctl button[aria-pressed="true"] {
    background: var(--hl);
    color: var(--on-hl);
    border-color: var(--hl);
    font-weight: 700;
  }

  /* スティッキー操作パネル */
  .sticky-nav {
    position: sticky;
    top: 0;
    z-index: 30;
    background: rgba(244, 246, 249, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    padding: 10px 0;
    transition: box-shadow .2s ease;
  }
  @media (prefers-color-scheme: dark) {
    .sticky-nav {
      background: rgba(9, 13, 22, 0.88);
    }
  }
  .nav-inner {
    max-width: 680px;
    margin: 0 auto;
    padding: 0 12px;
  }

  /* 1. フェーズ切り替え */
  .seg {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    background: var(--soft);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 3px;
  }
  .seg button {
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    border: 0;
    border-radius: 9px;
    padding: 8px 0;
    background: transparent;
    color: var(--sub);
    cursor: pointer;
    transition: all .15s ease;
  }
  .seg button:hover:not([aria-pressed="true"]) {
    color: var(--ink);
  }
  .seg button[aria-pressed="true"] {
    background: var(--card);
    color: var(--ink);
    box-shadow: var(--shadow-sm);
  }
  @media (prefers-color-scheme: dark) {
    .seg button[aria-pressed="true"] {
      background: var(--sel);
      color: var(--on-sel);
    }
  }

  /* 2. カテゴリーチップ */
  .cats-box {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .grp {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .grp-h {
    font-size: 11px;
    font-weight: 700;
    color: var(--sub);
    min-width: 52px;
    flex-shrink: 0;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    flex: 1;
  }
  .chip {
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 13px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
    transition: all .12s ease;
    white-space: nowrap;
  }
  .chip:hover:not(:disabled):not([aria-pressed="true"]) {
    border-color: var(--mute);
    background: var(--soft);
  }
  .chip:active:not(:disabled) {
    transform: scale(0.96);
  }
  .chip[aria-pressed="true"] {
    background: var(--sel);
    color: var(--on-sel);
    border-color: var(--sel);
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.15);
  }
  .chip:disabled {
    color: var(--mute);
    border-style: dashed;
    background: transparent;
    cursor: default;
  }

  /* メインコンテナ */
  .wrap {
    max-width: 680px;
    margin: 0 auto;
    padding: 0 12px 64px;
  }

  /* セクション見出し */
  .sec {
    margin: 18px 2px 12px;
  }
  .sec-t {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .sec-title-grp {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
  }
  .sec h2 {
    font-size: 19px;
    margin: 0;
    font-weight: 700;
    line-height: 1.25;
  }
  .sec small {
    font-size: 13px;
    color: var(--sub);
    font-weight: 600;
  }
  .badge {
    font-family: var(--num);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--ok-soft);
    color: var(--ok);
    border: 1px solid var(--ok-border);
    white-space: nowrap;
  }
  .bar {
    height: 4px;
    border-radius: 4px;
    background: var(--line);
    margin-top: 8px;
    overflow: hidden;
  }
  .bar i {
    display: block;
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--ok));
    border-radius: 4px;
    transition: width .3s ease;
  }

  /* スコアカード（選手行） */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 16px 14px 14px;
    margin-bottom: 12px;
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .card.q-on {
    border-left: 5px solid var(--ok);
  }
  .card.dim {
    opacity: .6;
    background: var(--soft);
  }
  .top {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .rank {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--soft);
    color: var(--sub);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--num);
    font-weight: 800;
    font-size: 17px;
    flex: none;
  }
  .rank.m1 {
    background: linear-gradient(135deg, #fde047, #f59e0b);
    color: #451a03;
    box-shadow: 0 2px 6px rgba(245, 158, 11, 0.35);
  }
  .rank.m2 {
    background: linear-gradient(135deg, #e2e8f0, #94a3b8);
    color: #0f172a;
  }
  .rank.m3 {
    background: linear-gradient(135deg, #fed7aa, #d97706);
    color: #431407;
  }
  .who {
    flex: 1;
    min-width: 0;
  }
  .name-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .name {
    font-size: 17px;
    font-weight: 700;
    overflow-wrap: anywhere;
    line-height: 1.3;
  }
  .q {
    display: inline-flex;
    align-items: center;
    font-family: var(--num);
    font-size: 11px;
    font-weight: 800;
    color: var(--ok);
    background: var(--ok-soft);
    border: 1px solid var(--ok-border);
    border-radius: 5px;
    padding: 1px 7px;
    line-height: 1.4;
  }
  .club {
    font-size: 12px;
    color: var(--sub);
    margin-top: 2px;
    overflow-wrap: anywhere;
  }
  .tot {
    text-align: right;
    flex: none;
  }
  .tot b {
    display: block;
    font-family: var(--num);
    font-size: 32px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }
  .tot span {
    display: block;
    font-family: var(--num);
    font-size: 12px;
    font-weight: 600;
    color: var(--mute);
    margin-top: 4px;
  }

  /* ★ 本ごとの得点ブロック（D / E / ToF / HD / 減点 を大幅拡大） */
  .rt-wrap {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 12px;
  }
  .rt {
    background: var(--soft);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 10px 12px;
  }
  .rt.use {
    background: var(--hl-soft);
    border-color: var(--hl-border);
    box-shadow: inset 4px 0 0 var(--hl);
  }
  .rt.off {
    opacity: .72;
  }
  .rt-h {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--sub);
  }
  .rt-h b {
    font-family: var(--num);
    font-size: 22px;
    font-weight: 800;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .tag {
    font-style: normal;
    font-size: 11px;
    font-weight: 700;
    background: var(--hl);
    color: var(--on-hl);
    border-radius: 5px;
    padding: 2px 7px;
    margin-left: 6px;
  }
  .rt-g {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 6px;
    text-align: center;
    margin-top: 8px;
  }
  .rt-g > span {
    background: var(--card);
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    padding: 6px 2px 5px;
    font-size: 11px;
    font-weight: 700;
    color: var(--sub);
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .rt.use .rt-g > span {
    border-color: rgba(245, 158, 11, 0.28);
  }
  .rt-g b {
    display: block;
    font-family: var(--num);
    font-size: 19px;
    color: var(--ink);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1.15;
    margin-top: 2px;
  }
  .rt-g b.pen-val {
    color: var(--danger);
  }

  @media (max-width: 390px) {
    .rt-g { gap: 4px; }
    .rt-g b { font-size: 17px; }
    .tot b { font-size: 28px; }
  }

  /* 技ごとの内訳トグルボタン＆テーブル */
  .more {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    margin-top: 10px;
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    background: var(--soft);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 8px 0;
    cursor: pointer;
    transition: background .15s;
  }
  .more:hover {
    background: var(--soft-hover);
  }
  .detail-box {
    margin-top: 10px;
    padding-top: 6px;
    border-top: 1px solid var(--line);
    animation: fadeIn .18s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  table.sk {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    margin-top: 4px;
    font-family: var(--num);
    font-variant-numeric: tabular-nums;
  }
  table.sk th, table.sk td {
    padding: 6px 6px;
    text-align: right;
    font-weight: 600;
  }
  table.sk tr:nth-child(even) td {
    background: var(--soft);
  }
  table.sk th {
    color: var(--sub);
    font-size: 11px;
    font-family: "Noto Sans JP", system-ui, sans-serif;
    font-weight: 700;
    border-bottom: 1px solid var(--line);
  }
  table.sk th:first-child, table.sk td:first-child,
  table.sk th:nth-child(2), table.sk td:nth-child(2) {
    text-align: left;
  }
  table.sk td:first-child {
    color: var(--mute);
    width: 28px;
  }
  table.sk td:nth-child(2) {
    font-weight: 700;
  }
  table.sk tr.land td {
    border-top: 1px solid var(--line);
    font-weight: 700;
    background: var(--soft);
  }
  .cap {
    font-size: 12px;
    color: var(--sub);
    font-weight: 700;
    margin-top: 10px;
  }
  .cap:first-child {
    margin-top: 4px;
  }
  .cap.n {
    font-weight: 600;
    color: var(--danger);
  }
  .na {
    color: var(--mute);
    font-weight: 500;
  }

  /* 団体カード */
  .mem {
    display: grid;
    grid-template-columns: 1fr 78px 78px;
    gap: 6px;
    font-size: 14px;
    padding: 8px 4px;
    border-top: 1px solid var(--line-soft);
    align-items: center;
    font-variant-numeric: tabular-nums;
  }
  .mem.h {
    font-size: 11px;
    color: var(--sub);
    border-top: 1px solid var(--line);
    margin-top: 10px;
    padding: 8px 4px 4px;
    font-weight: 700;
  }
  .mem span:not(:first-child) {
    text-align: right;
    font-family: var(--num);
    font-size: 17px;
  }
  .mem.h span:not(:first-child) {
    font-family: inherit;
    font-size: 11px;
  }
  .mem .use {
    background: var(--hl-soft);
    border: 1px solid var(--hl-border);
    color: var(--ink);
    border-radius: 5px;
    padding: 2px 7px;
    font-weight: 800;
  }
  .mem .drop {
    color: var(--mute);
    padding: 2px 7px;
  }

  .empty {
    background: var(--card);
    border: 1px dashed var(--line);
    border-radius: var(--radius-lg);
    padding: 36px 16px;
    text-align: center;
    margin-top: 16px;
  }
  .empty b {
    display: block;
    font-size: 15px;
    margin-bottom: 4px;
  }
  .empty span {
    font-size: 12px;
    color: var(--sub);
  }
  .err {
    color: var(--danger);
    background: var(--danger-soft);
    border-radius: var(--radius-md);
    font-size: 13px;
    padding: 16px;
    margin-top: 16px;
  }
</style>
</head>
<body>
<div class="sample-bar">サンプル表示 — Aクラスのデータを埋め込んだ、単体で開けるレイアウト確認用のページです</div>

<header class="hero">
  <svg class="arc" viewBox="0 0 400 150" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <path d="M-30 150 Q 60 -20 150 150"/><path d="M110 150 Q 205 10 300 150"/><path d="M250 150 Q 335 30 430 150"/>
    <circle cx="60" cy="32" r="3"/><circle cx="205" cy="48" r="3"/><circle cx="335" cy="56" r="3"/>
  </svg>
  <div class="hero-in">
    <div class="kicker-row">
      <div class="kicker">LIVE SCORES</div>
      <div class="stamp" id="stamp"></div>
    </div>
    <h1 id="t-name">読み込み中…</h1>
    <div class="meta" id="t-meta"></div>
    <div class="row">
      <span class="notice">※速報値のため、最終的な公式結果が優先されます</span>
      <span class="ctl">
        <button id="btn-refresh" type="button">↻ 更新</button>
        <button id="btn-auto" type="button" aria-pressed="false">自動更新 OFF</button>
      </span>
    </div>
  </div>
</header>

<nav class="sticky-nav" aria-label="カテゴリー選択">
  <div class="nav-inner">
    <div class="seg" id="phases"></div>
    <div class="cats-box" id="cats"></div>
  </div>
</nav>

<main class="wrap">
  <div id="out"></div>
</main>

<script src="score_public_sample_data.js"></script>
<script type="module">

// ---------- サンプルデータ（score_public_sample_data.js に分離。Aクラスのみ） ----------
const DATA = window.SAMPLE_DATA;

// ---------- 共通の計算（shared.js の順位・難度の計算を、そのまま収録） ----------
function round1(v) {
  return Math.round(v * 10) / 10;
}

function extractTbScores(result) {
  if (!result) return { tof: null, hd: null, diff: null };
  return {
    tof:  result.tof                    ?? null,
    hd:   result.hd?.total              ?? null,
    diff: result.officialD ?? result.dd ?? null
  };
}

function calcQualifyingScore(pre1, pre2, numPre, scoreMode) {
  if (numPre === 1) return pre1 ?? null;
  if (pre1 != null && pre2 != null)
    return scoreMode === 'total' ? pre1 + pre2 : Math.max(pre1, pre2);
  return pre1 ?? pre2 ?? null;
}

function calcQualifyingTb(pre1, pre2, pre1r, pre2r, numPre, scoreMode) {
  if (numPre < 2 || pre1 == null || pre2 == null) {
    return { tbSum: null, tb: extractTbScores(pre1 != null ? pre1r : pre2r) };
  }
  if (scoreMode === 'best') {
    return {
      tbSum: pre1 + pre2,
      tb:    extractTbScores(pre1 >= pre2 ? pre1r : pre2r)
    };
  } else {
    const s1 = extractTbScores(pre1r), s2 = extractTbScores(pre2r);
    return {
      tbSum: null,
      tb: {
        tof:  (s1.tof  ?? 0) + (s2.tof  ?? 0),
        hd:   (s1.hd   ?? 0) + (s2.hd   ?? 0),
        diff: (s1.diff ?? 0) + (s2.diff ?? 0)
      }
    };
  }
}

function calcFinalScore(qualPre, final, finalScoreMode) {
  if (finalScoreMode === 'combined') {
    if (qualPre != null && final != null) return qualPre + final;
    return final ?? qualPre ?? null;
  }
  return final ?? null;
}

function compareRankEntries(a, b) {
  if (a.qualScore == null && b.qualScore == null) return 0;
  if (a.qualScore == null) return  1;
  if (b.qualScore == null) return -1;
  const as2 = Math.round(a.qualScore * 1000) / 1000;
  const bs2 = Math.round(b.qualScore * 1000) / 1000;
  if (bs2 !== as2) return bs2 - as2;
  if (a.tbSum != null && b.tbSum != null && Math.abs(b.tbSum - a.tbSum) > 1e-9) return b.tbSum - a.tbSum;
  for (const k of ['tof', 'hd', 'diff']) {
    const va = a.tb?.[k], vb = b.tb?.[k];
    if (va != null && vb != null && Math.abs(vb - va) > 1e-9) return vb - va;
  }
  return 0;
}

function assignRanks(entries) {
  entries.forEach((r, idx) => {
    if (idx === 0) { r.rank = 1; return; }
    const prev = entries[idx - 1];
    if (r.qualScore == null || prev.qualScore == null) { r.rank = idx + 1; return; }
    r.rank = compareRankEntries(r, prev) === 0 ? prev.rank : idx + 1;
  });
  return entries;
}

function calcBonus(gender, tripleCount) {
  if (gender === '男子' && tripleCount > 5) return (tripleCount - 5) * 0.3;
  if ((gender === '女子' || gender === '混合') && tripleCount >= 3) return (tripleCount - 2) * 0.3;
  return 0;
}

function parseDDRule(rule, round) {
  const r = rule || {};
  const num = v => { const n = parseFloat(v); return (v != null && !isNaN(n)) ? n : null; };
  const rawDesig = (r.designatedDDCount != null && r.designatedDDCount >= 0) ? r.designatedDDCount : -1;
  const desigValid = rawDesig >= 0 && r.qualifyingRoutines === 2 && r.scoreMode === 'total' && round === 'pre1';
  return {
    perSkillDDCap: num(r.perSkillDDCap),
    perSkillDQ:    r.perSkillDDCapMode === 'disqualify',
    routineDDCap:  num(r.routineDDCap),
    routineDQ:     r.routineDDCapMode === 'disqualify',
    minRoutineDD:  num(r.minRoutineDD),
    designatedDDCount: desigValid ? rawDesig : -1,
  };
}

function calcCardDD({ skills, gender, ddRule, designatedIndices = [], validLimit = 10 }) {
  const { perSkillDDCap: pc, perSkillDQ, routineDDCap: rc, routineDQ, designatedDDCount: dc } = ddRule;
  const desigSet = designatedIndices instanceof Set ? designatedIndices : new Set(designatedIndices);

  const keyCounts = {};
  for (let i = 0; i < 10 && i < validLimit; i++) {
    const s = skills[i];
    if (s && s.key) keyCounts[s.key] = (keyCounts[s.key] || 0) + 1;
  }

  const rows = [], seen = new Set();
  let baseDD = 0, tripleCount = 0, skillOverCapDQ = false;
  for (let i = 0; i < 10; i++) {
    const s = skills[i] || null;
    const isDesignated = dc < 0 || (dc > 0 && desigSet.has(i));
    const row = { index: i, blank: !s, beyondLimit: i >= validLimit, skill: s, isDesignated,
                  isDupRow: false, isDupZero: false, overCap: false, isCapped: false, counted: false, usedDD: 0 };
    rows.push(row);
    if (row.beyondLimit || !s) continue;

    row.isDupRow  = !!s.key && keyCounts[s.key] > 1;
    row.isDupZero = !!s.key && seen.has(s.key);
    if (s.key) seen.add(s.key);

    const dd = s.dd;
    row.overCap  = !row.isDupZero && pc != null && dd != null && round1(dd) > pc;
    row.isCapped = row.overCap && !perSkillDQ;
    row.usedDD   = row.isDupZero ? 0 : (row.isCapped ? pc : (dd ?? 0));
    row.counted  = isDesignated && !row.isDupZero;
    if (row.counted) {
      if (dd != null) baseDD += row.usedDD;
      if (s.isTriple) tripleCount++;
      if (row.overCap && perSkillDQ) skillOverCapDQ = true;
    }
  }

  const bonus = calcBonus(gender || '', tripleCount);
  const rawTotal = baseDD + bonus;
  const routineOverCap = rc != null && round1(rawTotal) > rc;
  const routineCapped  = routineOverCap && !routineDQ;
  const routineOverDQ  = routineOverCap && routineDQ;
  return { rows, baseDD, tripleCount, bonus, rawTotal, total: routineCapped ? rc : rawTotal,
           routineOverCap, routineCapped, routineOverDQ, skillOverCapDQ };
}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const f2 = v => v != null ? Number(v).toFixed(2) : null;
const f2r = v => v != null ? (Math.round(Number(v) * 100 + 1e-6) / 100).toFixed(2) : null;

// ---------- グループ ----------
const ruleOf = (type, cls) => ((tour.classRules || {})[type] || {})[cls] || {};
const typeLabel = t => t === 'synchro' ? 'シンクロ' : t === 'team' ? '団体' : '個人';
const clsOf = a => a.class || a.category || '';
function classOrder(type) {
  const defs = Array.isArray(tour.classes) ? tour.classes : (tour.classes?.[type] || tour.classes?.individual || []);
  return defs.slice().sort((a, b) => (a.display_order ?? 99) - (b.display_order ?? 99)).map(c => c.name);
}
function personGroups() {
  const out = [];
  for (const type of ['individual', 'synchro']) {
    const ath = athletes.filter(a => (a.type || 'individual') === type);
    const present = [...new Set(ath.map(clsOf).filter(Boolean))];
    const order = classOrder(type);
    const classes = [...order.filter(c => present.includes(c)), ...present.filter(c => !order.includes(c))];
    for (const cls of classes) {
      const genders = [...new Set(ath.filter(a => clsOf(a) === cls).map(a => a.gender || '').filter(Boolean))].sort((a, b) => genderRank(a) - genderRank(b));
      genders.forEach(gender => out.push({ type, cls, gender, key: `${type}|${cls}|${gender}`, label: `${typeLabel(type)} ${cls} ${gender}` }));
    }
  }
  return out;
}
function teamGroups() {
  const order = classOrder('individual');
  const present = [...new Set(teamDocs.map(t => t.class || '').filter(Boolean))];
  const classes = [...order.filter(c => present.includes(c)), ...present.filter(c => !order.includes(c))];
  const out = [];
  for (const cls of classes) {
    [...new Set(teamDocs.filter(t => (t.class || '') === cls).map(t => t.gender || ''))].sort((a, b) => genderRank(a) - genderRank(b))
      .forEach(gender => out.push({ type: 'team', cls, gender, key: `team|${cls}|${gender}`, label: `団体 ${cls} ${gender}` }));
  }
  return out;
}
function catsFor(phase) {
  if (phase === 'team') return teamGroups();
  const g = personGroups();
  if (phase === 'qual') return g.filter(x => ruleOf(x.type, x.cls).finalOnly !== true);
  return g.filter(x => ruleOf(x.type, x.cls).hasFinal !== false && athletes.some(a => (a.type || 'individual') === x.type && clsOf(a) === x.cls && (a.gender || '') === x.gender && a.finalOrder != null));
}

// ---------- 順位の計算 ----------
function buildRows(g, phase) {
  const rule = ruleOf(g.type, g.cls);
  const numPre = rule.qualifyingRoutines ?? tour.qualifyingRoutines ?? 1;
  const scoreMode = rule.scoreMode || 'best';
  const finalScoreMode = rule.finalScoreMode ?? 'zero';
  let list = athletes.filter(a => (a.type || 'individual') === g.type && clsOf(a) === g.cls && (a.gender || '') === g.gender);
  if (phase === 'final') list = list.filter(a => a.finalOrder != null);
  const rows = list.map(a => {
    const m = byAth[a.id] || {};
    const p1r = m.pre1 || null, p2r = m.pre2 || null, fr = m.final || null;
    const p1 = p1r?.officialTotal ?? null, p2 = p2r?.officialTotal ?? null, fin = fr?.officialTotal ?? null;
    const qualPart = calcQualifyingScore(p1, p2, numPre, scoreMode);
    let qualScore, tbSum = null, tb;
    if (phase === 'qual') { qualScore = qualPart; ({ tbSum, tb } = calcQualifyingTb(p1, p2, p1r, p2r, numPre, scoreMode)); }
    else { qualScore = calcFinalScore(qualPart, fin, finalScoreMode); tb = extractTbScores(fr); }
    const isDns = phase === 'qual' ? (p1r?.dns === true || p2r?.dns === true) : fr?.dns === true;
    if (isDns) qualScore = null;
    return { a, p1r, p2r, fr, qualScore, qualPart, tbSum, tb, isDns, numPre, scoreMode, rule };
  });
  const ranked = rows.filter(r => !r.isDns && r.qualScore != null).sort(compareRankEntries);
  assignRanks(ranked);
  const waiting = rows.filter(r => !r.isDns && r.qualScore == null);
  const dns = rows.filter(r => r.isDns);
  return { ranked, waiting, dns, total: rows.length, numPre, scoreMode, rule };
}

// 団体
function teamHtml(g) {
  const myTeams = teamDocs.filter(t => (t.class || '') === g.cls && (t.gender || '') === g.gender);
  const rule = ruleOf('individual', g.cls);
  const scoreMode = rule.scoreMode || 'best';
  const numPre = rule.qualifyingRoutines ?? tour.qualifyingRoutines ?? 1;
  const athMap = Object.fromEntries(athletes.map(a => [a.id, a]));
  const ZERO = { total: 0, T: 0, H: 0, D: 0 };
  const comp = r => r?.dns === true ? ZERO : { total: r?.officialTotal ?? 0, T: r?.tof ?? 0, H: r?.hd?.total ?? 0, D: r?.officialD ?? 0 };
  const top3 = arr => [...arr].sort((a, b) => b - a).slice(0, 3).reduce((s, v) => s + v, 0);
  const teams = myTeams.map(t => {
    const members = (t.memberIds || []).map(id => {
      const ath = athMap[id], p1raw = byAth[id]?.pre1, p2raw = byAth[id]?.pre2;
      const p1 = p1raw ? comp(p1raw) : ZERO, p2 = p2raw ? comp(p2raw) : ZERO;
      const base = { id, name: ath?.name1 || id, p1, p2, has1: p1raw != null, has2: p2raw != null };
      if (scoreMode === 'best') { const use2 = p2.total > p1.total; const ad = use2 ? p2 : p1; return { ...base, score: ad.total, T: ad.T, H: ad.H, D: ad.D, adopt: use2 ? 2 : 1 }; }
      return base;
    });
    let score, T, H, D;
    if (scoreMode === 'best') {
      score = top3(members.map(m => m.score)); T = top3(members.map(m => m.T)); H = top3(members.map(m => m.H)); D = top3(members.map(m => m.D));
      members.sort((a, b) => b.score - a.score); members.forEach((m, i) => { m.counted = i < 3; });
    } else {
      score = top3(members.map(m => m.p1.total)) + top3(members.map(m => m.p2.total));
      T = top3(members.map(m => m.p1.T)) + top3(members.map(m => m.p2.T)); H = top3(members.map(m => m.p1.H)) + top3(members.map(m => m.p2.H)); D = top3(members.map(m => m.p1.D)) + top3(members.map(m => m.p2.D));
      const i1 = [...members].sort((a, b) => b.p1.total - a.p1.total).slice(0, 3).map(m => m.id);
      const i2 = [...members].sort((a, b) => b.p2.total - a.p2.total).slice(0, 3).map(m => m.id);
      members.forEach(m => { m.c1 = i1.includes(m.id); m.c2 = i2.includes(m.id); });
      members.sort((a, b) => (b.p1.total + b.p2.total) - (a.p1.total + a.p2.total));
    }
    return { name: t.teamName || '–', members, score, T, H, D };
  });
  teams.sort((a, b) => b.score - a.score || b.T - a.T || b.H - a.H || b.D - a.D);
  let rank = 0, prev = null;
  teams.forEach((t, i) => { const k = `${t.score}|${t.T}|${t.H}|${t.D}`; if (k !== prev) { rank = i + 1; prev = k; } t.rank = rank; });
  const two = numPre >= 2;
  const cell = (has, v, use) => `<span><i style="font-style:normal" class="${use ? 'use' : 'drop'}">${has ? f2(v) : '–'}</i></span>`;
  const cards = teams.map((t, idx) => `<div class="card"><div class="top"><div class="rank${medal(t.rank)}">${t.rank}</div><div class="who"><div class="name">${esc(t.name)}</div></div>
      <div class="tot"><b>${f2(t.score)}</b><span>${idx > 0 ? '-' + (teams[0].score - t.score).toFixed(2) : ''}</span></div></div>
      <div class="mem h"><span>選手</span><span>${two ? '1本目' : '得点'}</span><span>${two ? '2本目' : ''}</span></div>
      ${t.members.map(m => scoreMode === 'best'
        ? `<div class="mem"><span>${esc(m.name)}</span>${two ? cell(m.has1, m.p1.total, m.counted && m.adopt === 1) + cell(m.has2, m.p2.total, m.counted && m.adopt === 2) : cell(m.has1, m.score, m.counted) + '<span></span>'}</div>`
        : `<div class="mem"><span>${esc(m.name)}</span>${cell(m.has1, m.p1.total, m.c1)}${two ? cell(m.has2, m.p2.total, m.c2) : '<span></span>'}</div>`).join('')}
    </div>`).join('');
  return { html: cards + '<div class="cap" style="text-align:center;margin-top:12px;">ハイライト枠 = 団体得点に採用（上位3名）</div>', count: teams.length };
}

// ---------- 描画 ----------
function ensureValidSelection() {
  if (!state.phase) state.phase = 'qual';
  const cats = catsFor(state.phase);
  if (!cats.length) { state.cat = null; return; }
  if (!state.cat || !cats.some(c => c.key === state.cat)) {
    const parts = (state.cat || '').split('|');
    const fallback = cats.find(c => c.cls === parts[1] && c.gender === parts[2]) || cats[0];
    state.cat = fallback.key;
  }
}

function renderNav() {
  ensureValidSelection();
  $('phases').innerHTML = PHASES.map(p => `<button type="button" data-phase="${p.id}" aria-pressed="${state.phase === p.id}">${p.label}</button>`).join('');
  const cats = catsFor(state.phase);
  const groups = [];
  cats.forEach(c => { let gr = groups.find(x => x.type === c.type); if (!gr) groups.push(gr = { type: c.type, items: [] }); gr.items.push(c); });
  $('cats').innerHTML = groups.length
    ? groups.map(gr => `<div class="grp"><div class="grp-h">${typeLabel(gr.type)}</div><div class="chips">${gr.items.map(c => `<button class="chip" type="button" data-cat="${esc(c.key)}" aria-pressed="${state.cat === c.key}">${esc(c.cls)} ${esc(c.gender)}</button>`).join('')}</div></div>`).join('')
    : '<div class="cap">この種別に該当するカテゴリーがありません</div>';
}

async function renderOut() {
  const out = $('out');
  if (!state.phase || !state.cat) {
    out.innerHTML = `<div class="empty"><b>フェーズと種目を選んでください</b><span>選ぶと、順位表が表示されます</span></div>`; return;
  }
  const g = catsFor(state.phase).find(c => c.key === state.cat);
  if (!g) { out.innerHTML = ''; return; }
  if (!resultsLoaded) { out.innerHTML = '<div class="empty"><span>読み込み中…</span></div>'; await loadResults(); }
  const phaseLabel = PHASES.find(p => p.id === state.phase).label;
  if (state.phase === 'team') {
    const t = teamHtml(g);
    out.innerHTML = `<div class="sec"><div class="sec-t"><div class="sec-title-grp"><h2>${esc(g.label)}</h2><small>予選集計</small></div><span class="badge">${t.count}チーム</span></div></div>` + t.html;
    return;
  }
  const d = buildRows(g, state.phase);
  const done = d.ranked.length + d.dns.length;
  const leader = d.ranked[0]?.qualScore;
  const pct = d.total ? Math.round(done / d.total * 100) : 0;

  const listHtml = d.ranked.map(r => personRow(r, g, state.phase, d.ranked.indexOf(r), leader)).join('')
    + d.waiting.map(r => waitingRow(r, '演技待ち')).join('')
    + d.dns.map(r => waitingRow(r, '棄権')).join('');

  out.innerHTML = `
    <div class="sec">
      <div class="sec-t">
        <div class="sec-title-grp"><h2>${esc(g.label)}</h2><small>${esc(phaseLabel)}</small></div>
        <span class="badge">${done}/${d.total}名 確定</span>
      </div>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </div>
    <div id="cards-list">${listHtml}</div>`;

}

document.addEventListener('click', async e => {
  const p = e.target.closest('[data-phase]'), c = e.target.closest('[data-cat]'), t = e.target.closest('[data-toggle]');
  if (p) { state.phase = p.dataset.phase; state.open.clear(); renderNav(); renderOut(); }
  else if (c && !c.disabled) { state.cat = c.dataset.cat; state.open.clear(); renderNav(); renderOut(); }
  else if (t) { const k = t.dataset.toggle; state.open.has(k) ? state.open.delete(k) : state.open.add(k); renderOut(); }
});

async function refresh() { await loadResults(); if (state.phase && state.cat) renderOut(); }
$('btn-refresh').addEventListener('click', refresh);
$('btn-auto').addEventListener('click', () => {
  state.auto = !state.auto;
  $('btn-auto').setAttribute('aria-pressed', state.auto);
  $('btn-auto').textContent = '自動更新 ' + (state.auto ? 'ON' : 'OFF');
  clearInterval(state.timer);
  if (state.auto) state.timer = setInterval(refresh, 30000);
});

try {
  await loadBase();
  await loadResults();
  renderNav();
  renderOut();
} catch (err) {
  $('t-name').textContent = 'データ読み込みエラー';
  $('out').innerHTML = `<div class="err">${esc(err.message || err)}</div>`;
}
</script>
</body>
</html>
