<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>公開スコアページ レイアウト確認（サンプル）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2f0eb; --card: #fff; --soft: #f6f4ef; --line: #e6e2d9;
    --ink: #172033; --sub: #5d6678; --mute: #9aa1ae;
    --hero: #12203d; --hero2: #1d3560; --sel: #12203d; --on-sel: #fff;
    --hl: #f2b01e; --on-hl: #2a1d00; --hl-soft: #fdf3d7;
    --ok: #1f8a52; --ok-soft: #e5f4ea; --link: #2b5fc7;
    --num: "Barlow", "DIN 2014", system-ui, sans-serif;
  }
  :root[data-theme="red"] { --hero: #4a0f1d; --hero2: #7a1a30; --sel: #8f1730; }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1017; --card: #171b25; --soft: #1f2431; --line: #2a3040;
      --ink: #eceef3; --sub: #a4adbd; --mute: #6b7487;
      --hero: #0a1226; --hero2: #14264a; --sel: #f2b01e; --on-sel: #2a1d00;
      --hl-soft: #3a2f12; --ok: #5fcf93; --ok-soft: #14352a; --link: #8db4ff;
    }
    :root[data-theme="red"] { --hero: #2b0a12; --hero2: #4a1020; --sel: #f2b01e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Noto Sans JP", system-ui, -apple-system, "Hiragino Sans", sans-serif; -webkit-text-size-adjust: 100%; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 12px 48px; }
  .sample-bar { background: var(--hl-soft); color: var(--sub); font-size: 11px; text-align: center; padding: 6px 12px; }

  /* ヘッダー: 紺の地に、トランポリンの跳ね上がりの軌道を薄い線で */
  .hero { position: relative; overflow: hidden; background: linear-gradient(135deg, var(--hero), var(--hero2)); color: #fff; border-radius: 0 0 22px 22px; padding: 18px 0 16px; }
  .hero .arc { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .hero .arc path { fill: none; stroke: #fff; stroke-opacity: .1; stroke-width: 2; }
  .hero .arc circle { fill: var(--hl); fill-opacity: .55; }
  .hero-in { position: relative; max-width: 640px; margin: 0 auto; padding: 0 16px; }
  .kicker { font-family: var(--num); font-size: 11px; font-weight: 600; letter-spacing: .14em; color: var(--hl); }
  .hero h1 { font-size: 19px; line-height: 1.4; margin: 4px 0 0; font-weight: 700; }
  .hero .meta { font-size: 12px; color: rgba(255,255,255,.72); margin-top: 3px; }
  .hero .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .notice { font-size: 11px; padding: 4px 9px; border-radius: 999px; background: rgba(242,176,30,.16); color: #ffd277; border: 1px solid rgba(242,176,30,.4); }
  .ctl { display: flex; align-items: center; gap: 6px; }
  .ctl button { font: inherit; font-size: 12px; padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.08); color: #fff; cursor: pointer; }
  .ctl button[aria-pressed="true"] { background: var(--hl); color: var(--on-hl); border-color: var(--hl); font-weight: 700; }
  .stamp { font-family: var(--num); font-size: 11px; color: rgba(255,255,255,.55); margin-top: 8px; }

  /* ナビ: フェーズは3分割のスイッチ、種目は種別ごとにまとめたチップ */
  .nav-label { font-size: 11px; font-weight: 700; color: var(--sub); letter-spacing: .04em; margin: 18px 2px 6px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
  .seg button { font: inherit; font-size: 15px; font-weight: 700; border: 0; border-radius: 10px; padding: 11px 0; background: transparent; color: var(--ink); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--sel); color: var(--on-sel); }
  .grp { margin-top: 10px; }
  .grp-h { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; color: var(--sub); margin: 0 2px 6px; }
  .grp-h::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: inherit; font-size: 13px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; min-height: 38px; }
  .chip[aria-pressed="true"] { background: var(--sel); color: var(--on-sel); border-color: var(--sel); font-weight: 700; }
  .chip:disabled { color: var(--mute); border-style: dashed; background: transparent; cursor: default; }

  .empty { background: var(--card); border: 1px dashed var(--line); border-radius: 16px; padding: 32px 16px; text-align: center; margin-top: 16px; }
  .empty b { display: block; font-size: 15px; }
  .empty span { font-size: 12px; color: var(--sub); }

  /* 見出し */
  .sec { margin: 20px 2px 10px; }
  .sec-t { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
  .sec small { display: block; font-size: 12px; color: var(--sub); font-weight: 500; }
  .sec h2 { font-size: 22px; margin: 0; font-weight: 700; line-height: 1.25; }
  .badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); white-space: nowrap; }
  .bar { height: 4px; border-radius: 4px; background: var(--line); margin-top: 10px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--hl); border-radius: 4px; }

  /* 順位の行 */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin-bottom: 10px; position: relative; overflow: hidden; }
  .card.q-on::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--ok); }
  .card.dim { opacity: .55; }
  .top { display: flex; align-items: center; gap: 12px; }
  .rank { width: 32px; height: 32px; border-radius: 50%; background: var(--soft); display: flex; align-items: center; justify-content: center; font-family: var(--num); font-weight: 700; font-size: 16px; flex: none; }
  .rank.m1 { background: #f3c64f; color: #3a2a00; }
  .rank.m2 { background: #d5dae3; color: #2b3342; }
  .rank.m3 { background: #e3b08a; color: #3b2310; }
  .who { flex: 1; min-width: 0; }
  .name { font-size: 16px; font-weight: 700; overflow-wrap: anywhere; line-height: 1.35; }
  .club { font-size: 12px; color: var(--sub); overflow-wrap: anywhere; }
  .q { display: inline-block; font-family: var(--num); font-size: 11px; font-weight: 700; color: #fff; background: var(--ok); border-radius: 4px; padding: 0 6px; margin-left: 6px; vertical-align: 2px; }
  @media (prefers-color-scheme: dark) { .q { color: #06241a; } }
  .tot { text-align: right; flex: none; }
  .tot b { display: block; font-family: var(--num); font-size: 30px; font-weight: 700; line-height: 1; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .tot span { display: block; font-family: var(--num); font-size: 12px; color: var(--sub); margin-top: 3px; }

  /* 本ごとの得点 */
  .rt { margin-top: 8px; background: var(--soft); border-radius: 10px; padding: 8px 10px; }
  .rt.use { background: var(--hl-soft); box-shadow: inset 3px 0 0 var(--hl); }
  .rt.off { opacity: .7; }
  .rt-h { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--sub); }
  .rt-h b { font-family: var(--num); font-size: 17px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .tag { font-style: normal; font-size: 10px; font-weight: 700; background: var(--hl); color: var(--on-hl); border-radius: 4px; padding: 1px 6px; margin-left: 6px; }
  .rt-g { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); text-align: center; font-size: 10px; color: var(--sub); margin-top: 6px; }
  .rt-g b { display: block; font-family: var(--num); font-size: 15px; color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .more { display: block; width: 100%; margin-top: 10px; font: inherit; font-size: 13px; color: var(--link); background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 0 2px; cursor: pointer; text-align: center; }
  table.sk { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 4px; font-family: var(--num); font-variant-numeric: tabular-nums; }
  table.sk th, table.sk td { padding: 5px 4px; text-align: right; font-weight: 500; }
  table.sk tr:nth-child(even) td { background: var(--soft); }
  table.sk th { color: var(--sub); font-size: 10px; font-family: "Noto Sans JP", system-ui, sans-serif; font-weight: 700; border-bottom: 1px solid var(--line); }
  table.sk th:first-child, table.sk td:first-child, table.sk th:nth-child(2), table.sk td:nth-child(2) { text-align: left; }
  table.sk td:first-child { color: var(--sub); }
  table.sk tr.land td { border-top: 1px solid var(--line); font-weight: 700; }
  .cap { font-size: 12px; color: var(--sub); font-weight: 700; margin-top: 12px; }
  .cap.n { font-weight: 400; }
  .na { color: var(--mute); }

  /* 団体 */
  .mem { display: grid; grid-template-columns: 1fr 66px 66px; gap: 4px; font-size: 14px; padding: 6px 0; border-top: 1px solid var(--line); align-items: center; font-variant-numeric: tabular-nums; }
  .mem.h { font-size: 10px; color: var(--sub); border-top: 0; padding-top: 10px; font-weight: 700; }
  .mem span:not(:first-child) { text-align: right; font-family: var(--num); font-size: 15px; }
  .mem.h span:not(:first-child) { font-family: inherit; font-size: 10px; }
  .mem .use { background: var(--hl-soft); box-shadow: inset 0 -2px 0 var(--hl); border-radius: 5px; padding: 1px 6px; font-weight: 700; }
  .mem .drop { color: var(--mute); }
  .err { color: #c0392b; font-size: 13px; padding: 16px; }
</style>
</head>

// ---------- 共通の計算（shared.js の順位・難度の計算を、そのまま収録） ----------
function round1(v) {
    return Math.round(v * 10) / 10;
}

function extractTbScores(result) {
  if (!result) return { tof: null, hd: null, diff: null };
  return {
    tof:  result.tof                    ?? null,
    hd:   result.hd?.total              ?? null,
    diff: result.officialD ?? result.dd ?? null   // dd は旧フィールド名フォールバック
  };
}

/**
 * 予選スコア計算（numPre / scoreMode に応じて）
 * @param {number|null} pre1
 * @param {number|null} pre2
 * @param {number} numPre     予選本数
 * @param {'best'|'total'} scoreMode
 * @returns {number|null}
 */
function calcQualifyingScore(pre1, pre2, numPre, scoreMode) {
  if (numPre === 1) return pre1 ?? null;
  if (pre1 != null && pre2 != null)
    return scoreMode === 'total' ? pre1 + pre2 : Math.max(pre1, pre2);
  return pre1 ?? pre2 ?? null;
}

/**
 * 予選タイブレーク用データ計算
 *   best採用: tbSum = 2本合計、tb = ベスト演技の T/H/D
 *   total採用: tbSum = null（qualScore が既に合計）、tb = 2本合計の T/H/D
 * @param {number|null} pre1
 * @param {number|null} pre2
 * @param {object|null} pre1r  pre1 の Firestore result document data
 * @param {object|null} pre2r  pre2 の Firestore result document data
 * @param {number} numPre
 * @param {'best'|'total'} scoreMode
 * @returns {{ tbSum: number|null, tb: { tof, hd, diff } }}
 */
function calcQualifyingTb(pre1, pre2, pre1r, pre2r, numPre, scoreMode) {
  if (numPre < 2 || pre1 == null || pre2 == null) {
    return { tbSum: null, tb: extractTbScores(pre1 != null ? pre1r : pre2r) };
  }
  if (scoreMode === 'best') {
    return {
      tbSum: pre1 + pre2,
      tb:    extractTbScores(pre1 >= pre2 ? pre1r : pre2r)
    };
  } else {
    const s1 = extractTbScores(pre1r), s2 = extractTbScores(pre2r);
    return {
      tbSum: null,
      tb: {
        tof:  (s1.tof  ?? 0) + (s2.tof  ?? 0),
        hd:   (s1.hd   ?? 0) + (s2.hd   ?? 0),
        diff: (s1.diff ?? 0) + (s2.diff ?? 0)
      }
    };
  }
}

/**
 * 決勝スコア計算（finalScoreMode に応じて）
 * @param {number|null} qualPre       予選スコア（combined モード時に使用）
 * @param {number|null} final         決勝スコア
 * @param {'zero'|'combined'} finalScoreMode
 * @returns {number|null}
 */
function calcFinalScore(qualPre, final, finalScoreMode) {
  if (finalScoreMode === 'combined') {
    if (qualPre != null && final != null) return qualPre + final;
    return final ?? qualPre ?? null;
  }
  // zero: 決勝スコア単体（未確定時は null → 末尾へ）
  return final ?? null;
}

/**
 * ランキング用ソート比較関数（降順、null 末尾）
 * TR2025 §4.4.4: 主スコア → 2本合計（best採用時のみ）→ T → H → D
 *
 * 各エントリは以下を持つこと:
 *   { qualScore: number|null, tbSum: number|null, tb: { tof, hd, diff } }
 *
 * @returns {number}  負 = a が上位
 */
function compareRankEntries(a, b) {
  if (a.qualScore == null && b.qualScore == null) return 0;
  if (a.qualScore == null) return  1;
  if (b.qualScore == null) return -1;
  // ① 主スコア（小数第 3 位で比較）
  const as2 = Math.round(a.qualScore * 1000) / 1000;
  const bs2 = Math.round(b.qualScore * 1000) / 1000;
  if (bs2 !== as2) return bs2 - as2;
  // ② 2本合計（best採用時のみ; total採用時は tbSum = null なので skip）
  if (a.tbSum != null && b.tbSum != null && Math.abs(b.tbSum - a.tbSum) > 1e-9) return b.tbSum - a.tbSum;
  // ③ T（個人=ToF / シンクロ=Syn）→ H → D
  for (const k of ['tof', 'hd', 'diff']) {
    const va = a.tb?.[k], vb = b.tb?.[k];
    if (va != null && vb != null && Math.abs(vb - va) > 1e-9) return vb - va;
  }
  return 0;
}

/**
 * ランク番号割り当て（同点タイ対応）
 * compareRankEntries でソート済みの配列を受け取り、各エントリに .rank を付与する
 * @param {Array} entries  mutable, ソート済み
 * @returns {Array}  同一参照（チェーン用）
 */
function assignRanks(entries) {
  entries.forEach((r, idx) => {
    if (idx === 0) { r.rank = 1; return; }
    const prev = entries[idx - 1];
    if (r.qualScore == null || prev.qualScore == null) { r.rank = idx + 1; return; }
    // タイ判定はソート基準 (compareRankEntries) と完全一致させる
    // （独自の === 比較だと浮動小数誤差でソートと食い違い、同着の順位がずれることがある）
    r.rank = compareRankEntries(r, prev) === 0 ? prev.rank : idx + 1;
  });
  return entries;
}

/**
 * トランポリン競技ボーナス点計算 (FIG規則)
 *   男子: 5本超のトリプル 1本につき +0.3（6本目以降）
 *   女子・混合: 2本超のトリプル 1本につき +0.3（3本目以降）
 */
function calcBonus(gender, tripleCount) {
  if (gender === '男子' && tripleCount > 5) return (tripleCount - 5) * 0.3;
  if ((gender === '女子' || gender === '混合') && tripleCount >= 3) return (tripleCount - 2) * 0.3;
  return 0;
}

// ============================================================
//  難度（DD）計算（entry / admin_card_check / judge_cjp / judge_panel / display / score_viewer 共用）
//  以前は各ページに同じ計算が別々に書かれていて、ルールの追加（上限の丸め込み/失格など）のたびに
//  全ページの修正が必要だった。クラスルールの読み取りと計算本体はここに集約し、
//  各ページは結果を自分の画面の色・文言に反映するだけにする。
// ============================================================

/**
 * クラスルールから難度に関する設定を読み取る。
 * @param {object} rule   classRules[type][class]（未設定は {}）
 * @param {string} round  'pre1' | 'pre2' | 'final'（指定難度は予選1本目のみ有効なため）
 * @returns {{
 *   perSkillDDCap: number|null,  1技あたり難度上限（設定なし=null。失格モードでも値は入る）
 *   perSkillDQ: boolean,         true=上限超過は丸め込まず失格
 *   routineDDCap: number|null,   構成あたり難度上限
 *   routineDQ: boolean,
 *   minRoutineDD: number|null,   難度下限
 *   designatedDDCount: number    指定難度本数（-1=無効, 0=全DD0, 1以上=N本指定。2本合計・予選1本目のみ有効）
 * }}
 */
function parseDDRule(rule, round) {
  const r = rule || {};
  const num = v => { const n = parseFloat(v); return (v != null && !isNaN(n)) ? n : null; };
  const rawDesig = (r.designatedDDCount != null && r.designatedDDCount >= 0) ? r.designatedDDCount : -1;
  const desigValid = rawDesig >= 0 && r.qualifyingRoutines === 2 && r.scoreMode === 'total' && round === 'pre1';
  return {
    perSkillDDCap: num(r.perSkillDDCap),
    perSkillDQ:    r.perSkillDDCapMode === 'disqualify',
    routineDDCap:  num(r.routineDDCap),
    routineDQ:     r.routineDDCapMode === 'disqualify',
    minRoutineDD:  num(r.minRoutineDD),
    designatedDDCount: desigValid ? rawDesig : -1,
  };
}

/**
 * 競技カード（最大10技）の難度を計算する。
 *  - 同じ技（key が同じ）は2回目以降 0.0 点（基礎点・トリプル数に含めない）
 *  - 指定難度: count<0 は全技有効、0 は全技無効、1以上は designatedIndices に含まれる技のみ有効
 *  - 1技あたり上限: 超えた技は上限値で計算（失格モードのクラスは丸め込まず overCap だけ立てる）
 *  - 構成上限: 合計（基礎点＋ボーナス）が超えたら上限で頭打ち（失格モードは丸め込まず routineOverDQ を立てる）
 *  - 上限との比較は小数第1位に丸めてから行う（浮動小数の誤差で「ちょうど上限」が超過扱いにならないように）
 *
 * @param {object} p
 * @param {Array<{key:string, dd:number|null, isTriple?:boolean}|null>} p.skills  技（空欄・未解決は null）。10要素まで
 * @param {string} p.gender             ボーナス計算用（'男子'|'女子'|'混合'）
 * @param {object} p.ddRule             parseDDRule の戻り値
 * @param {number[]|Set<number>} [p.designatedIndices]  指定難度に選んだ技の位置（0始まり）
 * @param {number} [p.validLimit=10]    有効本数（これ以降の技は計算・重複判定の対象外。中断時など）
 * @returns {{ rows:Array, baseDD:number, tripleCount:number, bonus:number, rawTotal:number, total:number,
 *             routineOverCap:boolean, routineCapped:boolean, routineOverDQ:boolean, skillOverCapDQ:boolean }}
 *   rows[i]: { index, blank, beyondLimit, skill, isDesignated, isDupRow, isDupZero, overCap, isCapped, counted, usedDD }
 */
function calcCardDD({ skills, gender, ddRule, designatedIndices = [], validLimit = 10 }) {
  const { perSkillDDCap: pc, perSkillDQ, routineDDCap: rc, routineDQ, designatedDDCount: dc } = ddRule;
  const desigSet = designatedIndices instanceof Set ? designatedIndices : new Set(designatedIndices);

  const keyCounts = {};
  for (let i = 0; i < 10 && i < validLimit; i++) {
    const s = skills[i];
    if (s && s.key) keyCounts[s.key] = (keyCounts[s.key] || 0) + 1;
  }

  const rows = [], seen = new Set();
  let baseDD = 0, tripleCount = 0, skillOverCapDQ = false;
  for (let i = 0; i < 10; i++) {
    const s = skills[i] || null;
    const isDesignated = dc < 0 || (dc > 0 && desigSet.has(i));
    const row = { index: i, blank: !s, beyondLimit: i >= validLimit, skill: s, isDesignated,
                  isDupRow: false, isDupZero: false, overCap: false, isCapped: false, counted: false, usedDD: 0 };
    rows.push(row);
    if (row.beyondLimit || !s) continue;

    row.isDupRow  = !!s.key && keyCounts[s.key] > 1;
    row.isDupZero = !!s.key && seen.has(s.key);
    if (s.key) seen.add(s.key);

    const dd = s.dd;
    row.overCap  = !row.isDupZero && pc != null && dd != null && round1(dd) > pc;
    row.isCapped = row.overCap && !perSkillDQ;
    row.usedDD   = row.isDupZero ? 0 : (row.isCapped ? pc : (dd ?? 0));
    row.counted  = isDesignated && !row.isDupZero;
    if (row.counted) {
      if (dd != null) baseDD += row.usedDD;
      if (s.isTriple) tripleCount++;
      if (row.overCap && perSkillDQ) skillOverCapDQ = true;
    }
  }

  const bonus = calcBonus(gender || '', tripleCount);
  const rawTotal = baseDD + bonus;
  const routineOverCap = rc != null && round1(rawTotal) > rc;
  const routineCapped  = routineOverCap && !routineDQ;
  const routineOverDQ  = routineOverCap && routineDQ;
  return { rows, baseDD, tripleCount, bonus, rawTotal, total: routineCapped ? rc : rawTotal,
           routineOverCap, routineCapped, routineOverDQ, skillOverCapDQ };
}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const genderRank = g => g === '男子' ? 0 : g === '女子' ? 1 : 2;
const f1 = v => v != null ? Number(v).toFixed(1) : null;
const f2 = v => v != null ? Number(v).toFixed(2) : null;
const f2r = v => v != null ? (Math.round(Number(v) * 100 + 1e-6) / 100).toFixed(2) : null;
const dash = '<span class="na">–</span>';
const medal = r => r <= 3 ? ` m${r}` : '';

const PHASES = [{ id: 'qual', label: '予選' }, { id: 'final', label: '決勝' }, { id: 'team', label: '団体' }];
const state = { phase: null, cat: null, open: new Set(), auto: false, timer: null };
let tour, athletes = [], teamDocs = [], byAth = {}, resultsLoaded = false, skillMaster = null;

// ---------- データ読み込み ----------
async function loadBase() {
  tour = DATA.tour; athletes = DATA.athletes.map(x => ({ ...x })); teamDocs = DATA.teams; skillMaster = DATA.skills;
  if (tour.displaySettings?.colorTheme === 'red') document.documentElement.dataset.theme = 'red';

  $('t-meta').textContent = [tour.venue, range].filter(Boolean).join(' · ');
}
async function loadResults() {

  DATA.results.forEach(r => { (byAth[r.athleteId] ||= {})[r.round] = r; });
  resultsLoaded = true;
  const n = new Date(DATA.snapshotAt); $('stamp').textContent = 'SNAPSHOT ' + (n.getMonth() + 1) + '/' + n.getDate() + ' ' + [n.getHours(), n.getMinutes()].map(x => String(x).padStart(2, '0')).join(':');
}

// ---------- グループ ----------
const ruleOf = (type, cls) => ((tour.classRules || {})[type] || {})[cls] || {};
const typeLabel = t => t === 'synchro' ? 'シンクロ' : t === 'team' ? '団体' : '個人';
const clsOf = a => a.class || a.category || '';
function classOrder(type) {
  const defs = Array.isArray(tour.classes) ? tour.classes : (tour.classes?.[type] || tour.classes?.individual || []);
  return defs.slice().sort((a, b) => (a.display_order ?? 99) - (b.display_order ?? 99)).map(c => c.name);
}
function personGroups() {
  const out = [];
  for (const type of ['individual', 'synchro']) {
    const ath = athletes.filter(a => (a.type || 'individual') === type);
    const present = [...new Set(ath.map(clsOf).filter(Boolean))];
    const order = classOrder(type);
    const classes = [...order.filter(c => present.includes(c)), ...present.filter(c => !order.includes(c))];
    for (const cls of classes) {
      const genders = [...new Set(ath.filter(a => clsOf(a) === cls).map(a => a.gender || '').filter(Boolean))].sort((a, b) => genderRank(a) - genderRank(b));
      genders.forEach(gender => out.push({ type, cls, gender, key: `${type}|${cls}|${gender}`, label: `${typeLabel(type)} ${cls} ${gender}` }));
    }
  }
  return out;
}
function teamGroups() {
  const order = classOrder('individual');
  const present = [...new Set(teamDocs.map(t => t.class || '').filter(Boolean))];
  const classes = [...order.filter(c => present.includes(c)), ...present.filter(c => !order.includes(c))];
  const out = [];
  for (const cls of classes) {
    [...new Set(teamDocs.filter(t => (t.class || '') === cls).map(t => t.gender || ''))].sort((a, b) => genderRank(a) - genderRank(b))
      .forEach(gender => out.push({ type: 'team', cls, gender, key: `team|${cls}|${gender}`, label: `団体 ${cls} ${gender}` }));
  }
  return out;
}
function catsFor(phase) {
  if (phase === 'team') return teamGroups();
  const g = personGroups();
  if (phase === 'qual') return g.filter(x => ruleOf(x.type, x.cls).finalOnly !== true);
  return g.filter(x => ruleOf(x.type, x.cls).hasFinal !== false && athletes.some(a => (a.type || 'individual') === x.type && clsOf(a) === x.cls && (a.gender || '') === x.gender && a.finalOrder != null));
}

// ---------- 順位の計算（ranking.html と同じ共通関数） ----------
function buildRows(g, phase) {
  const rule = ruleOf(g.type, g.cls);
  const numPre = rule.qualifyingRoutines ?? tour.qualifyingRoutines ?? 1;
  const scoreMode = rule.scoreMode || 'best';
  const finalScoreMode = rule.finalScoreMode ?? 'zero';
  let list = athletes.filter(a => (a.type || 'individual') === g.type && clsOf(a) === g.cls && (a.gender || '') === g.gender);
  if (phase === 'final') list = list.filter(a => a.finalOrder != null);
  const rows = list.map(a => {
    const m = byAth[a.id] || {};
    const p1r = m.pre1 || null, p2r = m.pre2 || null, fr = m.final || null;
    const p1 = p1r?.officialTotal ?? null, p2 = p2r?.officialTotal ?? null, fin = fr?.officialTotal ?? null;
    const qualPart = calcQualifyingScore(p1, p2, numPre, scoreMode);
    let qualScore, tbSum = null, tb;
    if (phase === 'qual') { qualScore = qualPart; ({ tbSum, tb } = calcQualifyingTb(p1, p2, p1r, p2r, numPre, scoreMode)); }
    else { qualScore = calcFinalScore(qualPart, fin, finalScoreMode); tb = extractTbScores(fr); }
    const isDns = phase === 'qual' ? (p1r?.dns === true || p2r?.dns === true) : fr?.dns === true;
    if (isDns) qualScore = null;
    return { a, p1r, p2r, fr, qualScore, qualPart, tbSum, tb, isDns, numPre, scoreMode, rule };
  });
  const ranked = rows.filter(r => !r.isDns && r.qualScore != null).sort(compareRankEntries);
  assignRanks(ranked);
  const waiting = rows.filter(r => !r.isDns && r.qualScore == null);
  const dns = rows.filter(r => r.isDns);
  return { ranked, waiting, dns, total: rows.length, numPre, scoreMode, rule };
}

// ---------- 表示 ----------
const nameOf = a => a.type === 'synchro' ? `${esc(a.name1 || '–')} / ${esc(a.name2 || '–')}` : esc(a.name1 || '–');

function routineCard(label, res, synchro, adopted, dimmed) {

    <div class="rt-g"><span>D<b>${c(f1(res.officialD))}</b></span><span>E<b>${c(e)}</b></span><span>${synchro ? 'Syn' : 'ToF'}<b>${c(f2(res.tof))}</b></span><span>HD<b>${c(f2(res.hd?.total))}</b></span><span>減点<b>${c(pen)}</b></span></div>

function personRow(r, g, phase, idx, leader) {

  let adoptedIdx = -1;
  if (phase === 'qual' && r.numPre >= 2 && r.scoreMode === 'best' && r.p1r && r.p2r) adoptedIdx = (r.p2r.officialTotal ?? 0) > (r.p1r.officialTotal ?? 0) ? 1 : 0;
  else if (phase === 'qual' && r.numPre >= 2 && r.scoreMode === 'best') adoptedIdx = r.p1r ? 0 : r.p2r ? 1 : -1;

// 技ごとの内訳（難度は display.html と同じく shared.js の calcCardDD で計算）

    });

    // 技ごとの ToF・HD は、E審判が最も多いパネルの保存値

      const eTxt = ed != null ? (synchro ? (ed * 10).toFixed(2) : String(Math.round(ed * 10))) : '–';
      const tof = synchro ? (hd.syn?.[i] != null ? Number(hd.syn[i]).toFixed(2) : '–') : (hd.tof?.[i] != null ? Number(hd.tof[i]).toFixed(3) : '–');
      const hdv = synchro ? ((hd.hd1?.[i] != null || hd.hd2?.[i] != null) ? `${hd.hd1?.[i] ?? '–'} / ${hd.hd2?.[i] ?? '–'}` : '–') : (hd.hd?.[i] != null ? hd.hd[i] : '–');
      body.push(`<tr><td>${i + 1}</td><td>${code}</td><td>${dd}</td><td>${eTxt}</td><td>${tof}</td><td>${hdv}</td></tr>`);
    }
    const land = vLimit < 10 ? '' : (res.officialELanding != null ? (synchro ? (res.officialELanding * 10).toFixed(2) : String(Math.round(res.officialELanding * 10))) : '–');
    body.push(`<tr class="land"><td>L</td><td>${paper ? '' : '着地'}</td><td></td><td>${land === '' ? '–' : land}</td><td></td><td></td></tr>`);
    const pens = (res.penaltyItems || []).map(p => esc(p.label || p.name || p.reason || '')).filter(Boolean);
    return `<div class="cap">${esc(lb)}</div>
      <table class="sk"><tr><th>#</th><th>${paper ? '' : '技'}</th><th>${paper ? '' : '難度'}</th><th>E減点</th><th>${synchro ? 'Syn' : 'ToF'}</th><th>HD</th></tr>${body.join('')}</table>
      ${pens.length ? `<div class="cap n">減点: ${pens.join('、')}</div>` : ''}`;
  }).join('') || '<div class="cap n">内訳のデータがありません</div>';
}

// 団体（ranking.html / display.html と同じ集計）
function teamHtml(g) {
  const myTeams = teamDocs.filter(t => (t.class || '') === g.cls && (t.gender || '') === g.gender);
  const rule = ruleOf('individual', g.cls);
  const scoreMode = rule.scoreMode || 'best';
  const numPre = rule.qualifyingRoutines ?? tour.qualifyingRoutines ?? 1;
  const athMap = Object.fromEntries(athletes.map(a => [a.id, a]));
  const ZERO = { total: 0, T: 0, H: 0, D: 0 };
  const comp = r => r?.dns === true ? ZERO : { total: r?.officialTotal ?? 0, T: r?.tof ?? 0, H: r?.hd?.total ?? 0, D: r?.officialD ?? 0 };
  const top3 = arr => [...arr].sort((a, b) => b - a).slice(0, 3).reduce((s, v) => s + v, 0);
  const teams = myTeams.map(t => {
    const members = (t.memberIds || []).map(id => {
      const ath = athMap[id], p1raw = byAth[id]?.pre1, p2raw = byAth[id]?.pre2;
      const p1 = p1raw ? comp(p1raw) : ZERO, p2 = p2raw ? comp(p2raw) : ZERO;
      const base = { id, name: ath?.name1 || id, p1, p2, has1: p1raw != null, has2: p2raw != null };
      if (scoreMode === 'best') { const use2 = p2.total > p1.total; const ad = use2 ? p2 : p1; return { ...base, score: ad.total, T: ad.T, H: ad.H, D: ad.D, adopt: use2 ? 2 : 1 }; }
      return base;
    });
    let score, T, H, D;
    if (scoreMode === 'best') {
      score = top3(members.map(m => m.score)); T = top3(members.map(m => m.T)); H = top3(members.map(m => m.H)); D = top3(members.map(m => m.D));
      members.sort((a, b) => b.score - a.score); members.forEach((m, i) => { m.counted = i < 3; });
    } else {
      score = top3(members.map(m => m.p1.total)) + top3(members.map(m => m.p2.total));
      T = top3(members.map(m => m.p1.T)) + top3(members.map(m => m.p2.T)); H = top3(members.map(m => m.p1.H)) + top3(members.map(m => m.p2.H)); D = top3(members.map(m => m.p1.D)) + top3(members.map(m => m.p2.D));
      const i1 = [...members].sort((a, b) => b.p1.total - a.p1.total).slice(0, 3).map(m => m.id);
      const i2 = [...members].sort((a, b) => b.p2.total - a.p2.total).slice(0, 3).map(m => m.id);
      members.forEach(m => { m.c1 = i1.includes(m.id); m.c2 = i2.includes(m.id); });
      members.sort((a, b) => (b.p1.total + b.p2.total) - (a.p1.total + a.p2.total));
    }
    return { name: t.teamName || '–', members, score, T, H, D };
  });
  teams.sort((a, b) => b.score - a.score || b.T - a.T || b.H - a.H || b.D - a.D);
  let rank = 0, prev = null;
  teams.forEach((t, i) => { const k = `${t.score}|${t.T}|${t.H}|${t.D}`; if (k !== prev) { rank = i + 1; prev = k; } t.rank = rank; });
  const two = numPre >= 2;
  const cell = (has, v, use) => `<span class="${use ? 'use' : 'drop'}">${has ? f2(v) : ''}</span>`;
  const cards = teams.map((t, idx) => `<div class="card"><div class="top"><div class="rank${medal(t.rank)}">${t.rank}</div><div class="who"><div class="name">${esc(t.name)}</div></div>
      <div class="tot"><b>${f2(t.score)}</b><span>${idx > 0 ? '-' + (teams[0].score - t.score).toFixed(2) : ''}</span></div></div>
      <div class="mem h"><span>選手</span><span>${two ? '1本目' : '得点'}</span><span>${two ? '2本目' : ''}</span></div>
      ${t.members.map(m => scoreMode === 'best'
        ? `<div class="mem"><span>${esc(m.name)}</span>${two ? cell(m.has1, m.p1.total, m.counted && m.adopt === 1) + cell(m.has2, m.p2.total, m.counted && m.adopt === 2) : cell(m.has1, m.score, m.counted) + '<span></span>'}</div>`
        : `<div class="mem"><span>${esc(m.name)}</span>${cell(m.has1, m.p1.total, m.c1)}${two ? cell(m.has2, m.p2.total, m.c2) : '<span></span>'}</div>`).join('')}
    </div>`).join('');
  return { html: cards + '<div class="cap n">黄色の下線 = 団体得点に採用（上位3名）</div>', count: teams.length };
}

// ---------- 描画 ----------
const secHead = (small, title, badge, pct) => `<div class="sec"><div class="sec-t"><div><small>${esc(small)}</small><h2>${esc(title)}</h2></div><span class="badge">${esc(badge)}</span></div>${pct != null ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ''}</div>`;
function renderNav() {
  $('phases').innerHTML = PHASES.map(p => `<button type="button" data-phase="${p.id}" aria-pressed="${state.phase === p.id}">${p.label}</button>`).join('');
  const cats = catsFor(state.phase || 'qual');
  const groups = [];
  cats.forEach(c => { let gr = groups.find(x => x.type === c.type); if (!gr) groups.push(gr = { type: c.type, items: [] }); gr.items.push(c); });
  $('cats').innerHTML = groups.length
    ? groups.map(gr => `<div class="grp"><div class="grp-h">${typeLabel(gr.type)}</div><div class="chips">${gr.items.map(c => `<button class="chip" type="button" data-cat="${esc(c.key)}" aria-pressed="${state.cat === c.key}" ${state.phase ? '' : 'disabled'}>${esc(c.cls)} ${esc(c.gender)}</button>`).join('')}</div></div>`).join('')
    : '<div class="cap n">この種別に該当するカテゴリーがありません</div>';
}
async function renderOut() {
  const out = $('out');
  if (!state.phase || !state.cat) {
    out.innerHTML = `<div class="empty"><b>フェーズと種目を選んでください</b><span>選ぶと、順位表が表示されます</span></div>`; return;
  }
  const g = catsFor(state.phase).find(c => c.key === state.cat);
  if (!g) { out.innerHTML = ''; return; }
  if (!resultsLoaded) { out.innerHTML = '<div class="empty"><span>読み込み中…</span></div>'; await loadResults(); }
  const phaseLabel = PHASES.find(p => p.id === state.phase).label;
  if (state.phase === 'team') {
    const t = teamHtml(g);
    out.innerHTML = secHead(g.label, '予選', `${t.count}チーム`) + t.html; return;
  }
    const d = buildRows(g, state.phase);
  const done = d.ranked.length + d.dns.length;
  const leader = d.ranked[0]?.qualScore;
  out.innerHTML = secHead(g.label, phaseLabel, `${done}/${d.total}名 確定`, d.total ? Math.round(done / d.total * 100) : 0)
    + d.ranked.map((r, i) => personRow(r, g, state.phase, i, leader)).join('')
    + d.waiting.map(r => waitingRow(r, '演技待ち')).join('')
    + d.dns.map(r => waitingRow(r, '棄権')).join('');
}

document.addEventListener('click', async e => {
  const p = e.target.closest('[data-phase]'), c = e.target.closest('[data-cat]'), t = e.target.closest('[data-toggle]');
  if (p) { state.phase = p.dataset.phase; state.cat = null; state.open.clear(); renderNav(); renderOut(); }
  else if (c && !c.disabled) { state.cat = c.dataset.cat; state.open.clear(); renderNav(); renderOut(); }
  else if (t) { const k = t.dataset.toggle; state.open.has(k) ? state.open.delete(k) : state.open.add(k); renderOut(); }
});
async function refresh() { await loadResults(); if (state.phase && state.cat) renderOut(); }
$('btn-refresh').addEventListener('click', refresh);
$('btn-auto').addEventListener('click', () => {
  state.auto = !state.auto;
  $('btn-auto').setAttribute('aria-pressed', state.auto);
  $('btn-auto').textContent = '自動更新 ' + (state.auto ? 'ON' : 'OFF');
  clearInterval(state.timer);
  if (state.auto) state.timer = setInterval(refresh, 30000);
});

try { await loadBase(); renderNav(); renderOut(); }
catch (err) { $('t-name').textContent = ''; $('out').innerHTML = `<div class="err">${esc(err.message || err)}</div>`; }
</script>
</body>
</html>
