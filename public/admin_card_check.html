<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>競技カードチェック - Trampoline Scoring System</title>
    <style>
        :root { --primary: #37474f; --accent: #1a73e8; --bg: #eceff1; --status-none: #cfd8dc; --status-submitted: #0288d1; --status-warning: #f57c00; --status-ok: #388e3c; --indiv-purple: #5e35b1; --sync-teal: #00897b; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 450px; background: #fff; border-right: 1px solid #cfd8dc; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 20px; background: var(--primary); color: white; position: sticky; top: 0; z-index: 10; }
        .final-toggle { display: flex; gap: 8px; padding: 8px 12px; background: #37474f; border-bottom: 2px solid #cfd8dc; flex-shrink: 0; }
        .final-toggle-btn { flex: 1; padding: 6px 10px; border-radius: 20px; border: 1px solid #b0bec5; background: #546e7a; color: #cfd8dc; font-size: 0.78rem; font-weight: bold; cursor: pointer; transition: 0.15s; }
        .final-toggle-btn.active { background: #ffc107; color: #263238; border-color: #ffc107; }
        .sidebar-list { flex-grow: 1; overflow-y: auto; padding-bottom: 50px; }
        .section-header { padding: 15px 18px 8px; font-size: 1.1rem; font-weight: 900; background: #f4f4f4; border-top: 1px solid #ddd; border-bottom: 1px solid #ddd; position: sticky; top: 0; }
        .indiv-header { color: var(--indiv-purple); }
        .sync-header { color: var(--sync-teal); }
        .class-header { padding: 10px 18px; font-weight: bold; background: #fafafa; border-bottom: 1px solid #eee; }
        .athlete-item { padding: 10px 18px 10px 25px; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; font-size: 0.9rem; }
        .athlete-name { flex-grow: 1; }
        .round-box { display: flex; gap: 5px; flex-shrink: 0; margin-left: 10px; }
        .r-dot { width: 28px; height: 28px; border-radius: 6px; font-size: 0.75rem; display: flex; align-items: center; justify-content: center; background: var(--status-none); color: #b0bec5; border: 2px solid transparent; cursor: pointer; font-weight: bold; }
        .r-dot.not-submitted { background: #ffcdd2; color: #c62828; border: 2px solid #ef9a9a; }
        .r-dot.pre-check { background: #cfd8dc; color: #37474f; border: 2px solid #90a4ae; }
        .r-dot.in-check  { background: var(--status-submitted); color: white; border-color: var(--status-submitted); }
        .r-dot.approved  { background: var(--status-ok); color: white; border-color: var(--status-ok); }
        .r-dot.active { border-color: #000 !important; transform: scale(1.1); box-shadow: 0 0 10px rgba(0,0,0,0.3); }
        .no-sub-view { margin: 40px auto; max-width: 500px; text-align: center; padding: 40px 30px; background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        .no-sub-badge { display: inline-block; background: #ffcdd2; color: #c62828; font-size: 1.1rem; font-weight: 900; padding: 6px 20px; border-radius: 20px; margin-bottom: 16px; }
        .no-sub-name { font-size: 1.4rem; font-weight: 900; color: #202124; margin-bottom: 6px; }
        .no-sub-meta { font-size: 0.9rem; color: #5f6368; margin-bottom: 24px; }
        .dot-legend { display: flex; gap: 12px; flex-wrap: wrap; padding: 8px 14px; background: #f5f5f5; border-radius: 8px; margin-top: 8px; font-size: 0.72rem; color: #546e7a; align-items: center; }
        .dot-legend-item { display: flex; align-items: center; gap: 4px; }
        .dot-legend-dot { width: 14px; height: 14px; border-radius: 3px; border: 1.5px solid transparent; flex-shrink: 0; }
        .main-viewer { flex-grow: 1; overflow-y: auto; padding: 30px; }
        .card-preview { background: white; width: 100%; max-width: 700px; margin: 0 auto; padding: 35px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.06); }
        #viewer-placeholder { margin-top: 120px; text-align: center; color: #90a4ae; font-size: 1.2rem; }
        .skill-table { width: 100%; border-collapse: collapse; margin: 20px 0; table-layout: fixed; }
        .skill-table th, .skill-table td { padding: 9px 8px; border-bottom: 1px solid #eee; text-align: center; font-size: 0.9rem; }
        .skill-table th { color: #78909c; font-size: 0.75rem; text-transform: uppercase; background: #fafafa; }
        .skill-num { width: 40px; color: #90a4ae; font-weight: bold; }
        .skill-dir { width: 70px; color: #5f6368; font-size: 0.85rem; }
        .skill-sym { text-align: left; font-family: monospace; }
        .skill-dd  { width: 55px; }
        .skill-des { width: 32px; }
        .skill-des-mark { color: #f57c00; font-size: 1.1rem; font-weight: bold; }
        .skill-row-dimmed td { color: #b0bec5; }
        .des-info { margin-top: 10px; padding: 8px 14px; border-radius: 8px; font-size: 0.88rem; font-weight: bold; }
        .des-info.zero  { background: #fce4ec; color: #c62828; }
        .des-info.ok    { background: #e8f5e9; color: #1e8e3e; }
        .des-info.warn  { background: #fff3e0; color: #e65100; }
        .dd-summary { margin-top: 16px; background: #e8f0fe; border: 2px solid var(--accent); border-radius: 12px; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
        .dd-sub { font-size: 0.95rem; color: #5f6368; line-height: 1.8; white-space: nowrap; }
        .dd-sub strong { font-weight: 900; color: #202124; font-size: 1.1rem; }
        .dd-total-wrap { text-align: right; }
        .dd-total-label { font-size: 0.65rem; font-weight: bold; color: var(--accent); text-transform: uppercase; letter-spacing: 0.05em; }
        .dd-total-val { font-size: 2.4rem; font-weight: 900; color: var(--accent); line-height: 1; }
        .actions-section { margin-top: 25px; border-top: 1px solid #eee; padding-top: 20px; }
        .btn-group { display: flex; gap: 10px; }
        .btn-status { flex: 1; padding: 12px 8px; border-radius: 10px; font-size: 0.95rem; font-weight: bold; cursor: pointer; transition: 0.2s; white-space: nowrap; border: 2px solid transparent; background: #f5f5f5; color: #999; }
        .btn-status:hover { filter: brightness(0.95); }
        .btn-status.active-0 { background: #cfd8dc; color: #37474f; border-color: #90a4ae; }
        .btn-status.active-1 { background: var(--status-submitted); color: white; border-color: var(--status-submitted); }
        .btn-status.active-2 { background: var(--status-ok); color: white; border-color: var(--status-ok); }
        .btn-next { width: 100%; margin-top: 10px; padding: 14px; border-radius: 10px; border: none; background: var(--accent); color: white; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-next:hover { background: #1558b0; }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-header">
         <h1 style="margin:0 0 5px 0;">競技カードチェック</h1>
        <div id="event-name" style="font-size:0.9em;">読み込み中...</div>
        <a href="admin_menu.html" id="menu-back" style="color:white; font-size:0.8em; display:block; margin-top:10px;">← 管理者メニューへ</a>
    </div>
    <div class="dot-legend">
        <div class="dot-legend-item"><div class="dot-legend-dot" style="background:#e0e0e0;border-color:#bdbdbd;"></div>未取得</div>
        <div class="dot-legend-item"><div class="dot-legend-dot" style="background:#ffcdd2;border-color:#ef9a9a;"></div>未提出</div>
        <div class="dot-legend-item"><div class="dot-legend-dot" style="background:#cfd8dc;border-color:#90a4ae;"></div>提出済</div>
        <div class="dot-legend-item"><div class="dot-legend-dot" style="background:#0288d1;border-color:#0288d1;"></div>確認中</div>
        <div class="dot-legend-item"><div class="dot-legend-dot" style="background:#388e3c;border-color:#388e3c;"></div>確認済</div>
    </div>
    <div class="final-toggle">
        <button class="final-toggle-btn active" id="btn-all-mode" onclick="window.setFinalMode(false)">全ラウンド</button>
        <button class="final-toggle-btn" id="btn-final-mode" onclick="window.setFinalMode(true)">🏆 決勝のみ</button>
    </div>
    <div id="sidebar-list" class="sidebar-list"></div>
</div>
<div class="main-viewer" id="main-viewer">
    <div id="viewer-placeholder">サイドバーから<br>チェックする演技を選択してください</div>
</div>

<script type="module">
    import { db } from "./firebase-config.js";
    import { doc, collection, getDocs, getDoc, updateDoc, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { normalizeClassRules, calcBonus } from "./shared.js";
    import { getTournament, getAthletes, getSkills } from "./cache.js";
    const params = new URLSearchParams(location.search);
    const eventIdParam = params.get('event');
    const eventId = eventIdParam ? eventIdParam.trim() : null;

    let athletes = [], submissions = new Map(), classRules = { individual: {}, synchro: {} }, skillMaster = [];
    let currentSelection = { athleteId: null, round: null };
    let finalOnlyMode = false;

    window.setFinalMode = function(isFinal) {
        finalOnlyMode = isFinal;
        document.getElementById('btn-all-mode').classList.toggle('active', !isFinal);
        document.getElementById('btn-final-mode').classList.toggle('active', isFinal);
        currentSelection = { athleteId: null, round: null };
        document.getElementById('main-viewer').innerHTML = '<div id="viewer-placeholder">サイドバーから<br>チェックする演技を選択してください</div>';
        renderSidebar();
    };

    async function init() {
        if (!eventId) { document.body.innerHTML = "<h1>大会IDが見つかりません</h1><a href=\"admin_index.html\">大会選択に戻る</a>"; return; }
        const fromJudge = params.get('from') === 'judge';
        const backEl = document.getElementById('menu-back');
        if (fromJudge) {
            backEl.href = `judge_menu.html?event=${eventId}`;
            backEl.textContent = '← 審判用メニューへ';
        } else {
            backEl.href = `admin_menu.html?event=${eventId}`;
        }
        document.getElementById('sidebar-list').innerHTML = '<div style="padding:20px; color:#90a4ae; font-size:0.9rem;">読み込み中...</div>';

        const [tourData, athleteList, skillMasterData] = await Promise.all([
            getTournament(eventId),
            getAthletes(eventId),
            getSkills()
        ]);
        skillMaster = skillMasterData;

        if (tourData) {
            document.getElementById('event-name').innerText = tourData.name;
            classRules = normalizeClassRules(tourData.classRules);
        }
        athletes = athleteList;
        
        renderSidebar();
        const firstTarget = findNextTarget();
        if (firstTarget) {
            showDetail(firstTarget.athleteId, firstTarget.round);
        }
    }

    function renderSidebar() {
        const listEl = document.getElementById('sidebar-list');

        if (finalOnlyMode) {
            // 決勝モード: finalOrder が設定された選手のみ、finalOrder 順に表示
            const finalists = athletes
                .filter(function(a) { return a.finalOrder != null; })
                .sort(function(a, b) { return (a.finalOrder || 999) - (b.finalOrder || 999); });

            let finalHtml = '';
            if (finalists.length === 0) {
                finalHtml = '<div style="padding:20px; color:#90a4ae; font-size:0.9rem;">決勝進出選手が設定されていません。<br>「決勝試技順処理」で設定してください。</div>';
            } else {
                let currentType = null;
                finalists.forEach(function(ath) {
                    const athType = ath.type || 'individual';
                    if (athType !== currentType) {
                        currentType = athType;
                        const headerClass = athType === 'synchro' ? 'sync-header' : 'indiv-header';
                        finalHtml += '<div class="section-header ' + headerClass + '">🏆 決勝 — ' + (athType === 'synchro' ? 'シンクロ' : '個人') + '</div>';
                    }
                    const athName = ath.type === 'synchro' ? ath.name1 + ' / ' + ath.name2 : ath.name1;
                    const clubName = ath.type === 'synchro' ? (ath.club1 === ath.club2 ? ath.club1 : ath.club1 + ' / ' + ath.club2) : '(' + ath.club1 + ')';
                    const itemStyle = ath.id === currentSelection.athleteId ? 'background:#f0f7ff; border-left: 4px solid var(--accent);' : '';
                    const dot = createDot(ath.id, 'final', 'F');
                    finalHtml += '<div class="athlete-item" style="' + itemStyle + '">' +
                        '<div class="athlete-name"><strong>' + ath.finalOrder + '.</strong> ' + athName + ' <small>' + clubName + '</small></div>' +
                        '<div class="round-box">' + dot + '</div>' +
                    '</div>';
                });
            }
            listEl.innerHTML = finalHtml;
            return;
        }

        const groupedAthletes = athletes.reduce(function(acc, ath) {
            const type = ath.type || 'individual';
            const className = ath.class || 'N/A';
            const gender = ath.gender || 'N/A';
            const key = type + '-' + className + '-' + gender;
            if (!acc[key]) acc[key] = [];
            acc[key].push(ath);
            return acc;
        }, {});

        const sortedGroupKeys = Object.keys(groupedAthletes).sort(function(a, b) {
            const partsA = a.split('-');
            const partsB = b.split('-');
            if (partsA[0] !== partsB[0]) return partsA[0].localeCompare(partsB[0]);
            if (partsA[1] !== partsB[1]) return partsA[1].localeCompare(partsB[1]);
            return partsA[2].localeCompare(partsB[2]);
        });

        let finalHtml = '';
        let currentType = null;

        for (const key of sortedGroupKeys) {
            const [type, className, gender] = key.split('-');
            if (type !== currentType) {
                currentType = type;
                const headerClass = type === 'synchro' ? 'sync-header' : 'indiv-header';
                finalHtml += '<div class="section-header ' + headerClass + '">' + (type === 'synchro' ? 'シンクロ競技' : '個人競技') + '</div>';
            }

            finalHtml += '<div class="class-header">' + className + ' ' + gender + '</div>';

            const groupAthletes = groupedAthletes[key].sort(function(a,b) { return (a.order || 999) - (b.order || 999); });

            groupAthletes.forEach(function(ath) {
                const athType = ath.type || 'individual';
                const rules = (classRules[athType] && classRules[athType][ath.class]) ? classRules[athType][ath.class] : { qualifyingRoutines: 1, hasFinal: false };

                let dots = '';
                for(let i = 1; i <= rules.qualifyingRoutines; i++) dots += createDot(ath.id, 'pre' + i, 'R' + i);
                if(rules.hasFinal) dots += createDot(ath.id, 'final', 'F');

                const athName = ath.type === 'synchro' ? ath.name1 + ' / ' + ath.name2 : ath.name1;
                const clubName = ath.type === 'synchro' ? (ath.club1 === ath.club2 ? ath.club1 : ath.club1 + ' / ' + ath.club2) : '(' + ath.club1 + ')';
                const itemStyle = ath.id === currentSelection.athleteId ? 'background:#f0f7ff; border-left: 4px solid var(--accent);' : '';

                finalHtml += '<div class="athlete-item" style="' + itemStyle + '">' +
                            '<div class="athlete-name">' + ath.order + '. ' + athName + ' <small>' + clubName + '</small></div>' +
                            '<div class="round-box">' + dots + '</div>' +
                        '</div>';
            });
        }

        listEl.innerHTML = finalHtml;
    }

    // 全選手の提出ステータスを Firestore から再取得してサイドバーを更新
    async function refreshAllSubmissions() {
        try {
            // 全選手×ラウンドを null（未提出）でリセット
            athletes.forEach(function(ath) {
                const athType = ath.type || 'individual';
                const rules = (classRules[athType] && classRules[athType][ath.class]) || { qualifyingRoutines: 1, hasFinal: false };
                for (let i = 1; i <= (rules.qualifyingRoutines || 1); i++) {
                    submissions.set(eventId + '_' + ath.id + '_pre' + i, null);
                }
                if (rules.hasFinal) submissions.set(eventId + '_' + ath.id + '_final', null);
            });
            // Firestore から最新の提出を全件取得して上書き
            const snap = await getDocs(query(collection(db, 'submissions'), where('eventId', '==', eventId)));
            snap.forEach(function(d) { submissions.set(d.id, d.data()); });
        } catch(e) {
            console.error('Refresh error:', e);
        }
    }

    function createDot(athleteId, round, label) {
        const subId = eventId + '_' + athleteId + '_' + round;
        let statusClass = '', title = '未取得（クリックで読み込み）';
        if (submissions.has(subId)) {
            const sub = submissions.get(subId);
            if (!sub) {
                statusClass = 'not-submitted'; title = '未提出';
            } else {
                switch(sub.checkStatus) {
                    case 0: statusClass = 'pre-check'; title = '提出済・未確認'; break;
                    case 1: statusClass = 'in-check';  title = '確認中'; break;
                    case 2: statusClass = 'approved';  title = '確認済'; break;
                    default: statusClass = 'pre-check'; title = '提出済'; break;
                }
            }
        }
        const activeClass = currentSelection.athleteId === athleteId && currentSelection.round === round ? 'active' : '';
        return '<div class="r-dot ' + statusClass + ' ' + activeClass + '" title="' + title + '" onclick="window.showDetail(\'' + athleteId + '\',\'' + round + '\')">' + label + '</div>';
    }

    window.showDetail = async function(athleteId, round) {
        currentSelection = { athleteId: athleteId, round: round };
        const athlete = athletes.find(function(a) { return a.id === athleteId; });
        const viewer = document.getElementById('main-viewer');

        renderSidebar(); // アクティブ状態を即時更新

        // ローディング表示
        viewer.innerHTML = '<div id="viewer-placeholder">読み込み中...</div>';

        // 全選手分のステータスを一括更新（サイドバーも含めて全員分）
        await refreshAllSubmissions();
        renderSidebar(); // 全員のドット色を更新

        const subId = eventId + '_' + athleteId + '_' + round;
        const submission = submissions.get(subId) || null;

        if (!submission) {
            const athName = athlete ? (athlete.type === 'synchro' ? athlete.name1 + ' / ' + athlete.name2 : athlete.name1) : '—';
            const roundLabel = round.replace('pre1','予選1').replace('pre2','予選2').replace('final','決勝');
            viewer.innerHTML =
                '<div class="no-sub-view">' +
                    '<div class="no-sub-badge">未提出</div>' +
                    '<div class="no-sub-name">' + athName + '</div>' +
                    '<div class="no-sub-meta">' + (athlete ? athlete.class : '') + ' / ' + roundLabel + '</div>' +
                    '<div style="color:#90a4ae; font-size:0.9rem;">まだ競技カードが提出されていません。</div>' +
                    '<div style="margin-top:20px;">' +
                        '<button class="btn-next" onclick="window.goNext()">次の選手へ →</button>' +
                    '</div>' +
                '</div>';
            return;
        }

        const athName = athlete.type === 'synchro' ? athlete.name1 + ' / ' + athlete.name2 : athlete.name1;
        const athClub = athlete.type === 'synchro' ? athlete.club1 + ' / ' + athlete.club2 : athlete.club1;

        function resolveSkill(raw) {
            if (!raw && raw !== 0) return { symbol: '-', dd: null, direction: '', isTriple: false };
            if (typeof raw === 'object' && raw !== null) {
                // id フィールドがあれば ID で直接照合（同Symbol異注釈の技に対応）
                const found = raw.id
                    ? (skillMaster.find(m => m.id === String(raw.id)) || skillMaster.find(m => m.symbol === raw.skill))
                    : skillMaster.find(m => m.symbol === raw.skill);
                return { symbol: raw.skill || '-', dd: raw.dd ?? null, direction: found?.direction || '', isTriple: found?.isTriple || false };
            }
            const found = skillMaster.find(m => m.id === String(raw));
            return found ? { symbol: found.symbol || '-', dd: found.dd ?? null, direction: found.direction || '', isTriple: found.isTriple || false }
                         : { symbol: '-', dd: null, direction: '', isTriple: false };
        }

        const dirLabel = { '前方系': '前方', '後方系': '後方', '基礎技': '基礎' };

        // ---- 指定難度モード判定 ----
        const athType = athlete.type || 'individual';
        const cr = (classRules[athType] && classRules[athType][athlete.class]) ? classRules[athType][athlete.class] : {};
        const rawDDCount = (cr.designatedDDCount != null && cr.designatedDDCount >= 0) ? cr.designatedDDCount : -1;
        const isDesignatedMode = rawDDCount >= 0 && cr.qualifyingRoutines === 2 && cr.scoreMode === 'total' && round !== 'pre2';
        const effectiveDDCount = isDesignatedMode ? rawDDCount : -1;  // -1 = 全技有効
        const designatedSet = new Set(submission.designatedDDIndices || []);  // 0-indexed
        const showDesCol = effectiveDDCount >= 0;

        // ---- テーブル行ビルド ----
        let tableRows = '';
        let baseDD = 0, tripleCount = 0;
        for (let i = 0; i < 10; i++) {
            const s = resolveSkill((submission.skills || [])[i]);
            // 指定難度モード: -1→全有効 / 0→全無効 / N→designatedSetにあるものだけ有効
            const countsDD = effectiveDDCount < 0
                ? true
                : (effectiveDDCount > 0 && designatedSet.has(i));
            if (s.dd != null && countsDD) baseDD += s.dd;
            if (s.isTriple && countsDD) tripleCount++;

            const dimmed  = '';
            const desMark = showDesCol
                ? '<td class="skill-des">' + (countsDD && effectiveDDCount > 0 ? '<span class="skill-des-mark">★</span>' : '') + '</td>'
                : '';
            tableRows +=
                '<tr' + dimmed + '>' +
                    '<td class="skill-num">' + (i + 1) + '</td>' +
                    '<td class="skill-dir">' + (dirLabel[s.direction] || '-') + '</td>' +
                    '<td class="skill-sym">' + s.symbol + '</td>' +
                    '<td class="skill-dd">' + (s.dd != null ? s.dd.toFixed(1) : '-') + '</td>' +
                    desMark +
                '</tr>';
        }

        const gender = athlete.gender || '';
        const bonus = calcBonus(gender, tripleCount);
        const totalDD = baseDD + bonus;
        const currentStatus = submission.checkStatus ?? 0;

        // ---- 指定難度インジケーター ----
        let desInfoHtml = '';
        if (effectiveDDCount === 0) {
            desInfoHtml = '<div class="des-info zero">指定難度：0本設定（このクラスのDD得点は0点）</div>';
        } else if (effectiveDDCount > 0) {
            const chosen = designatedSet.size;
            const ok = chosen === effectiveDDCount;
            desInfoHtml = '<div class="des-info ' + (ok ? 'ok' : 'warn') + '">'
                + '指定難度：' + chosen + ' / ' + effectiveDDCount + ' 本選択'
                + (ok ? '　✓' : '　⚠ 本数不一致')
                + '</div>';
        }

        // ---- テーブルヘッダー ----
        const desHead = showDesCol ? '<th class="skill-des">指定</th>' : '';

        viewer.innerHTML =
            '<div class="card-preview">' +
                '<div style="font-size:0.9em; color:#5f6368;">' + athlete.class + ' / ' + round.replace('pre','予選').replace('final','決勝') + '</div>' +
                '<h2 style="margin:5px 0 10px 0;">' + athName + '</h2>' +
                '<div style="font-weight:bold; margin-bottom:20px;">' + (athClub || '') + '</div>' +
                '<table class="skill-table">' +
                    '<thead><tr><th class="skill-num">#</th><th class="skill-dir">系統</th><th class="skill-sym" style="text-align:left;">Symbol</th><th class="skill-dd">DD</th>' + desHead + '</tr></thead>' +
                    '<tbody>' + tableRows + '</tbody>' +
                '</table>' +
                desInfoHtml +
                '<div class="dd-summary" style="margin-top:12px;">' +
                    '<div class="dd-sub">' +
                        '基礎点：<strong>' + baseDD.toFixed(1) + '</strong><br>' +
                        'ボーナス点：<strong>' + bonus.toFixed(1) + '</strong>' +
                    '</div>' +
                    '<div class="dd-total-wrap">' +
                        '<div class="dd-total-label">Total DD</div>' +
                        '<div class="dd-total-val">' + totalDD.toFixed(1) + '</div>' +
                    '</div>' +
                '</div>' +
                '<div class="actions-section">' +
                    '<div class="btn-group">' +
                        '<button class="btn-status ' + (currentStatus === 0 ? 'active-0' : '') + '" onclick="window.updateStatus(0)">確認前</button>' +
                        '<button class="btn-status ' + (currentStatus === 1 ? 'active-1' : '') + '" onclick="window.updateStatus(1)">確認中</button>' +
                        '<button class="btn-status ' + (currentStatus === 2 ? 'active-2' : '') + '" onclick="window.updateStatus(2)">確認済</button>' +
                    '</div>' +
                    '<button class="btn-next" onclick="window.goNext()">次の選手へ →</button>' +
                '</div>' +
            '</div>';
    };

    window.updateStatus = async function(status) {
        if (!currentSelection.athleteId || !currentSelection.round) return;
        const { athleteId, round } = currentSelection;
        const subId = eventId + '_' + athleteId + '_' + round;

        document.querySelectorAll('.btn-status').forEach(b => b.disabled = true);

        try {
            await updateDoc(doc(db, "submissions", subId), {
                checkStatus: status,
                checkedAt: serverTimestamp()
            });

            const sub = submissions.get(subId);
            if(sub) sub.checkStatus = status;

            showDetail(athleteId, round);
        } catch (e) {
            console.error("Update error: ", e);
            alert("更新に失敗しました。");
            document.querySelectorAll('.btn-status').forEach(b => b.disabled = false);
        }
    };
    
    window.goNext = function() {
        const nextTarget = findNextTarget();
        if (nextTarget) {
            showDetail(nextTarget.athleteId, nextTarget.round);
        } else {
            currentSelection = { athleteId: null, round: null };
            document.getElementById('main-viewer').innerHTML = '<div id="viewer-placeholder">全てのカードの確認が完了しました！</div>';
            renderSidebar();
        }
    };

    function findNextTarget() {
        if (finalOnlyMode) {
            const sortedFinalists = athletes
                .filter(function(a) { return a.finalOrder != null; })
                .sort(function(a, b) { return (a.finalOrder || 999) - (b.finalOrder || 999); });
            const currentIdx = sortedFinalists.findIndex(function(a) { return a.id === currentSelection.athleteId; });
            const searchOrder = [...sortedFinalists.slice(currentIdx), ...sortedFinalists.slice(0, currentIdx)];
            for (const ath of searchOrder) {
                if (ath.id === currentSelection.athleteId && 'final' === currentSelection.round) continue;
                const subId = eventId + '_' + ath.id + '_final';
                // 未取得(has=false)は次候補に含める。確認済(status=2)のみスキップ
                if (submissions.has(subId)) {
                    const sub = submissions.get(subId);
                    if (sub && sub.checkStatus === 2) continue;
                }
                return { athleteId: ath.id, round: 'final' };
            }
            return null;
        }

        const sortedAthletes = [...athletes].sort(function(a, b) {
            const keyA = (a.class || '') + '-' + (a.gender || '') + '-' + String(a.order || '999').padStart(4, '0');
            const keyB = (b.class || '') + '-' + (b.gender || '') + '-' + String(b.order || '999').padStart(4, '0');
            return keyA.localeCompare(keyB);
        });

        const currentAthIndex = sortedAthletes.findIndex(function(a) { return a.id === currentSelection.athleteId; });
        const searchOrder = [...sortedAthletes.slice(currentAthIndex), ...sortedAthletes.slice(0, currentAthIndex)];

        for (const ath of searchOrder) {
            const athType = ath.type || 'individual';
            const rules = (classRules[athType] && classRules[athType][ath.class]) ? classRules[athType][ath.class] : { qualifyingRoutines: 1, hasFinal: false };

            const rounds = [];
            for(let i = 1; i <= rules.qualifyingRoutines; i++) rounds.push('pre' + i);
            if(rules.hasFinal) rounds.push('final');

            for (const r of rounds) {
                if (ath.id === currentSelection.athleteId && r === currentSelection.round) continue;
                const subId = eventId + '_' + ath.id + '_' + r;
                // 未取得は次候補に含める。確認済のみスキップ
                if (submissions.has(subId)) {
                    const sub = submissions.get(subId);
                    if (sub && sub.checkStatus === 2) continue;
                }
                return { athleteId: ath.id, round: r };
            }
        }
        return null;
    }

    init();
</script>
</body>
</html>
